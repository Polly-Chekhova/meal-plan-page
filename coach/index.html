<title>Тренерская сводка</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#E7ECEE;color:#0C2027;
    font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
  @media (prefers-color-scheme:dark){body{background:#0A1418;color:#E8EFF0}}
  form{width:100%;max-width:330px;text-align:center}
  h1{font-size:19px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
  p{font-size:13px;opacity:.65;margin:0 0 20px}
  input,button{width:100%;font:inherit;font-size:15px;padding:11px 13px;border-radius:10px;
    border:1px solid #0C202726;background:#fff;color:inherit}
  @media (prefers-color-scheme:dark){input,button{background:#142529;border-color:#ffffff26}}
  input:focus{outline:2px solid #0B6E6D;outline-offset:1px}
  button{margin-top:9px;border:none;background:#0B6E6D;color:#fff;font-weight:600;cursor:pointer;
    transition:opacity 150ms ease-out}
  button:hover{opacity:.9} button:active{scale:.98} button[disabled]{opacity:.55;cursor:default}
  .err{color:#9A5709;font-size:13px;min-height:18px;margin-top:11px}
  @media (prefers-color-scheme:dark){.err{color:#E5A55C}}
</style>
</head>

</form>
