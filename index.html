n Grana Padano, return the prawns, finish with parsley."],"notes":["Parmesan swapped for Grana Padano per the pantry rules.","Just under the 700 kcal/serving ceiling — keep the oil/pasta as listed."]},"dinner/ready-meals/quick-beef-and-broccoli-noodles":{"id":"dinner/ready-meals/quick-beef-and-broccoli-noodles","name":"Quick beef and broccoli noodles","meal":"dinner","servings":4,"calories":664,"protein":31.4,"carbs":52.4,"fat":35.2,"isBase":false,"description":"One-pan beef mince with broccoli and egg noodles in a hoisin sauce. Makes 4. Source: simplehomeedit.com.","ingredients":["**Sauce:**","- 1 tbsp dark soy sauce (Soy sauce, Kikkoman)","- 60ml hoisin sauce (Hoisin sauce)","- 1 tbsp mirin (Mirin) (or rice wine vinegar)","**Stir-fry:**","- 2 tbsp (28g) olive oil","- 1 (~110g) onion, sliced","- 1 tsp (3g) garlic, raw, minced","- 500g minced (ground) beef, 85% lean, raw","- 120g broccolini / broccoli florets","- 435ml water","- 200g egg noodles, dried (thin)","- 1 tbsp (~9g) cornstarch (Maizena)","- 2 tbsp (32g) tamari or soy sauce (optional)","- 1 tsp (3g) sesame seeds","- 1 (~15g) spring onion, sliced","- Chilli oil, to serve (optional)"],"method":["Cook the onion and garlic; brown the beef; add the sauce and caramelise.","Add the broccoli; cook covered.","Push to the sides; add water and uncooked noodles to the centre; cook 2 min covered, stirring halfway.","Toss the noodles through. Add cornflour slurry; cook 1–2 min until thickened.","Finish with sesame seeds and spring onion."],"notes":["Under the 700 kcal/serving ceiling."]},"dinner/ready-meals/quick-beef-pho":{"id":"dinner/ready-meals/quick-beef-pho","name":"Quick beef pho","meal":"dinner","servings":4,"calories":382,"protein":20.2,"carbs":57.5,"fat":5.4,"isBase":false,"description":"Cheat's Vietnamese beef pho — aromatic broth, rice noodles and thinly sliced beef. Makes 4. Source: simplehomeedit.com. > Prepared beef stock contributes minimal calories.","ingredients":["**Broth:**","- 200g rice noodles, flat/thick, dried","- 2 litres beef stock (Knorr-style), low-sodium","- 4 garlic cloves (12g), bruised","- ~15g ginger, raw, sliced","- 2 star anise","- 4 cloves","- 1 tbsp (16g) fish sauce","- 1 tbsp (12g) brown sugar","- 300g beef tenderloin (eye fillet), very finely sliced","**To serve:**","- 2 handfuls (~100g) bean sprouts (mung)","- ½ bunch coriander","- 1 lime, wedges","- 1 (~110g) red onion, sliced","- 60ml hoisin sauce (Hoisin sauce)","- Sriracha, fresh chilli, spring onion (optional)"],"method":["Cook the rice noodles per packet (reduce by 2 min); rinse and drain.","Simmer the stock with garlic, ginger, star anise and cloves 18 min; remove the solids. Stir in fish sauce and sugar.","Drop the sliced beef into the broth ~30 sec to just cook.","Assemble bowls with noodles and beef; ladle over the broth; garnish."],"notes":["Under the 700 kcal/serving ceiling."]},"dinner/ready-meals/roasted-garlic-butter-chicken":{"id":"dinner/ready-meals/roasted-garlic-butter-chicken","name":"Roasted Garlic Butter Chicken","meal":"dinner","servings":4,"calories":658,"protein":41,"carbs":2,"fat":53,"isBase":false,"description":"Oven-roasted garlic-butter chicken thigh cutlets. Originally 5 servings, scaled to 4. Serve with mash and greens (not included in macros).","ingredients":["- 64 g unsalted butter, room temp (Butter, unsalted)","- 1¼ tsp sea salt flakes (Salt)","- ¼ tsp freshly cracked black pepper (Black pepper, ground)","- ¾ tbsp freshly minced garlic (~7 g) (Garlic, raw)","- ¾ tbsp honey (~16 g) (Honey — BM)","- 1½ tsp thyme leaves (Thyme, fresh)","- 1 kg bone-in, skin-on chicken thigh cutlets (Bone-in, skin-on chicken thigh cutlets)","- 100 ml chicken stock (Chicken stock — Knorr)"],"method":["Mix softened butter with garlic, honey, thyme, salt and pepper.","Rub over chicken cutlets.","Roast at 200°C ~35–40 min until skin is golden and cooked through, basting with stock."],"notes":["Scaled from 5 servings to 4 (per-serving values unchanged).","Slightly over the 650 kcal target (under the 700 ceiling) due to skin-on cutlets + butter.","Mash and greens serving suggestion not included in macros."]},"dinner/ready-meals/rotisserie-style-baked-chicken-breast":{"id":"dinner/ready-meals/rotisserie-style-baked-chicken-breast","name":"Rotisserie-Style Baked Chicken Breast","meal":"dinner","servings":4,"calories":389,"protein":57,"carbs":5,"fat":17,"isBase":false,"description":"Whole baked chicken breasts, dry-brined and marinated, rotisserie-style. Makes 4 servings.","ingredients":["**Chicken**","- 4 large boneless, skinless chicken breasts, 220–250 g each (~940 g, Hacendado)","- 1 tsp cooking salt (for dry brine)","**Marinade**","- 60 ml olive oil (~56 g)","- 2 tsp sweet paprika","- 1 tsp garlic powder","- 1 tsp onion powder","- ½ tsp dried oregano or thyme","- ¼ tsp freshly cracked black pepper","- 2 tsp brown sugar","- ½ tsp cooking salt"],"method":["Preheat oven to 220°C.","Pat chicken dry and season with salt; refrigerate while the oven preheats.","Mix the marinade and coat the chicken evenly.","Bake covered with foil 12–15 minutes.","Uncover, spoon pan juices over the chicken, and bake uncovered ~12 minutes until golden.","Rest 10 minutes before serving."],"notes":["Computed 389 kcal/serving vs site 265 — the gap is the ¼ cup (56 g) marinade oil, much of which drains onto the tray rather than being eaten; counted in full here as a conservative upper bound. No unit-conversion error.","Serving suggestions (coleslaw, wedges, tzatziki, pita) are not counted."]},"dinner/ready-meals/shirataki-bolognese":{"id":"dinner/ready-meals/shirataki-bolognese","name":"Shirataki bolognese","meal":"dinner","servings":1,"calories":475,"protein":53,"carbs":41,"fat":13,"isBase":false,"description":"The most iconic Italian meat sauce. Single portion. 30 min. From The Felu Cookbook (p. 307).","ingredients":["- 200 g shirataki","- 180 g ground beef 95/5","- 1 carrot (100 g)","- 100 g celery","- 1 medium onion (50 g)","- 2 cloves of garlic (≈6 g)","- 9 g dry gelatine","- 40 g tomato puree","- 2 g oil","- 250 g water","- 10 g vegetable broth powder","- Salt and black pepper"],"method":["Remove shirataki from the package and rinse it under cold water for 30 seconds until the entire liquid is washed away. Let the shirataki sit in the sink until the end of the recipe.","Chop up carrots, celery and onions into roughly equal size pieces.","Add oil to a pan (24cm/9.5inch) on medium-high heat. Add ground beef and fry on one side for 1 minute.","Add in the vegetables except for the garlic and mix everything and keep frying for another 3-4 minutes until the vegetables have some color.","Peel and grate in the garlic and fry for 20 seconds. Add in tomato puree and mix everything until beef and vegetables turn red.","Mix water with broth powder and gelatine in a separate glas.","Add broth into the pan, stir until combined and let it simmer for around 15-20 min on medium-low heat without a lid.","Dry fry shirataki in a nonstick pan until the water has evaporated. Add in bolognese to the shirataki and mix. Bolognese will be enough for two servings. Done!"],"notes":["Add Chili flakes for more heat.","Top with parsley or basil for some freshness.","Macros recomputed from our per-100g ingredient tables: 475 kcal for the portion vs the book's 442 kcal (whole recipe)."]},"dinner/ready-meals/shirataki-lo-mein":{"id":"dinner/ready-meals/shirataki-lo-mein","name":"Shirataki lo mein","meal":"dinner","servings":1,"calories":392,"protein":51,"carbs":38,"fat":6,"isBase":false,"description":"Lo Mein is the Chinese way to add a lot of flavor to noodles and we’re here for it! Single portion. 20 min. From The Felu Cookbook (p. 308).","ingredients":["- 200 g shirataki","- 1 chicken breast (180 g)","- 200 g cabbage","- 1 carrot (100 g)","- 1 medium onion (50 g)","- 25 g soy sauce","- 15 g oyster sauce","- 2 cloves of garlic (≈6 g)","- 4 g oil"],"method":["Remove shirataki from the package and rinse it under cold water for 30 seconds until the entire liquid is washed away. Let the shirataki sit in the sink until the end of the recipe.","Chop up the cabbage, carrots and onion into equal bite-size pieces.","Cut the chicken breast into strips.","Add 2 g oil to a pan (24cm/9.5inch) on medium-high heat. Add the chicken and fry on each side for 1 minute until both sides have color. Remove from the pan into a separate plate.","Add in cabbage, carrots and onion into a pan with 2 g oil. Keep frying for 6-7 minutes until vegetables are soft and have color.","Peel and grate in the garlic and fry for 20 seconds.","Remove all vegetables to a plate with chicken.","Add in the shirataki noodles, and dry fry them until the liquid has evaporated, around 2 minutes.","Add back in the chicken and vegetables and mix. Combine soy and oyster sauce in a separate glass.","Add in sauce and mix everything for 30 seconds. Done!"],"notes":["Add cornstarch slurry at the end to get a thicker sauce.","If there isn’t enough sauce, then add more soy sauce. Always 20g at a time.","Macros recomputed from our per-100g ingredient tables: 392 kcal for the portion vs the book's 392 kcal (whole recipe)."]},"dinner/ready-meals/shirataki-ramen":{"id":"dinner/ready-meals/shirataki-ramen","name":"Shirataki ramen","meal":"dinner","servings":1,"calories":422,"protein":46,"carbs":29,"fat":14,"isBase":false,"description":"Ramen is life - that’s all I’ve got to say! Single portion. 25 min. From The Felu Cookbook (p. 312).","ingredients":["- 200 g shirataki","- 180 g ground beef 95/5","- 30 g miso paste","- 10 g gochujang","- 150 g pak choi","- 1 medium onion (50 g)","- 1 clove of garlic (≈3 g)","- 1 piece of fresh ginger (thumb size) (≈10 g)","- 250 g water","- 3 g oil"],"method":["Remove shirataki from the package and rinse it under cold water for 30 seconds until the entire liquid is washed away. Let the shirataki sit in the sink until the end of the recipe.","Chop up the onion and Pak choi. Peel and grate garlic and ginger.","Place a pot (20cm/8inch) on a stove on medium heat. Add 2g of oil and start frying the onion and the pak choi for 3-4 minutes.","Switch the heat to medium-high and add the beef. Try to separate the beef with a spatula, so as much beef as possible gets in contact with the pan. Fry the beef for 2 minutes.","Add ginger and garlic with another touch of oil and keep frying for 20 seconds.","Add Gochujang and Miso paste. Stir everything and add the water. Now let the broth simmer for 5 minutes on medium-low heat.","Meanwhile, heat up a pan to medium-high without any oil. Add the shirataki noodles and dry fry them for 4-5 minutes until the entire water is evaporated.","Transfer shirataki into the pot with the ramen and let it cook for one additional minute. Done!"],"notes":["You can top the ramen with spring or/and pickled onions. Add a soft-boiled egg to enhance this dish even further.","Swap out shirataki for ramen noodles for the real deal.","Macros recomputed from our per-100g ingredient tables: 422 kcal for the portion vs the book's 374 kcal (whole recipe)."]},"dinner/ready-meals/shirataki-scampi-sauce":{"id":"dinner/ready-meals/shirataki-scampi-sauce","name":"Shirataki scampi sauce","meal":"dinner","servings":1,"calories":293,"protein":33,"carbs":22,"fat":10,"isBase":false,"description":"Spicy prawn sauces are great in combination with shirataki noodles! Single portion. 20 min. From The Felu Cookbook (p. 306).","ingredients":["- 200 g shirataki","- 150 g frozen prawns","- 150 g tomatoes","- 3 cloves of garlic (≈9 g)","- 9 g oil","- 10 g gochujang","- 2 g cornstarch","- 100 g water"],"method":["Remove Shirataki from the package and rinse it under cold water for 30 seconds until the entire liquid is washed away. Let the shirataki sit in the sink until the end of the recipe.","Cut tomatoes into halves. Peel and grate garlic.","If you buy frozen prawns, fill up a bowl with cold water, add in the frozen prawns and let them sit on the counter for 10-15 min. They will be ready to be cooked later.","Add gochujan
