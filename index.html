 g oil","- Salt and black pepper"],"method":["Pierce the potato with a knife or fork and air fry it for 30-45 minutes at 200°C or 400°F. Alternatively, you can use the oven.","Prepare either tzatziki or bbq dip, see recipes.","Chop the onion and the red bell pepper. Slice the chicken breast into thin strips and season with salt, pepper, and garlic powder","Heat up a pan (24cm/9,5inch) to medium heat and add some oil. Add in onions and the bell pepper with a pinch of salt and let it fry for 3-4 minutes, stirring occasionally.","Make some space, add more oil and now the chicken breast. Separate the chicken and fry each side for 1-2 minutes.","Once the potato is ready, cut it in half and fill it with the cooked chicken and vegetables. Finish by topping it with the chosen sauce. Done!"],"notes":["1. Wait with frying the chicken until the sweet potato is almost done so you make sure that they both are ready at the same time.","2. You can also make both the sauces and dip the chicken in both.","Macros recomputed from our per-100g ingredient tables: 609 kcal for the batch vs the book's 598 kcal (whole recipe)."]},"dinner/ready-meals/fried-rice":{"id":"dinner/ready-meals/fried-rice","name":"Fried rice","meal":"dinner","servings":1,"calories":669,"protein":63,"carbs":75,"fat":13,"isBase":false,"description":"One of the most iconic rice dishes but made low in calories and packed with protein. Single portion. 25 min. From The Felu Cookbook (p. 64).","ingredients":["- 1 chicken breast (180 g)","- 50 g raw rice","- 1 egg (≈55 g)","- 1 red bell pepper (150 g)","- 1 medium onion (50 g)","- 1 carrot (100 g)","- 50 g peas","- 1 clove of garlic (≈3 g)","- 1 piece of fresh ginger (thumb size) (≈10 g)","- 25 g soy sauce","- 4 g oil","- Black pepper"],"method":["Rinse the rice under cold water to remove excess starch. Add rice with 125g of water and a pinch of salt into a pot (18cm or 7inch diameter).","Put the pot on a stove on high heat. As soon the water starts to boil, reduce the heat to low, close the lid and let it simmer for 12-15 minutes.","Cut chicken breast, onion, pepper and carrot into bite size pieces.","Preheat a pan to medium-high heat, and add 2g of oil before adding the chicken.","Fry chicken on both sides for 60 seconds. Remove it from the pan and place on a plate even if the chicken is not fully cooked.","Add 2g of oil again to the same pan. Add in carrot, onion and pepper and fry under occasional stirring for 3-5 minutes.","Add in garlic and ginger and keep frying for 20 seconds.","Add cooked rice to the pan and stir everything. Keep frying for another 1-2 minutes.","Now add the egg and keep frying for a further minute.","Next comes the peas with black pepper. Mix everything together.","Add the chicken back to the pan with soy sauce and keep frying for 30 seconds until the chicken is hot again. Done!"],"notes":["After cooking, let the rice sit in the hot pot to remove all the liquid. This will help make the rice less clumpy.","If you have left over rice the recipe works even better.","Macros recomputed from our per-100g ingredient tables: 669 kcal for the portion vs the book's 627 kcal (whole recipe)."]},"dinner/ready-meals/garlic-prawn-shrimp-olive-oil-spaghetti":{"id":"dinner/ready-meals/garlic-prawn-shrimp-olive-oil-spaghetti","name":"Garlic prawn (shrimp) olive oil spaghetti","meal":"dinner","servings":4,"calories":680,"protein":40.7,"carbs":79.2,"fat":22.1,"isBase":false,"description":"Garlicky olive-oil prawn spaghetti with cherry tomatoes, chilli and lemon. Parmesan swapped for Grana Padano.","ingredients":["- 400g spaghetti","- 80ml (⅓ cup) extra-virgin olive oil, plus extra to serve","- 4 garlic cloves, finely sliced","- ½ tsp chilli (red pepper) flakes (optional)","- 250g cherry tomatoes, halved","- ¼ tsp sea salt flakes, plus extra","- ¼ tsp freshly cracked black pepper, plus extra","- 500g raw prawns (shrimp), deveined and patted dry","- 1 tbsp fresh lemon juice","- 15g chopped flat-leaf parsley","- Grana Padano, to serve (was parmesan)"],"method":["Cook pasta in salted water until al dente; reserve 250ml pasta water before draining.","Heat olive oil over low heat. Add garlic and chilli flakes, cook 1–2 minutes until light golden.","Stir in cherry tomatoes with salt and pepper; cook 1–2 minutes until softened.","Increase heat to medium, add prawns; cook 60–90 seconds per side until pink.","Add drained pasta plus 125ml reserved water; toss until glossy.","Off the heat, stir through lemon juice and parsley; season.","Serve with olive oil, Grana Padano and extra pepper."],"notes":["Parmesan swapped for Grana Padano.","Computed 680 kcal/serving, matching the site's 641 within tolerance — under the 700 meal ceiling."]},"dinner/ready-meals/garlicky-bbq-chicken-kebabs":{"id":"dinner/ready-meals/garlicky-bbq-chicken-kebabs","name":"Garlicky BBQ Chicken Kebabs","meal":"dinner","servings":4,"calories":377,"protein":51,"carbs":6,"fat":18,"isBase":false,"description":"Marinated chicken-thigh skewers, griddled or barbecued. Makes 4 servings (12 skewers).","ingredients":["- 800 g boneless, skinless chicken thighs, cut into bite-sized pieces (Hacendado)","- 1 tbsp sweet paprika","- 1 tbsp freshly minced garlic (~9 g)","- 60 ml (¼ cup) olive oil (~56 g)","- 1 tbsp red wine vinegar","- 1 tbsp brown sugar","- 2 tsp sea salt flakes","- ½ tsp freshly cracked black pepper","- 12 bamboo or metal skewers"],"method":["Soak bamboo skewers for 10 minutes if using.","Combine paprika, garlic, olive oil, vinegar, brown sugar, salt, and pepper with the chicken.","Thread marinated chicken onto skewers.","Cook on a preheated barbecue or griddle pan over medium-high heat for 8–10 minutes, turning regularly.","Rest loosely covered in foil for 3–5 minutes before serving."],"notes":["Computed 377 kcal/serving vs site 387 — in agreement."]},"dinner/ready-meals/ginger-lemon-chicken":{"id":"dinner/ready-meals/ginger-lemon-chicken","name":"Ginger lemon chicken","meal":"dinner","servings":1,"calories":610,"protein":54,"carbs":79,"fat":9,"isBase":false,"description":"A refreshing chicken meal that you need to try! Single portion. 20 min. From The Felu Cookbook (p. 76).","ingredients":["- 1 chicken breast (180 g)","- 60 g raw rice","- 125 g water","- 2 cloves of garlic (≈6 g)","- 2 pieces of fresh ginger (thumb size) (≈20 g)","- 1 chili (50 g)","- 1 red bell pepper (150 g)","- 10 g lemon zest","- 25 g soy sauce","- 10 g rice vinegar","- 10 g honey","- 0.5 g cornstarch","- 6 g oil","- Salt"],"method":["Start by adding rice and 125g of water to a pot with a pinch of salt.","Put the stove on high heat, and as soon as the water starts to boil, turn the heat down to low, close the lid and let it simmer for 12-15 min.","Cut the chicken into strips and then into bite-sized pieces.","Chop the chili and bell pepper. Peel and grate the garlic and ginger. Peel a quarter of a lemon and chop up the zest.","In a bowl, add soy sauce, rice vinegar, honey, and corn starch, and mix until combined.","Add 3g of oil to a pan on medium heat. Add the chicken with a pinch of salt and stir-fry both sides for 1 minute. Then remove the chicken from the pan.","Add 3g of oil to the pan, then add the chili, bell pepper, and lemon zest. Add another small pinch of salt, then stir-fry for 3 minutes.","Add the garlic and ginger, stir for 2 seconds, then return the chicken and the sauce. Stir-fry for another 20 seconds, then remove from the heat.","Plate the rice into a bowl and top with the chicken. Done!"],"notes":["You can add 1/2 sliced avocado if it fits your macros. Avocado tastes great here.","Macros recomputed from our per-100g ingredient tables: 610 kcal for the portion vs the book's 597 kcal (whole recipe)."]},"dinner/ready-meals/green-curry":{"id":"dinner/ready-meals/green-curry","name":"Green curry","meal":"dinner","servings":1,"calories":742,"protein":55,"carbs":65,"fat":30,"isBase":false,"description":"Curry is super underrated in my opinion. And it is perfect with chicken and rice and will add a ton of flavor without too many calories. Single portion. 20 min. From The Felu Cookbook (p. 120).","ingredients":["- 1 chicken breast (180 g)","- 50 g raw rice","- 125 g water","- 250 g frozen wok vegetables","- 20 g green curry paste","- 100 g coconut milk","- ½ lime (juice) (≈15 g)","- 5 g chicken stock powder","- 5 g oil"],"method":["Add water to the rice in a pot (18cm or 7inch diameter) with a pinch of salt. Place it on a stove on high heat.","As soon the water starts to boil, reduce the heat to low, close the lid and let it simmer for 12-15 minutes.","Cut the chicken into strips. And mix 100 g of water with 1 tsp chicken stock in a glass.","Add oil into a pan (24cm/9,5inch) on medium-high heat and add in the curry paste. Fry it for 30 seconds.","Add chicken stock and coconut milk to a pot and let it simmer for 1 minute.","Turn the heat to high, add the frozen vegetables, close the lid and wait until it starts to simmer again. This will take 2 minutes because of the frozen vegetables.","Turn down the heat to medium-low and add in the chicken. Let it simmer for around 4-5 minutes until the chicken is done.","Squeeze lime juice into the curry. Put rice into a bowl and add the curry on top. Done!"],"notes":["Instead frozen vegetables, you can also use fresh ones of course.","Also, there is a difference between coconut creme and coconut milk. If you use coconut creme, then only use 25g and fill the rest with 75g water .","Macros recomputed from our per-100g ingredient tables: 742 kcal for the portion vs the book's 674 kcal (whole recipe)."]},"dinner/ready-meals/gyros-smashed-tacos":{"id":"dinner/ready-meals/gyros-smashed-tacos","name":"Gyros Smashed Tacos","meal":"dinner","servings":4,"calories":635,"protein":29,"carbs":44,"fat":37,"isBase":false,"description":"Greek-spiced smashed beef pressed onto mini tortillas and pan-fried, with tomato and herbs. Serves 4.","ingredients":["- 500 g minced (ground) beef, 85/15 (Minced beef 85/15, common)","- 1 tsp garlic powder (common)","- 1 tsp onion powder (common)","- 1 tsp dried oregano (common)","- 1 tsp ground cumin (common)","- ½ tsp sweet paprika (common)","- 1 tsp sea salt flakes (common)","- ½ tsp freshly cracked black pepper (common)","- 8 mini flour tortillas, ~40 g each (Flour tortilla, Hacendado)","- 2 tbsp olive oil (common)","- 2 tomatoes, sliced (common)","- ¼ bunch flat-leaf parsley, finely chopped (Parsley, fresh, common)"],"method":["Mix beef with garlic powder, onion powder, oregano, cumin, paprika, salt and pepper. Divide into eight portions.","Press a portion of meat onto each tortilla, spreading thinly to the edges.","Cook meat-side down in oil over medium-high heat 2–3 minutes until browned; flip and cook 30 seconds.","Top with sliced tomato and parsley. Serve with lemon wedges."],"notes":["Optional serving suggestions on the site (tzatziki, sumac onions, air-fryer chips) are not included in the macros — add them separately if you make them.","Tortillas assumed ~40 g each. Computed 635 kcal/serv vs site's 595 — within range."]},"dinner/ready-meals/hoisin-chicken-with-lettuce-cups":{"id":"dinner/ready-meals/hoisin-chicken-with-lettuce-cups","name":"Hoisin Chicken with Lettuce Cups","meal":"dinner","servings":4,"calories":419,"protein":35.7,"carbs":40.6,"fat":13.8,"isBase":false,"description":"Hoisin-glazed chicken thigh with pickled carrot, rice vermicelli and a sesame yogurt dressing, served in cos lettuce cups. Serves 4.","ingredients":["- 500 g boneless, skinless chicken thighs (Chicken thigh, Hacendado)","- 1 tbsp olive oil (common)","- 80 ml hoisin sauce (Hoisin sauce)","- 1 tsp freshly minced garlic (Garlic, raw, common)","- 2 carrots, julienned (Carrot, common)","- 1 tbsp rice wine vinegar (Rice wine vinegar, Otafuku)","- 1 tbsp lime juice (Lime juice, fresh, common)","- ½ tsp sesame oil (common)","- ½ tsp sea salt flakes (common)","- ½ tsp caster sugar (Sugar, common)","- 60 g Greek yogurt light (Hacendado) — was whole-egg mayonnaise","- 1 tsp sesame oil (common)","- ½ tsp rice wine vinegar (Rice wine vinegar, Otafuku)","- 1 baby cos lettuce (Romaine/cos lettuce, common)","- 125 g dried rice vermicelli noodles (Rice vermicelli noodles, common)","- 1 Lebanese cucumber, finely sliced (Cucumber, common)","- 2 tbsp crushed roasted peanuts (~18 g) (Peanuts, roasted, common)","- 1 lime wedge (common)"],"method":["Marinate chicken with olive oil, hoisin and garlic.","Combine julienned carrot with rice wine vinegar, lime juice, sesame oil, salt and sugar; set aside to pickle.","Cook chicken in a large pan 10–12 minutes until caramelised and cooked through; add a splash of water in the final 2 minutes to loosen the glaze. Slice.","Whisk Greek yogurt with sesame oil and rice wine vinegar (this replaces the original mayo dressing).","Cook the vermicelli per packet directions. Layer noodles, pickled carrot, cucumber, chicken, yogurt dressing and peanuts into cos lettuce cups. Squeeze over lime."],"notes":["Mayo → Greek yogurt swap applied (cold dressing, no heat warning needed)."]},"dinner/ready-meals/homemade-chicken-stew":{"id":"dinner/ready-meals/homemade-chicken-stew","name":"Homemade Chicken Stew","meal":"dinner","servings":4,"calories":577,"protein":59,"carbs":35,"fat":21,"isBase":false,"description":"One-pot chicken-thigh and potato stew, finished with cream and Grana Padano. Makes 4 servings.","ingredients":["- 2 tbsp olive oil (~28 g)","- 800 g boneless, skinless chicken thighs, diced (Hacendado)","- ½ tsp sea salt flakes","- ¼ tsp freshly cracked black pepper","- 60 ml water","- 1 brown onion, diced (~150 g)","- 1 tbsp freshly grated garlic (~9 g)","- 2 stalks celery, diced (~80 g)","- 2 carrots, sliced into rounds (~140 g)","- 125 ml dry white wine (optional)","- 2 tbsp Mantequilla light (Hacendado) (~28 g)","- 35 g plain flour","- 1.25 litres chicken stock (Knorr, prepared)","- 2 tsp dried thyme","- 2 medium potatoes, cut into 3 cm pieces (~360 g)","- 60 ml Nata para cocinar (Hacendado) (~62 g)","- 50 g Grana Padano, freshly grated","- 2 tbsp finely chopped flat-leaf parsley (~8 g)"],"method":["Brown the diced chicken with salt and pepper; set aside.","Sauté onion, garlic, celery, and carrot. Add wine and reduce.","Stir in the Mantequilla light and flour to form a paste.","Return the chicken; add stock, thyme, and potatoes. Simmer uncovered 15–18 minutes until vegetables soften and the liquid thickens.","Off the heat, stir in the Nata para cocinar, Grana Padano, and parsley."],"notes":["Worcestershire sauce dropped (pantry rule); cream swapped for Nata para cocinar and parmesan for Grana Padano. Computed 577 kcal/serving is lower than the site's 782 kcal because of those swaps and the dropped Worcestershire.","Optional crusty buttered bread to serve is not counted in the macros above."]},"dinner/ready-meals/homemade-fish-and-chips":{"id":"dinner/ready-meals/homemade-fish-and-chips","name":"Homemade Fish and Chips","meal":"dinner","servings":4,"calories":662,"protein":46.1,"carbs":85.3,"fat":15,"isBase":false,"description":"Crumbed baked white fish with oven chips and a Greek-yogurt tartare. Makes 4 servings.","ingredients":["**Fish**","- 600 g flathead fillets or firm white-fleshed fish","- 75 g plain flour","- 2 eggs, whisked (~100 g, Hacendado XL)","- 120 g panko breadcrumbs","- ½ tsp sea salt flakes","- 4 lemon wedges","**Chips**","- 1 kg potatoes","- 2 tbsp olive oil (~28 g)","- 1 tsp sweet paprika","- 1 tsp sea salt flakes","- ½ tsp freshly cracked black pepper","**Tartare sauce**","- 375 g Greek yogurt light (Hacendado)","- 1 tbsp finely diced gherkins (~15 g)","- 1 tbsp finely diced capers (~15 g)","- 1 tbsp finely diced red onion (~15 g)","- 1 tbsp finely chopped fresh dill or parsley (~3 g)","- 1 tbsp lemon juice (~15 g)","- ½ tsp sea salt flakes","- ½ tsp freshly cracked black pepper"],"method":["Cut fish into strips and dredge in flour, then egg, then panko.","Bake potato chips at 220°C for ~45 minutes with the oil, paprika, salt, and pepper until crisp.","Mix the tartare ingredients (cold — no heat).","Bake the crumbed fish 12–14 minutes until golden, or pan-fry.","Serve fish and chips with tartare and lemon wedges."],"notes":["Mayonnaise swapped for Greek yogurt light in the tartare (cold use, no heat warning needed).","Computed kcal/serving is far below the site's 1317 kcal because the site uses 375 g whole-egg mayonnaise plus deep-frying oil; here the mayo is swapped for Greek yogurt and the fish is baked."]},"dinner/ready-meals/honey-garlic-chicken-thighs":{"id":"dinner/ready-meals/honey-garlic-chicken-thighs","name":"Honey Garlic Chicken Thighs","meal":"dinner","servings":4,"calories":333,"protein":46,"carbs":20,"fat":8,"isBase":false,"description":"Pan-seared chicken thighs in a sticky honey-garlic glaze. Makes 4 servings.","ingredients":["**Chicken**","- 6 boneless chicken thighs (~720 g, Hacendado)","- ½ tsp sea salt flakes","- ½ tsp freshly cracked black pepper","- 1 tbsp olive oil (~14 g)","**Honey-garlic sauce**","- 3 tbsp soy sauce (Kikkoman) (~48 g)","- 3 tbsp honey (~63 g)","- 1 tbsp brown sugar","- 1 tbsp freshly minced garlic (~9 g)","- 1 tbsp rice wine vinegar (~15 g)","- 1 tsp sesame oil (~5 g)","- 1 tsp cornflour (~3 g)","- 2 tbsp water"],"method":["Pat chicken dry and season. Sear skin-side down 4–5 minutes until golden, flip and cook another 4–5 minutes.","Whisk the sauce ingredients together; pour into the pan over medium heat and simmer 2–3 minutes until thickened.","Return chicken and coat with the sauce.","Serve over steamed rice with Asian greens and sliced spring onion (not counted in macros)."],"notes":["Computed 333 kcal/serving vs site 351 — in agreement.","Serving rice and greens are optional and excluded from the macros."]},"dinner/ready-meals/honey-garlic-chicken":{"id":"dinner/ready-meals/honey-garlic-chicken","name":"Honey garlic chicken","meal":"dinner","servings":1,"calories":539,"protein":53,"carbs":67,"fat":7,"isBase":false,"description":"Honey and soy sauce on chicken tastes absolutely incredible! Single portion. 15 min. From The Felu Cookbook (p. 86).","ingredients":["- 1 chicken breast (180 g)","- 125 g cooked white rice (basmati)","- 200 g zucchini","- 1 medium onion (50 g)","- 2 cloves of garlic (≈6 g)","- 20 g soy sauce","- 15 g honey","- 5 g balsamic vinegar creme","- 1 g cornstarch","- 1 g garlic powder","- 0.5 g chili powder","- 4 g oil","- Black pepper, chili flakes"],"method":["Cut chicken into thin strips, add chili powder, garlic powder, and black pepper on top and mix. Dice the zucchini and the onion. Peel and grate the garlic.","Combine in a glass soy sauce, honey, balsamic vinegar, black pepper, some chili flakes, and cornstarch. Mix until combined.","Add oil to a pan (24cm/9,5inch) on medium heat, add the zucchini with a pinch of salt. Fry the zucchini for 2 minutes .","Add another bit of oil and add in the onions and keep frying for another 2 minutes.","Push the vegetables aside and add some more oil. Now go in with the chicken and separate it with a spatula.","After 1 minute flip the chicken, let the other side fry for another minute. Add a bit more oil and now add the minced garlic and fry it for 15 seconds.","Add cooked rice with the sauce and combine everyting for 30 seconds until rice is hot. Done!"],"notes":["Recipe can be made with 60g (weighted raw) jasmine rice.","Instant rice swapped for plain cooked white rice (125 g cooked ≈ 40 g raw).","Macros recomputed from our per-100g ingredient tables: 539 kcal for the portion vs the book's 582 kcal (whole recipe)."]},"dinner/ready-meals/honey-garlic-salmon":{"id":"dinner/ready-meals/honey-garlic-salmon","name":"Honey Soy Glazed Salmon","meal":"dinner","servings":4,"calories":600,"protein":42,"carbs":43,"fat":28,"isBase":false,"description":"Glazed salmon fillets over jasmine rice with edamame and cucumber. Makes 4 servings.","ingredients":["**Sauce**","- 2 tbsp soy sauce (Kikkoman) or tamari (~32 g)","- 2 tbsp apple cider vinegar (~30 g)","- 2 tbsp honey (~42 g)","- 2 tsp freshly minced garlic (~6 g)","- 1 tsp freshly minced ginger (~5 g)","**Salmon**","- 4 salmon fillets, skin on (~600 g raw)","- ½ tsp sea salt flakes","- ½ tsp freshly cracked black pepper","- 1 tbsp olive oil (~14 g)","**To serve**","- 370 g cooked jasmine rice","- 200 g frozen edamame, thawed","- 2 Lebanese cucumbers, sliced (~200 g)","- 1 tbsp sesame seeds (~9 g)","- 4 tbsp Greek yogurt light (Hacendado) (~60 g)"],"method":["Mix the sauce ingredients.","Season salmon; cook skin-side down 4 minutes, flip and cook 3 minutes.","Add the sauce and baste 1–2 minutes until glazed.","Serve over rice with edamame, cucumber, sesame seeds, and a Greek-yogurt drizzle."],"notes":["Spicy mayo swapped for Greek yogurt light (cold drizzle, no heat warning needed).","Computed 600 kcal/serving is below the site's 687 kcal mainly because of the mayo-to-Greek-yogurt swap."]},"dinner/ready-meals/honey-garlic-slow-cooker-chicken":{"id":"dinner/ready-meals/honey-garlic-slow-cooker-chicken","name":"Honey-Garlic Slow-Cooker Chicken","meal":"dinner","servings":4,"calories":426,"protein":53,"carbs":35,"fat":8,"isBase":false,"description":"Slow-cooker chicken thighs in a sticky honey-garlic sauce. Makes 4 servings.","ingredients":["- 800 g boneless, skinless chicken thighs (Hacendado)","- 2 tbsp cornflour mixed with 3 tbsp water (~16 g cornflour)","- 2 spring onions, finely sliced (~30 g)","- 1 tbsp sesame seeds (~9 g)","**Sauce**","- 80 ml soy sauce (Kikkoman) or tamari (~96 g)","- 115 g runny honey","- 2 tbsp ketchup (~34 g)","- 2 tbsp rice wine vinegar (~30 g)","- 1 tbsp freshly grated garlic (~9 g)","- 1 tbsp freshly grated ginger (~9 g)","- 1 tbsp sesame oil (~14 g)"],"method":["Add the chicken thighs to a slow cooker.","Combine the sauce ingredients and pour over the chicken.","Cook on high 3–4 hours or low 6 hours.","Add the cornflour-and-water slurry for the last 30 minutes, basting the chicken.","Sprinkle with spring onion and sesame seeds; serve with steamed jasmine rice and greens (not counted in macros)."],"notes":["Computed 426 kcal/serving vs site 435 — in agreement."]},"dinner/ready-meals/honey-mustard-chicken":{"id":"dinner/ready-meals/honey-mustard-chicken","name":"Honey mustard chicken","meal":"dinner","servings":1,"calories":576,"protein":52,"carbs":74,"fat":10,"isBase":false,"description":"Sweet and savory chicken recipes are one of my favorites. Try it out! Single portion. 20 min. From The Felu Cookbook (p. 73).","ingredients":["- 1 chicken breast (180 g)","- 300 g sweet potatoes","- 20 g feta light cheese","- 10 g honey","- 10 g mustard","- 5 g sriracha","- 1 g cayenne pepper","- 1 g smoked paprika","- 1 g garlic powder","- 4 g oil","- Salt and black pepper"],"method":["Clean the potatoes and poke holes in them with a fork. Place them on a wire rack and bake at 200 °C (400 °F) for 30–45 minutes.","Slice the chicken breast into strips and then into bitesized pieces. Slice the feta cheese into small pieces and crumble it with your hands.","In a small bowl, add smoked paprika, garlic powder, cayenne pepper, and black pepper, and mix.","In another small bowl, mix honey, sriracha, and mustard until combined.","Add oil to a pan over medium heat.","Add the chicken with a pinch of salt and stir-fry for 1–2 minutes on each side.","Then add the mixed seasonings to the pan, stir to toast them for 30 seconds, and remove everything from the heat.","Place the potatoes on a plate and slice them open. Add the chicken on top, then the feta cheese, and finally drizzle the sauce over everything. Done!"],"notes":["You can use an air fryer - lower the temperature to 180 °C (350 °F).","Macros recomputed from our per-100g ingredient tables: 576 kcal for the portion vs the book's 607 kcal (whole recipe)."]},"dinner/ready-meals/honey-pb-udon":{"id":"dinner/ready-meals/honey-pb-udon","name":"Honey PB udon","meal":"dinner","servings":1,"calories":762,"protein":62,"carbs":88,"fat":20,"isBase":false,"description":"Peanut Butter and honey is a great combination, especially with udon noodles. Single portion. 20 min. From The Felu Cookbook (p. 90).","ingredients":["- 1 chicken breast (180 g)","- 200 g udon noodles","- 1 red bell pepper (150 g)","- 1 medium onion (50 g)","- 6 g oil","- 1 g garlic powder","- Salt and black pepper","**Sauce:**","- 20 g peanut butter","- 20 g soy sauce","- 15 g honey","- 1/2 lime (≈15 g)"],"method":["Add all sauce ingredients to a small bowl or glass and mix until combined.","Slice the chicken breast into thin slices. Then chop the vegetables into bite-sized pieces.","Add 2 g of oil to a 24 cm (9.5 inch) pan over mediumhigh heat and stir-fry the vegetables with a pinch of salt for 3–4 minutes, stirring occasionally.","Meanwhile, fill a pot with water and set it on the stove over medium-high heat. Do not add the noodles yet.","Push the vegetables to the side of the pan, add another 2 g of oil, and then add the chicken breast. Season with salt, black pepper, and garlic powder. Stir-fry the chicken for 1 minute on each side.","Add the udon noodles, along with a pinch of salt, to the boiling water. They will need about 3 minutes to cook.","Remove the chicken and vegetables from the pan. Return the empty pan to the stove, add the sauce along with a splash of the noodle water, and let it simmer for 1 minute.","Add the cooked noodles to the pan and stir. Finally, return the chicken and vegetables to the pan and give everything a good mix. Done!"],"notes":["Macros recomputed from our per-100g ingredient tables: 762 kcal for the portion vs the book's 665 kcal (whole recipe)."]},"dinner/ready-meals/honey-soy-chicken-tray-bake":{"id":"dinner/ready-meals/honey-soy-chicken-tray-bake","name":"Honey soy chicken tray bake","meal":"dinner","servings":4,"calories":520,"protein":57,"carbs":56,"fat":7,"isBase":false,"description":"One-tray honey-soy chicken thighs with red onion, served over rice. Makes 4 portions. Glaze reduces onto the chicken, so all the marinade macros count.","ingredients":["- 800g chicken thighs, boneless & skinless (Hacendado)","- 110g red onion (~1 medium), cut into wedges","- 8g cornstarch / cornflour (1 tbsp)","- 30ml water (2 tbsp)","- 9g garlic, minced (1 tbsp)","- 70g soy sauce (Kikkoman)","- 90g honey (¼ cup)","- 15g rice wine vinegar (1 tbsp)","- 1g black pepper, ground (½ tsp)","- 14g olive oil (1 tbsp)","- 230g broccoli microwave pocket (Hacendado) (~57.5g/portion)","- 132g basmati rice (Hacendado), raw (33g/portion → ~100g cooked each)"],"method":["Preheat the oven to 220°C (200°C fan-forced).","**Make the sauce.** In a large bowl, whisk the cornflour with the water until smooth. Add the garlic, soy sauce, honey, rice wine vinegar, black pepper and olive oil; stir to combine. Add the chicken and toss to coat. Set aside.","**Assemble.** Arrange the onion wedges on a large non-stick baking tray. Lay the chicken thighs on top and pour over all the remaining sauce.","**Bake** 20 min. Remove, scatter the broccoli around the chicken and gently toss it through the sauce at the base. Return to the oven 8 min more, until the chicken is cooked through (74°C internal) and caramelised at the edges. Grill (broil) on high 2 min for extra caramelisation.","Meanwhile, cook the rice (33g raw → ~100g cooked per portion).","Divide into 4 portions, each with ~100g cooked rice."],"notes":["The Hacendado broccoli is a microwave pocket — if it won't roast well in step 4, cook it per the pack and add at serving instead.","Chicken-thigh macros from the Hacendado label (116 kcal, 25g protein, 1.7g fat per 100g) — very lean, which is why this lands high-protein/low-fat.","½ cup honey makes this sugar-forward (~19g sugar/portion, mostly honey) — fine as a balanced meal, not a deficit day."]},"dinner/ready-meals/juicy-meatballs":{"id":"dinner/ready-meals/juicy-meatballs","name":"Juicy meatballs","meal":"dinner","servings":1,"calories":407,"protein":54,"carbs":22,"fat":11,"isBase":false,"description":"There are meatballs and then there are juicy meatballs. Once you’ve made this recipe, you’ll know what I’m talking about! Single portion. 20 min. From The Felu Cookbook (p. 129).","ingredients":["- 180 g ground beef 95/5","- 1 slice sandwich bread (≈30 g)","- ½ medium onion (25 g)","- 25 g egg whites","- 50 g buttermilk","- 9 g dry gelatine","- 5 g parsley","- 2 g chili powder","- 2 g paprika","- Salt and black pepper"],"method":["Preheat the oven to 180°C or 350°F.","Add buttermilk and gelatine into a glass and mix until combined. Set it aside.","Dice the onion into very small pieces. Peel and grate garlic. Remove the crust from the bread and cut it into small cubes. Chop up parsley.","Place the bowl on a scale. Add in beef, egg whites, garlic, onions, bread, parsley, seasonings, and buttermilk.","Mix everything with your hands until it becomes one humongous meatball.","To check the seasoning, take a small piece the meat and place it into a microwave-safe container. Microwave the meat on high for 15 seconds and taste it. Add seasoning to raw meatballs if needed.","Spray oil into a baking dish. Form small meatballs and place them into the dish. The size is a personal preference. Bigger balls will take longer to bake.","Once the entire meat is formed into small balls, place the baking dish into the oven and bake for 15-18 minutes.","You can immediately eat them or add oil to a pan on high heat and add meatballs. Fry them for 1 minute to develop extra browning on the outside. Done!"],"notes":["You can add 25g grated Parmesan for extra flavor. It will add 100 extra calories.","Meatballs can be meal-prepped and last in the fridge for 3-4 days.","Macros recomputed from our per-100g ingredient tables: 407 kcal for the portion vs the book's 386 kcal (whole recipe)."]},"dinner/ready-meals/juicy-oven-baked-kebabs":{"id":"dinner/ready-meals/juicy-oven-baked-kebabs","name":"Juicy Oven-Baked Beef Kebabs","meal":"dinner","servings":4,"calories":541,"protein":33,"carbs":10,"fat":41,"isBase":false,"description":"Spiced minced-beef kebab strips baked on a tray, with sumac onions and a garlic yogurt sauce. Scaled to 4 servings.","ingredients":["**Kebabs**","- 667 g minced beef (15–20% fat)","- 1 small brown onion, grated (~67 g)","- 1 tbsp minced garlic (split across kebab and sauce)","- 2 tsp ground cumin","- 2 tsp ground coriander","- 2 tsp sweet paprika","- ½ tsp chilli flakes (optional)","- 1½ tsp sea salt flakes","- ¼ tsp black pepper","- 2 tbsp chopped flat-leaf parsley","- ⅓ tsp bicarbonate of soda","- 1½ tbsp olive oil","**Sumac onions**","- 1 small red onion, finely sliced (~53 g)","- 1 tsp sumac","- ⅓ lemon, juiced","- ⅔ tsp olive oil","- pinch sea salt","**Yogurt garlic sauce**","- 207 g Greek yogurt light (Hacendado)","- ⅓ tsp minced garlic","- 1 tbsp fresh lemon juice","- ⅓ tsp sea salt","**To serve**","- 4 pita / flatbreads (Pita / flatbread), sized to the day's budget","- 2 large tomatoes, sliced (~160 g)","- chopped fresh parsley"],"method":["Mix the minced beef with grated onion, garlic, spices, parsley, and bicarbonate of soda until sticky.","Press onto a parchment-lined tray to 1 cm thickness; score into strips and add shallow horizontal notches. Brush with olive oil.","Bake on the top rack at 240°C for 15–18 minutes until golden.","Make the sumac onions and the (cold) yogurt garlic sauce separately.","Warm flatbreads and assemble with the meat, sauces, tomatoes, and herbs."],"notes":["Scaled from the site's 6 servings to 4. Made with minced beef.","Pita / flatbread now has real values (275 kcal/100g) but is a to-serve item with no fixed quantity, so it is excluded from the per-serving totals. The kebab dish itself is 541 kcal/serving; one ~70 g pita adds ~193 kcal, which would push a serving to ~734 (over the 700 ceiling) — so size the bread to the day's budget (e.g. half a pita, or skip on a heavier day).","Greek yogurt garlic sauce is a cold sauce — no heat warning needed."]},"dinner/ready-meals/korean-chicken":{"id":"dinner/ready-meals/korean-chicken","name":"Korean chicken","meal":"dinner","servings":1,"calories":564,"protein":60,"carbs":63,"fat":9,"isBase":false,"description":"Gochujang and chicken is one of the greatest combinations on earth. Single portion. 20 min. From The Felu Cookbook (p. 74).","ingredients":["- 200 g skinless, boneless chicken thighs","- 50 g rice raw","- 100 g cauliflower","- 1 clove of garlic (≈3 g)","- 1 piece of fresh ginger (thumb size) (≈10 g)","- 150 g water","- 25 g gochujang","- 20 g soy sauce","- 2 g turmeric","- 1 g cumin","- 4 g oil","- Black pepper"],"method":["In a bowl, combine the chicken with gochujang, soy sauce, grated garlic, grated ginger, and black pepper. Mix until the chicken is fully coated. You can marinate it for 3–4 hours if desired, or use it right away.","Mix the turmeric, chili, paprika, cumin, salt, and pepper in a small bowl.","Air-fry at 160°C (320°F) for 12–15 minutes.","Meanwhile, combine the turmeric and cumin in a small bowl.","Turn cauliflower into cauliflower rice using a box grater or a blender.","Heat oil in a pan over medium heat. Toast the spices for about 30 seconds, then add the rice and stir.","Add the cauliflower and water, cover with a lid, reduce the heat to low, and let it simmer for 12–15 minutes.","Once everything is cooked, plate the rice and top with the chicken, done!"],"notes":["Be careful to not burn the gochujang on the chicken, keep an eye on it.","The chicken can also be meal-prepped in the oven. Simply triple (or multiply) the recipe and bake at 200°C (400°F) for 15 minutes.","Macros recomputed from our per-100g ingredient tables: 564 kcal for the portion vs the book's 590 kcal (whole recipe)."]},"dinner/ready-meals/korean-spicy-chicken-sweet-potato":{"id":"dinner/ready-meals/korean-spicy-chicken-sweet-potato","name":"Korean spicy chicken & sweet potato","meal":"dinner","servings":5,"calories":559,"protein":56,"carbs":72,"fat":6,"isBase":false,"description":"The combination of sweet potato and spicy chicken is awesome! Makes 5. 50 min. From The Felu Cookbook (p. 262).","ingredients":["- 1250 g sweet potatoes","- 5 chicken breast (1000 g)","- 150 g canned corn","- 1 large onion (100 g)","- 2 carrots (200 g)","- 2 red bell peppers (300 g)","- 40 g gochujang","- 100 g low sodium soy sauce","- 50 g water","- 2 g cornstarch","- 15 g oil","- Black pepper"],"method":["Preheat the oven to 200°C or 400°F.","Clean potatoes with a brush under water. Don’t peel them. Cut them into halves. 1250g should be 3 medium-sized sweet potatoes.","Chop up onions, pepper and carrot into bite-size pieces. Add vegetables into a baking dish and add 10g of olive oil on top of them, a pinch of salt and black pepper. Mix everything with a spatula.","Add sweet potatoes and the baking dish with vegetables on a baking rack and bake them in the oven for 30 minutes.","Add Gochujang, water, soy and cornstarch into a container and mix everything until smooth.","Cut chicken breast into bite-size cubes and add a strong pinch of salt on top of them.","Heat up a big pan (28cm/11inch) to medium-high with 2g of oil. Add in a batch of chicken breast and fry them 1-2 minutes on each side until brown and cooked through. Remove them from the pan and repeat until all the chicken is cooked.","After 30 minutes of baking time, remove the vegetables and add them into the pan where you just fried the chicken on mediumhigh heat. And fry them until the entire water is evaporated and the veggies are caramelized.","Add the chicken back to the pan and add the sauce and cook everything for 30 seconds until the sauce is sticky and thick.","Distribute sweet potatoes in 5 meal prep containers. Do the same with the vegetables and the chicken.","Add canned corn evenly distributed in every container as well. Done!"],"notes":["It can be stored in the fridge for 3-5 days.","Be careful not to overcook the chicken or it will become dry and tough. 2-3 minutes is generally enough. Don’t overcrowd the pan either.","Macros recomputed from our per-100g ingredient tables: 2794 kcal for the batch vs the book's 2790 kcal (whole recipe)."]},"dinner/ready-meals/lemon-gnocchi-chicken":{"id":"dinner/ready-meals/lemon-gnocchi-chicken","name":"One-Pan Lemon Gnocchi Chicken","meal":"dinner","servings":4,"calories":572,"protein":43,"carbs":45,"fat":25,"isBase":false,"description":"Creamy one-pan lemon gnocchi with seared chicken and spinach. Makes 4 servings.","ingredients":["- 2 boneless, skinless chicken breasts, halved into 4 thin steaks (~470 g, Hacendado)","- 1 tsp sea salt flakes","- ½ tsp freshly cracked black pepper","- 1 tsp sweet paprika","- ½ tsp dried thyme","- 1 tbsp olive oil (~14 g)","- 1 tbsp Mantequilla light (Hacendado) (~14 g)","- 1 tsp freshly minced garlic (~3 g)","- 1 lemon, juiced (~45 g)","- 250 ml chicken stock (Knorr, prepared)","- 250 ml Nata para cocinar (Hacendado)","- 100 g Grana Padano, freshly grated","- 500 g fresh gnocchi","- 90 g baby spinach leaves"],"method":["Season chicken with salt, pepper, paprika, and thyme. Sear in the oil and Mantequilla light ~3 minutes per side; set aside.","Add garlic, lemon juice, stock, and Nata para cocinar to the pan.","Stir in the Grana Padano and gnocchi; cook 2 minutes.","Fold in spinach and top with the chicken before serving."],"notes":["Cream swapped for Nata para cocinar and parmesan for Grana Padano. Computed 572 kcal/serving is below the site's 701 kcal mainly because of the lighter cream swap."]},"dinner/ready-meals/loaded-fries":{"id":"dinner/ready-meals/loaded-fries","name":"Loaded fries","meal":"dinner","servings":1,"calories":736,"protein":55,"carbs":71,"fat":27,"isBase":false,"description":"Super crispy potatoes loaded with high protein, cheesy beef. Single portion. 20 min. From The Felu Cookbook (p. 84).","ingredients":["- 180 g ground beef 95/5","- 300 g potatoes","- 1 medium onion (50 g)","- 20 g cheddar cheese","- 50 g evaporated milk","- 0.5 g cornstarch","- 15 g Greek yogurt light (Hacendado)","- 15 g ketchup","- 10 g mustard","- 20 g pickles","- 1 g cayenne pepper","- 1 g dried rosemary","- 1 g garlic powder","- 0.5 g baking soda","- 8 g oil","- Salt and black pepper"],"method":["Peel the potatoes and cut them into country-style wedges. Place them in a pot and cover with water, two pinches of salt, and a little baking soda. Let the potatoes simmer over medium heat for 10 minutes, or until they are soft.","Drain the water and transfer the potatoes to a bowl. Add 2g of oil, black pepper, and rosemary, then shake the bowl vigorously for 30 seconds.","Air-fry the potatoes at 200°C (400°F) for 15–20 minutes, or until golden brown.","Meanwhile, chop the onions. In a small bowl (or glass), combine ketchup, Greek yogurt light (Hacendado), mustard, and chopped pickles. In a separate bowl, combine cheddar, evaporated milk and cornstarch.","Heat 4g of oil in a pan over medium heat and stir-fry the onions with a pinch of salt for 3–4 minutes.","Push them to one side of the pan, add 2g of oil, then add the meat. Spread the meat out so it browns properly. Season with salt, black pepper, garlic powder, and cayenne pepper. After one minute, flip the meat and let it cook for one more minute.","Next, combine everything in the pan and break up the meat. Keep stri frying for 1 more minute until meat is done.","Remove the pan from the heat, add the cheese sauce, and allow the residual heat to melt it.","Finally, place the potatoes in a bowl, add the cheesy meat on top, and finish with the burger sauce. Enjoy!"],"notes":["You can skip the boiling potatoes part and immedaitely air fry them. They won‘t be as crispy but still good.","Macros recomputed from our per-100g ingredient tables: 736 kcal for the portion vs the book's 699 kcal (whole recipe).","Light mayo swapped for Greek yogurt light (Hacendado) — house rule; the macros below already reflect the swap. Stir it in off the heat so it does not split."]},"dinner/ready-meals/lomo-saltado":{"id":"dinner/ready-meals/lomo-saltado","name":"Lomo saltado","meal":"dinner","servings":1,"calories":631,"protein":46,"carbs":88,"fat":11,"isBase":false,"description":"The Peruvian classic that is inspired by Chinese cuisine. Great flavor guaranteed. Single portion. 30 min. From The Felu Cookbook (p. 92).","ingredients":["- 150 g lean cut beef (sirloin)","- 300 g potatoes","- 1 red bell pepper (150 g)","- 40 g Jalapeno","- 1 medium onion (50 g)","- 1 carrot (100 g)","- 150 g tomatoes","- 2 cloves of garlic (≈6 g)","- 25 g soy sauce","- 2 g oil","- Salt and black pepper"],"method":["Start with the washing and marinating first if you choose to do it (see the How to Tenderize Lean Beef chapter). Otherwise, just cut the meat into strips.","Clean the potatoes with cold water, I don‘t peel them. Cut the potatoes into fries. Add them to a baking dish, add oil, and a pinch of salt and mix everything with your hands.","Bake the potatoes for 30 min at 200°C or 400°F. Flip them halfway through with a spatula. You can also use an air fryer for the potatoes.","Chop up all vegetables into equal bite-size pieces. Peel and grate the garlic.","Add the beef to a pan (24cm/9,5inch) on medium-high heat. If you don’t marinate the beef, you need to add a bit of oil to the pan.","Fry the meat for 60 seconds on both sides until they get color.","Remove the beef, and add all vegetables except the tomatoes into the pan. You might need to add another touch oil. Fry this under occasional stirring for 7-10 minutes on medium heat.","Add in garlic for 15 seconds, and then add in the tomatoes. Add in black pepper, close the lid and let the tomatoes simmer for another 3 minutes.","Add in the sauce and the beef and let everything cook for 1 more minute. If you haven’t marinated the meat, then you might need to add a bit of starch slurry (mix 50g cold water with 2 g cornstarch in a bowl and start adding half in the pan).","Potatoes should be ready, so put them on a plate and cover everything with your beef, veggies, and sauce. Top with cilantro or parsley. Done!"],"notes":["Potatoes can be swapped out for rice.","Macros recomputed from our per-100g ingredient tables: 631 kcal for the portion vs the book's 576 kcal (whole recipe)."]},"dinner/ready-meals/macaroni-and-cheese":{"id":"dinner/ready-meals/macaroni-and-cheese","name":"Macaroni and Cheese","meal":"dinner","servings":4,"calories":700,"protein":30,"carbs":76,"fat":30,"isBase":false,"description":"Baked cheddar macaroni with a crisp panko top. Scaled from the site's 6 servings to 4.","ingredients":["- 333 g macaroni (elbow pasta) (Macaroni (elbow pasta), dried)","- 19 g unsalted butter (Butter, unsalted)","- 20 g plain (all-purpose) flour (Plain (all-purpose) flour)","- 500 ml full-cream (whole) milk (Whole (full-cream) milk)","- ~2 g chicken stock powder (Chicken stock (Knorr))","- 250 g grated cheddar (Cheddar cheese)","- ~11 g panko breadcrumbs (Panko breadcrumbs)","- Olive oil spray (negligible)"],"method":["Cook pasta per packet instructions minus 1 minute; drain and cool under cold water.","Melt butter in a large deep frying pan over low heat.","Add flour and stir 30 seconds until a paste forms.","Whisk in one-quarter of the milk for 30 seconds until combined.","Add remaining milk, whisk over low heat 5 minutes until the sauce coats the back of a spoon.","Stir in stock powder and cheese; turn off heat and mix the pasta through.","Preheat oven grill; transfer to a baking dish, sprinkle breadcrumbs, spray with olive oil.","Grill 2–3 minutes until golden."],"notes":["Quantities scaled to 4 servings from the site's 6-serving recipe.","Computed 700 kcal/serving matches the site's 699 — right at the meal-fit ceiling."]},"dinner/ready-meals/marry-me-chicken-risoni":{"id":"dinner/ready-meals/marry-me-chicken-risoni","name":"Marry Me Chicken Risoni (Orzo)","meal":"dinner","servings":4,"calories":615,"protein":47,"carbs":55,"fat":24,"isBase":false,"description":"One-pan creamy chicken thigh and risoni with sun-dried tomatoes and spinach.","ingredients":["- 2 tbsp olive oil (Olive oil)","- 500 g boneless, skinless chicken thighs, cut into bite-sized pieces (Chicken thigh, boneless & skinless (Hacendado))","- ½ tsp sea salt flakes (Salt)","- 1 tbsp minced garlic (Garlic, raw)","- 80 g sun-dried tomatoes in oil, chopped (Sun-dried tomatoes (dry))","- 1 tsp dried oregano (Oregano, dried)","- 1 tsp dried thyme (Thyme, dried)","- 1 tsp sweet paprika (Sweet paprika)","- 200 g risoni (orzo) (Risoni (orzo), dried)","- 500 ml chicken stock (Chicken stock (Knorr))","- 1 tsp dijon mustard (Dijon mustard (Hacendado))","- 250 ml Nata para cocinar (Nata para cocinar (Hacendado)) — replaces thickened cream","- 2 handfuls baby spinach (~60 g) (Baby spinach)","- 50 g grated Grana Padano, plus extra to serve (Grana Padano) — replaces parmesan","- Black pepper, to taste (Black pepper, ground)"],"method":["Heat olive oil in a large heavy-based pan over medium-high heat; cook chicken 3–4 minutes until browned.","Stir in salt, garlic, sun-dried tomatoes, oregano, thyme, and paprika.","Add risoni, stock, mustard, and Nata para cocinar; bring to a gentle simmer.","Cover and cook 12–15 minutes until risoni is tender, stirring frequently.","Remove from heat; stir in spinach and Grana Padano; season to taste.","Serve with extra Grana Padano."],"notes":["Cream → Nata para cocinar and parmesan → Grana Padano per pantry rules.","Computed 615 kcal/serving is lower than the site's 790 because cream was swapped for Nata para cocinar (lighter).","Nata para cocinar is more heat-stable than yogurt; simmer is fine."]},"dinner/ready-meals/marry-me-chicken":{"id":"dinner/ready-meals/marry-me-chicken","name":"Marry me chicken","meal":"dinner","servings":1,"calories":521,"protein":54,"carbs":63,"fat":8,"isBase":false,"description":"A viral recipe that is actually quite good and also easy to make. Single portion. 20 min. From The Felu Cookbook (p. 85).","ingredients":["- 1 chicken breast (180 g)","- 250 g potatoes","- 200 g tomatoes","- 50 g chicken stock","- 50 g evaporated milk","- 3 cloves of garlic (≈9 g)","- 1 g garlic powder","- 1 g chili flakes","- 1 g oregano","- 4 g oil","- Salt and black pepper"],"method":["Start by peeling and cutting potatoes into cubes. Put them into a pot with water and salt and let them simmer for 12-15 minutes.","Next, place the chicken into a zip-lock bag and pound it with a heavy object, like a pan, to flatten it. Remove the chicken from the bag, and season it with salt, black pepper, oregano, and garlic powder. Peel and grate the garlic.","Set a 24cm (9.5-inch) pan on the stove over mediumhigh heat. Fry the chicken, flipping it every 60-90 seconds, until it‘s cooked through—about 4-5 minutes. Then, remove the chicken from the pan.","Add oil to the same pan, and sauté the garlic for 20-30 seconds. Next, add the tomatoes and a splash of water, cover with a lid, and let it simmer for 2-3 minutes.","Press the tomatoes down to release their juices. Season with salt, pepper, and chili flakes, and give it a good stir.","Pour in the chicken stock and evaporated milk, letting it all simmer for another 1-2 minutes.","Return the chicken to the pan to reheat it.","To serve, plate the potatoes and top them with the chicken and sauce. Done!"],"notes":["This recipe typically calls for sun-dried tomatoes, but I find it tastes much better with fresh ones. However, feel free to experiment with sun-dried tomatoes if you prefer; the rest of the recipe remains the same.","Macros recomputed from our per-100g ingredient tables: 521 kcal for the portion vs the book's 558 kcal (whole recipe)."]},"dinner/ready-meals/mediterranean-chicken-tray-bake":{"id":"dinner/ready-meals/mediterranean-chicken-tray-bake","name":"Mediterranean Chicken Tray Bake","meal":"dinner","servings":4,"calories":686,"protein":37,"carbs":31,"fat":46,"isBase":false,"description":"One-tray chicken thigh cutlets with potatoes, red onion and cherry tomatoes. Scaled from the site's 5 servings to 4.","ingredients":["- 800 g bone-in chicken thigh cutlets, skin on (Bone-in, skin-on chicken thigh cutlets, raw)","- ~1.6 tsp paprika (Sweet paprika)","- ~1.6 tsp dried oregano (Oregano, dried)","- ~0.8 tsp minced garlic (Garlic, raw)","- ~0.8 tbsp honey (Honey (BM))","- ~0.8 tsp dijon mustard (Dijon mustard (Hacendado))","- ~1.6 tbsp lemon juice (Lemon juice, fresh)","- ~60 ml olive oil incl. drizzle (Olive oil)","- ~480 g potatoes, wedged (Potato, white (raw))","- ~120 g red onion, wedged (Red onion)","- 200 g cherry tomatoes (Cherry tomatoes)","- 100 ml chicken stock (Chicken stock (Knorr))","- Salt, black pepper to taste"],"method":["Preheat oven to 200°C (400°F).","Arrange chicken on a tray and sprinkle with paprika, oregano, salt, pepper and garlic.","Combine honey, mustard, lemon juice and olive oil; pour over chicken and rub in.","Scatter potatoes, red onion and cherry tomatoes around the chicken; drizzle with extra oil, season.","Pour chicken stock into the base of the dish.","Bake 50 minutes to 1 hour until golden and cooked through.","Stand 10 minutes before serving."],"notes":["Quantities scaled to 4 servings from the site's 5.","Skin-on cutlets put this near the meal-fit ceiling (686 kcal); use skinless thighs to lighten."]},"dinner/ready-meals/mexican-slow-cooked-beef":{"id":"dinner/ready-meals/mexican-slow-cooked-beef","name":"Mexican Slow-cooked Beef","meal":"dinner","servings":4,"calories":571,"protein":52,"carbs":11,"fat":35,"isBase":false,"description":"Shredded slow-cooked Mexican beef in a tomato sauce. Scaled from the site's 6 servings to 4 (per-serving macros are the same).","ingredients":["- 1 kg beef chuck (braising) steak (Beef chuck / braising steak, lean, raw)","- ~1.3 tsp ground cumin (Cumin, ground)","- ~1.3 tsp dried oregano (Oregano, dried)","- ~1.3 tsp sweet paprika (Sweet paprika)","- ~1.3 tsp sea salt flakes (Salt)","- ~⅔ tsp black pepper (Black pepper, ground)","- ~⅔ tsp onion powder (Onion powder)","- ~⅔ tsp garlic powder (Garlic powder)","- ~53 ml olive oil (Olive oil)","- 1 onion, finely diced (Brown onion (yellow), raw)","- 2 garlic cloves, chopped (Garlic, raw)","- ~1.3 tsp tomato paste (Tomato paste, canned)","- ~265 g crushed tomatoes (Crushed tomatoes, canned)","- 330 ml beef stock (Beef stock / bouillon (Knorr-style))","- ⅔ tsp sugar (Sugar, white/caster (granulated))","- ⅔ lime, juiced (Lime juice, fresh)"],"method":["Coat the beef with spices and olive oil.","Brown the beef in batches (3–6 minutes per batch), deglazing as needed.","Cook onion and garlic 2–3 minutes.","Add tomato paste, crushed tomatoes, beef stock, sugar and lime juice.","Simmer covered on lowest heat 2 hours.","Uncover and cook 1+ hour more until the beef shreds easily.","Shred with two forks; thicken the sauce on medium-high 10–15 minutes if desired."],"notes":["Quantities scaled to 4 servings from the site's 6; per-serving macros unchanged.","Serve with rice, salad or wraps to round out carbs."]},"dinner/ready-meals/minestrone-vegetable-soup":{"id":"dinner/ready-meals/minestrone-vegetable-soup","name":"Minestrone vegetable soup","meal":"dinner","servings":4,"calories":209,"protein":10,"carbs":36,"fat":4,"isBase":false,"description":"The Italian way to eat a lot vegetables. And a great way to fix your pasta cravings as well! Makes 4. 75 min. From The Felu Cookbook (p. 275).","ingredients":["- 4-6 SERVINGS:","- 1 broccoli (300 g)","- 1 kohlrabi (150 g)","- 150 g zucchini","- 100 g celery root","- 1 carrot (100 g)","- 1 large onion (100 g)","- 3 cloves of garlic (≈9 g)","- 400 g crushed tomatoes","- 240 g canned beans (cannelini)","- 1500 g water","- 20 g vegetable broth powder","- 10 g oil","- Salt and black pepper"],"method":["Chop up all the vegetables into bite-size pieces. Peel and grate garlic. Rinse the beans.","Start by placing a pot (28cm/11inch) on a stove on medium-high heat.","Add oil and start by frying the onion, carrot and celery for 5-7 minutes.","Add garlic and fry for 20 seconds and then add tomatoes, water, broth powder and beans. Let this simmer for 45-60 minutes with a closed lid.","Add kohlrabi and cook for 10 minutes without the lid.","After 10 minutes, add zucchini and broccoli and let it simmer for another 10 minutes.","Try the soup and adjust the taste with salt and pepper. Let it simmer on high heat if you want to make it thicker and less soupy.","Transfer it to a container and store it in the fridge. Done!"],"notes":["You can use any vegetables that you like.","If you reheat the soup, you can add 50 g of small dry pasta and cook it in the broth for 10 minutes. This will add 175 calories.","Macros recomputed from our per-100g ingredient tables: 834 kcal for the batch vs the book's 706 kcal (whole recipe)."]},"dinner/ready-meals/one-pan-chicken-and-garlic-rice":{"id":"dinner/ready-meals/one-pan-chicken-and-garlic-rice","name":"One-pan Chicken and Garlic Rice","meal":"dinner","servings":4,"calories":487,"protein":40,"carbs":45,"fat":17,"isBase":false,"description":"One-pan marinated chicken thighs cooked over garlic jasmine rice. Serves 4.","ingredients":["- 5 boneless chicken thighs, skin off (Chicken thigh, Hacendado)","- 1 tsp sea salt flakes (Salt)","- 1 tsp onion powder (Onion powder)","- 1 tsp garlic powder (Garlic powder)","- 1 tsp sweet paprika (Sweet paprika)","- 1 tsp dried thyme (Thyme, dried)","- ½ tsp freshly cracked black pepper (Black pepper, ground)","- 60 ml (¼ cup) olive oil (Olive oil)","- 60 ml (¼ cup) water","- 1 onion, finely diced (Red onion)","- 1 tsp freshly minced garlic (Garlic, raw)","- 200 g (1 cup) jasmine rice (Basmati rice, Hacendado — dry)","- 375 ml (1½ cups) chicken stock (Chicken stock, Knorr)"],"method":["Combine salt, onion powder, garlic powder, paprika, thyme, pepper and olive oil; coat chicken.","Heat a heavy-based pan over medium-high; cook chicken 6–8 minutes, turning halfway, until golden; remove.","Add water to deglaze, scraping up stuck bits.","Add onion and garlic; cook 1–2 minutes.","Add rice and stock; stir and bring to a simmer.","Reduce heat to low; return chicken to pan; cover and cook 15 minutes.","Remove from heat; stand covered 10 minutes. Serve with a mixed leaf salad."],"notes":["5 thighs ≈ 550 g. Onion ≈ 110 g. Dry rice macros used (Basmati Hacendado). Chicken stock from Knorr powder (375 ml ≈ 21 g product)."]},"dinner/ready-meals/one-pan-ginger-shallot-chicken-and-rice":{"id":"dinner/ready-meals/one-pan-ginger-shallot-chicken-and-rice","name":"One-pan Ginger Shallot Chicken and Rice","meal":"dinner","servings":4,"calories":575,"protein":39,"carbs":41,"fat":29,"isBase":false,"description":"One-pan chicken thighs over jasmine rice, finished with a ginger and spring onion oil. Serves 4.","ingredients":["- 5 large boneless chicken thighs, excess fat trimmed (Chicken thigh, Hacendado)","- 1 tsp sea salt flakes (Salt)","- ½ tsp freshly cracked black pepper (Black pepper, ground)","- 1 tbsp olive oil (Olive oil)","- 200 g (1 cup) jasmine or basmati rice (Basmati rice, Hacendado — dry)","- 375 ml (1½ cups) chicken stock (Chicken stock, Knorr)","### Ginger and spring onion oil","- 4 spring onions, finely sliced (Spring onion)","- 1 tsp freshly grated ginger (Ginger, raw)","- ½ tsp sea salt flakes (Salt)","- 1 tbsp sesame oil (Sesame oil)","- 80 ml (⅓ cup) oil (Olive oil)"],"method":["Season chicken with salt and pepper.","Heat oil in a large frying pan; cook chicken 4–5 minutes until golden, turning halfway. Set aside; drain excess fat.","Add rice to pan, stir 30 seconds, then add chicken stock.","Once bubbling, return chicken; cover and reduce to lowest heat for 15 minutes.","Combine ginger oil ingredients in a bowl while chicken cooks.","Remove from heat; stand 10 minutes.","Serve drizzled with ginger-spring onion oil, alongside cucumber or steamed greens."],"notes":["The 80 ml finishing oil drives most of the fat — reduce it to cut fat/calories. Dry rice macros used. Chicken stock from Knorr powder."]},"dinner/ready-meals/one-pan-gnocchi-bolognese":{"id":"dinner/ready-meals/one-pan-gnocchi-bolognese","name":"One-pan Gnocchi Bolognese","meal":"dinner","servings":4,"calories":697,"protein":33,"carbs":60,"fat":37,"isBase":false,"description":"One-pan beef bolognese simmered with potato gnocchi and melted mozzarella. Serves 4.","ingredients":["- 2 tbsp olive oil (Olive oil)","- 1 red or brown onion, finely diced (Red onion)","- 2 garlic cloves, freshly minced (Garlic, raw)","- 1 carrot, finely diced (Carrot)","- 1 celery stalk, finely diced (Celery, raw)","- 500 g minced (ground) beef (Minced beef, 85% lean)","- 1 tsp sea salt flakes (Salt)","- ½ tsp freshly cracked black pepper (Black pepper, ground)","- 1 tbsp tomato paste (Tomato paste, canned)","- 800 g canned crushed tomatoes (Crushed tomatoes, canned)","- 1 tsp beef stock powder (Beef stock / bouillon, Knorr-style)","- 1 tsp caster sugar (Sugar, white)","- 250 ml (1 cup) water","- 2 sprigs fresh oregano or thyme (or 1 tsp dried)","- 1 bay leaf (Bay leaf, dried)","- 500 g fresh gnocchi (Gnocchi, fresh)","- 50 g mozzarella, shredded (Mozzarella rallado, Hacendado)"],"method":["Heat olive oil in a large heavy-based pan over medium–low heat.","Add onion, garlic, carrot and celery; cook 3–5 minutes until softened.","Increase heat; add beef, salt and pepper; cook 3–5 minutes until browned.","Stir in tomato paste, crushed tomatoes, beef stock powder, sugar, water, herbs and bay leaf; simmer 20 minutes covered.","Remove herb sprigs and bay leaf; stir in gnocchi; cook covered 2 minutes.","Top with mozzarella; cover and cook 2 minutes until melted."],"notes":["At 697 kcal/serving this is just under the 700 ceiling — a heavier meal. Onion ≈ 110 g, carrot ≈ 60 g, celery ≈ 40 g."]},"dinner/ready-meals/one-pan-lemon-herb-chicken-rice":{"id":"dinner/ready-meals/one-pan-lemon-herb-chicken-rice","name":"One-pan Lemon Herb Chicken Rice","meal":"dinner","servings":4,"calories":538,"protein":29,"carbs":64,"fat":19,"isBase":false,"description":"One-pan lemon-herb chicken breast over buttery jasmine rice. Serves 4.","ingredients":["- 2 boneless, skinless chicken breasts, sliced into 4 thin steaks (Chicken breast, Hacendado)","- 1 tsp onion powder (Onion powder)","- 1 tsp garlic powder (Garlic powder)","- 1 tsp sweet paprika (Sweet paprika)","- 1 tsp dried thyme (Thyme, dried)","- 1 tsp sea salt flakes (Salt)","- ½ tsp freshly cracked black pepper (Black pepper, ground)","- 3 tbsp olive oil (Olive oil)","- 60 ml (¼ cup) water","- 1 onion, finely chopped (Red onion)","- 1 tsp freshly minced garlic (Garlic, raw)","- 2 tbsp unsalted butter (Butter, unsalted)","- 300 g (1½ cups) jasmine rice (Basmati rice, Hacendado — dry)","- 1 lemon, juiced (Lemon juice, fresh)","- 750 ml (3 cups) chicken stock (Chicken stock, Knorr)"],"method":["Marinate chicken in the seasoning mix (refrigerate up to 24 h, optional).","Sear chicken 1–2 minutes per side until golden but raw inside; transfer to a plate.","Deglaze pan with water, scraping up sticky bits.","Add onion and garlic; cook 1–2 minutes.","Add butter, then stir in rice.","Add lemon juice and chicken stock; bring to a boil, then reduce to low.","Return chicken; cover and cook 15 minutes.","Turn off heat; stand covered 10 minutes. Fluff rice, return chicken, garnish with thyme and lemon."],"notes":["2 breasts ≈ 360 g. Dry rice macros used. Chicken stock from Knorr powder."]},"dinner/ready-meals/one-pot-creamy-bolognese":{"id":"dinner/ready-meals/one-pot-creamy-bolognese","name":"One-pot Creamy Bolognese","meal":"dinner","servings":4,"calories":626,"protein":29,"carbs":66,"fat":27,"isBase":false,"description":"One-pot beef bolognese with rigatoni, finished with cream and parmesan. Serves 4 (scaled from the site's 6).","ingredients":["- 1⅓ tbsp olive oil (Olive oil)","- ⅔ brown onion, finely chopped (Red onion)","- 1⅓ carrots, finely chopped (Carrot)","- ⅔ celery stalk, finely chopped (Celery, raw)","- ½ tsp sea salt flakes (Salt)","- 1⅓ tsp freshly minced garlic (Garlic, raw)","- 333 g minced (ground) beef (Minced beef, 85% lean)","- 1⅓ tbsp tomato paste (Tomato paste, canned)","- 467 g passata (Tomato passata)","- 333 ml beef stock (Beef stock / bouillon, Knorr-style)","- 167 ml water","- 1 tsp dried Italian mixed herbs (Italian mixed herbs, dried)","- 1–2 dried bay leaves (Bay leaf, dried)","- ⅔ tsp sugar (Sugar, white)","- ½ tsp freshly cracked black pepper (Black pepper, ground)","- 267 g dried rigatoni (Pasta, dried)","- 53 ml thickened cream (Nata para cocinar, Hacendado)","- 33 g freshly grated parmesan (Grana Padano)","- ⅓ bunch fresh basil, leaves picked (Basil, fresh)"],"method":["Heat olive oil in a large pan; cook onion, carrot, celery and salt 5–7 minutes until softened.","Add garlic, cook 30 seconds; add beef, cook 4–5 minutes until browned.","Stir in tomato paste; cook 1–2 minutes.","Add passata, stock and water; combine.","Stir in herbs, bay leaves, sugar and pepper; bring to a simmer.","Add rigatoni, submerge; simmer uncovered 18–20 minutes, stirring, until tender.","Remove from heat; cover and rest 10 minutes.","Remove bay leaves; stir through cream and parmesan until silky. Serve with basil."],"notes":["Scaled to 4 servings (×⅔ from the site's 6). Cream → Nata para cocinar; parmesan → Grana Padano.","Computed 626 kcal is close to the site's 677/serving despite the cream/parmesan swaps. Stir cream in off the heat to avoid splitting."]},"dinner/ready-meals/one-pot-creamy-lemon-chicken":{"id":"dinner/ready-meals/one-pot-creamy-lemon-chicken","name":"One-pot Creamy Lemon Chicken","meal":"dinner","servings":4,"calories":661,"protein":41,"carbs":7,"fat":52,"isBase":false,"description":"One-pot baked chicken thigh cutlets in a creamy lemon-garlic spinach sauce. Serves 4.","ingredients":["- 1.2 kg bone-in, skin-on chicken thigh cutlets (Bone-in, skin-on chicken thigh cutlets, raw)","- 1 tsp sea salt flakes (Salt)","- ½ tsp freshly cracked black pepper (Black pepper, ground)","- 1 tbsp paprika (Sweet paprika)","- 1 tbsp olive oil (Olive oil)","- 1 tbsp unsalted butter (Butter, unsalted)","- 3 large garlic cloves, roughly chopped (Garlic, raw)","- 60 ml (¼ cup) fresh lemon juice (Lemon juice, fresh)","- 1 tsp chicken stock powder (Chicken stock, Knorr)","- 250 ml (1 cup) water","- 250 ml (1 cup) thickened cream (Nata para cocinar, Hacendado)","- 90 g (2 cups) baby spinach (Baby spinach)","- 1 tsp dried thyme (Thyme, dried)","- 2 tbsp grated parmesan (Grana Padano)"],"method":["Preheat oven to 200°C (400°F).","Season chicken with salt, pepper and paprika.","Heat olive oil in an ovenproof pan; brown chicken 5–8 minutes; set aside.","Add butter and garlic; cook 1 minute.","Add lemon juice; cook 30 seconds, scraping the pan.","Add stock powder, water, cream, spinach and thyme; cook 30 seconds until spinach wilts; stir in parmesan.","Return chicken; bake uncovered 30 minutes.","Rest 10+ minutes before serving."],"notes":["661 kcal/serving — under the 700 ceiling but heavy; lower than the site's 883 partly because cream → Nata para cocinar (lighter) and parmesan → Grana Padano.","1.2 kg cutlets taken as ≈ 900 g edible meat+skin. Cream stirred in over low heat — keep gentle to avoid splitting."]},"dinner/ready-meals/one-pot-greek-chicken-and-rice":{"id":"dinner/ready-meals/one-pot-greek-chicken-and-rice","name":"One-pot Greek Chicken and Rice","meal":"dinner","servings":4,"calories":540,"protein":46,"carbs":66,"fat":11,"isBase":false,"description":"One-pot lemon-oregano chicken thighs cooked over rice with spinach. Serves 4.","ingredients":["- 600 g boneless, skinless chicken thighs (Chicken thigh, Hacendado)","- 2 tsp freshly minced garlic, divided (Garlic, raw)","- 1 tbsp dried oregano (Oregano, dried)","- ½ tsp sweet paprika (Sweet paprika)","- ½ tsp sea salt flakes (Salt)","- ½ tsp freshly cracked black pepper (Black pepper, ground)","- 3 tbsp lemon juice plus zest of 1 lemon (Lemon juice, fresh)","- 2 tbsp olive oil (Olive oil)","- 1 brown onion, finely diced (Red onion)","- 300 g (1½ cups) white rice, jasmine or basmati (Basmati rice, Hacendado — dry)","- 750 ml (3 cups) chicken stock (Chicken stock, Knorr)","- 90 g (2½ cups) baby spinach, roughly chopped (Baby spinach)","- Fresh parsley, lemon slices, crumbled feta, to serve (optional)"],"method":["Combine chicken with half the garlic, oregano, paprika, salt, pepper, lemon juice, zest and oil; coat evenly.","Cook chicken in a heavy pan over medium heat 5–8 minutes until golden; remove.","Deglaze with 1–2 tbsp water; add onion and remaining garlic; cook 2 minutes.","Add rice, stock, spinach and pepper; simmer, return chicken, cover, cook on lowest heat 20 minutes.","Stand covered 10 minutes. Top with parsley, lemon and feta if desired."],"notes":["Distinct from the tray-bake `easy-greek-chicken`. Dry rice macros used. Chicken stock from Knorr powder. Optional feta excluded from macros."]},"dinner/ready-meals/one-pot-lasagna":{"id":"dinner/ready-meals/one-pot-lasagna","name":"One-pot Lasagne","meal":"dinner","servings":4,"calories":633,"protein":35,"carbs":30,"fat":41,"isBase":false,"description":"One-pot beef lasagne with torn lasagne sheets simmered in sauce, grilled with mozzarella. Serves 4 (scaled from the site's 8).","ingredients":["- 2 tbsp olive oil (Olive oil)","- 1 onion, finely chopped (Red onion)","- 1½ garlic cloves, roughly chopped (Garlic, raw)","- 1 large carrot, grated (Carrot)","- 500 g minced (ground) beef (Minced beef, 85% lean)","- 1 tbsp tomato paste (Tomato paste, canned)","- 1 bay leaf (Bay leaf, dried)","- 350 ml passata (Tomato passata)","- 375 ml (1½ cups) beef stock (Beef stock / bouillon, Knorr-style)","- ½ tsp freshly cracked black pepper (Black pepper, ground)","- ¼ tsp sea salt flakes (Salt)","- 125 g ready-made lasagne sheets (Fresh lasagne sheets)","- 150 g (1 cup) freshly grated mozzarella (Mozzarella rallado, Hacendado)","- 7.5 g basil, leaves picked (Basil, fresh)"],"method":["Heat olive oil in a large ovenproof frying pan over medium heat.","Add onion, garlic, carrot; cook 5 minutes until softened.","Increase heat; add beef, cook 5 minutes until browned.","Add tomato paste, bay leaf, passata, beef stock, pepper, salt; cook 10 minutes.","Tear lasagne sheets in half; submerge into the sauce, distributing evenly.","Cover, cook on lowest heat ~20 minutes per packet.","Preheat oven grill; top with mozzarella; grill 5 minutes until golden.","Sprinkle basil; serve."],"notes":["Scaled to 4 servings (halved from the site's 8). Onion ≈ 110 g, carrot ≈ 60 g."]},"dinner/ready-meals/one-pot-massive-chicken":{"id":"dinner/ready-meals/one-pot-massive-chicken","name":"One-pot massive chicken","meal":"dinner","servings":3,"calories":641,"protein":60,"carbs":80,"fat":10,"isBase":false,"description":"This is a massive chicken and rice meal prep with a ton of food. Makes 3. 45 min. From The Felu Cookbook (p. 263).","ingredients":["- 180 g raw rice","- 600 g skinless, boneless chicken thighs","- 200 g tomato salsa","- 500 g chicken stock","- 1 large onion (150 g)","- 3 carrots (300 g)","- 3 red bell peppers (450 g)","- 4 g smoked paprika","- 3 g garlic powder","- 3 g onion powder","- 3 g chili powder","- 15 g oil","- Salt and black pepper"],"method":["Place the chicken thighs in a bowl and add salt, pepper, garlic powder, onion powder, smoked paprika, and chili powder. Mix until the thighs are coated with the seasoning.","Dice the onion, carrots, and red bell peppers into bite-size pieces.","Add 5g of oil to a pan over medium-high heat and add the chicken thighs. Fry them for 2 minutes on each side, just to get some color, and then remove them from the pan.","Add 10g of oil to the pan and then add the vegetables. Fry them for 7-10 minutes over medium heat, stirring occasionally, until they are soft.","Add the rice, tomato salsa, and 300g of chicken stock (save some stock for later).","Mix everything together, then add the chicken back to the pan. Close the lid and let it simmer for 30 minutes over medium-low heat.","Check on the rice every 10 minutes. If the bottom of the pan is too dry, add more stock and continue simmering.","After 30 minutes, check the rice and adjust the salt if needed.","Remove the chicken from the pan, cut it into smaller bite-size pieces, and add them back to the pan.","Prepare 3 meal prep containers and divide the pan contents equally among them. Done!"],"notes":["It can be stored in the fridge for 3-5 days.","If you can‘t find chicken stock, you can use 20g of stock powder with 500g of water.","You can also make 5 servings. Simply add 50g of onion, 100g of carrots, 150g of peppers, 60g of rice, and 200g of thighs per serving.","Macros recomputed from our per-100g ingredient tables: 1922 kcal for the batch vs the book's 1956 kcal (whole recipe)."]},"dinner/ready-meals/one-pot-orzo":{"id":"dinner/ready-meals/one-pot-orzo","name":"One-pot orzo","meal":"dinner","servings":1,"calories":661,"protein":57,"carbs":73,"fat":17,"isBase":false,"description":"A mediterranean classic dish that is packed with flavor. Single portion. 20 min. From The Felu Cookbook (p. 141).","ingredients":["- 160 g skinless, boneless chicken thighs","- 60 g orzo","- 1 red bell pepper (150 g)","- 1 medium onion (50 g)","- 2 cloves of garlic (≈6 g)","- 75 g spinach","- 15 g vegetable broth powder","- 250 g water","- 25 g light feta cheese","- 1 lemon zest (≈45 g)","- 1/2 lemon juice (≈22.5 g)","- 8 g olive oil","- Salt and black pepper"],"method":["Finely chop the onion and bell pepper. Peel and grate the garlic cloves. Crumble the feta cheese with your hands and place it in a bowl.","Combine the stock powder and water in a glass.","Heat 4g of oil in a 24cm (9.5-inch) pan and sear the chicken thighs on both sides for about 90 seconds. Season with salt and pepper.","Remove the chicken from the pan, then add another 4g of oil. Stir-fry the chopped onion and bell pepper with a pinch of salt for 3 minutes.","Add the grated garlic and orzo, and stir. Next, add the spinach and broth, mix well, and return the chicken to the pan. Cover with a lid and let it simmer for 12 minutes.","Remove the pan from the heat, add the lemon zest and juice, stir again, then top with the crumbled feta cheese. Done!"],"notes":["Don’t use chicken breast in this recipe as it will become dry.","You can make this recipe with rice instead of orzo.","Macros recomputed from our per-100g ingredient tables: 661 kcal for the portion vs the book's 673 kcal (whole recipe)."]},"dinner/ready-meals/orange-chicken":{"id":"dinner/ready-meals/orange-chicken","name":"Orange chicken","meal":"dinner","servings":1,"calories":576,"protein":54,"carbs":76,"fat":7,"isBase":false,"description":"Orange chicken is a perfect sweet and savory meal. Single portion. 20 min. From The Felu Cookbook (p. 177).","ingredients":["- 1 chicken breast (180 g)","- 50 g raw rice","- 1 medium onion (50 g)","- 150 g pak choi","- 1 clove of garlic (≈3 g)","- 4 g ginger paste","- 1 orange (juice) (75 g)","- 20 g soy sauce","- 10 g rice vinegar","- 10 g gochujang","- 4 g cornstarch","- 10 g honey","- 4 g oil","- Black pepper"],"method":["Add rice with water in a pot (18cm or 7inch diameter) with a pinch of salt. Place it on a stove on high heat. As soon the water starts to boil, reduce the heat to low, close the lid and let it simmer for 12-15 minutes.","Chop the onion, pak choi, and peel and grate the garlic. Cut the chicken breast into bite-size cubes.","In a glass combine soy, rice vinegar, gochujang, honey, oarnge juice, and cornstarch and mix until combined.","Preheat a pan (24cm/9.5inch) over medium-high heat and add oil to it. Start by frying the chicken on one side for 1 minute. Flip the chicken and fry for another minute before removing it from the pan.","Add a touch of oil to the pan and add in the onion and pak choi. Add a small pinch of salt and fry the vegetables for 3 minutes, stirring occasionally.","Now, add grated ginger and garlic and keep frying for 20 seconds. Then add the sauce, close the lid and let it simmer for 30-60 seconds until thick.","Add back the chicken to the pan and mix everything. Plate the rice and add the orange chicken on top. Done!"],"notes":["Top with cilantro or sesame seeds for som
