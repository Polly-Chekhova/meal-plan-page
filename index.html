<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3f6b4e">
<meta name="color-scheme" content="light">
<title>This week's meal plan</title>
</head>
<body>
<style>
  :root {
    --paper: #f5f6f2;
    --surface: #ffffff;
    --ink: #1e241f;
    --muted: #6e756c;
    --faint: #9aa198;
    --accent: #3f6b4e;
    --accent-deep: #2f5a3e;
    --accent-soft: #e7efe7;
    --warn: #a65a25;
    --warn-soft: #f7ebdd;
    --line: #e4e7e0;
    --line-soft: #eef0ea;
    --shadow: 0 1px 2px rgba(30, 36, 31, .05), 0 8px 24px rgba(30, 36, 31, .06);
    --font-head: Georgia, "Iowan Old Style", "Palatino", "Times New Roman", serif;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
    --r: 14px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }

  .wrap {
    max-width: 560px; margin: 0 auto;
    padding: 0 max(16px, env(safe-area-inset-left)) calc(96px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
  }

  /* ---- header ---- */
  header.top {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--paper) 88%, transparent);
    backdrop-filter: saturate(1.4) blur(10px);
    -webkit-backdrop-filter: saturate(1.4) blur(10px);
    border-bottom: 1px solid var(--line);
    margin: 0 -16px 16px;
    padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
  }
  .top-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1.title { font-family: var(--font-head); font-weight: 600; font-size: 22px; margin: 2px 0 0; letter-spacing: -.01em; }
  .when { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .target-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .tchip {
    font-size: 11.5px; color: var(--muted); background: var(--surface);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
    font-variant-numeric: tabular-nums;
  }
  .tchip-strong { color: var(--accent-deep); border-color: var(--accent-soft); background: var(--accent-soft); font-weight: 600; }

  /* ---- day card ---- */
  .day {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
    box-shadow: var(--shadow); margin-bottom: 14px; overflow: hidden;
  }
  .day-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 13px 15px 10px;
  }
  .day-name { font-family: var(--font-head); font-size: 17px; font-weight: 600; }
  .day-name .full { color: var(--faint); font-weight: 400; font-size: 12.5px; font-family: var(--font-ui); margin-left: 6px; }
  .day-macros { display: flex; gap: 5px; font-variant-numeric: tabular-nums; }
  .m {
    font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--line-soft);
    color: var(--muted); white-space: nowrap;
  }
  .m b { font-weight: 600; color: var(--ink); }
  .m.warn { background: var(--warn-soft); color: var(--warn); }
  .m.warn b { color: var(--warn); }
  .m.ok-p { background: var(--accent-soft); color: var(--accent-deep); }
  .m.ok-p b { color: var(--accent-deep); }

  /* ---- meal rows ---- */
  .meal {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 15px; border-top: 1px solid var(--line-soft);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
    transition: background .12s ease;
  }
  .meal:hover { background: #fafbf9; }
  .meal:active { background: #f2f4ef; }
  .meal-main { flex: 1; min-width: 0; }
  .slot-label { font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
  .meal-name { font-family: var(--font-head); font-size: 15px; line-height: 1.25; margin-top: 1px; }
  .meal-note { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .meal-name.takeaway { color: var(--muted); font-style: italic; font-family: var(--font-ui); font-size: 14px; }
  .badge {
    font-size: 12px; font-variant-numeric: tabular-nums; color: var(--accent-deep);
    background: var(--accent-soft); border-radius: 8px; padding: 4px 8px; white-space: nowrap;
    font-weight: 600; text-align: right;
  }
  .badge small { font-weight: 400; color: var(--accent); }
  .swap {
    flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
    width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
    cursor: pointer; transition: all .12s ease; padding: 0;
  }
  .swap:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .swap svg { width: 16px; height: 16px; display: block; }

  /* ---- side / floor strip ---- */
  .strip {
    display: flex; align-items: center; gap: 10px; padding: 10px 15px;
    border-top: 1px solid var(--line-soft); font-size: 12.5px;
  }
  .strip.side { color: var(--muted); background: #fbfcfa; }
  .strip .muted { color: var(--faint); }
  .strip.side .badge { background: var(--line-soft); color: var(--muted); }
  .strip.side .badge small { color: var(--faint); }
  .strip.floor { background: var(--warn-soft); color: var(--warn); }
  .strip .grow { flex: 1; min-width: 0; }
  .strip .grow b { font-weight: 600; }
  .btn-inline {
    flex: none; font-size: 12px; font-weight: 600; border-radius: 8px; padding: 6px 11px;
    border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer;
  }
  .btn-inline.solid { background: var(--warn); color: #fff; border-color: var(--warn); }
  .link-inline { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }

  /* ---- toolbar ---- */
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 0 0 14px; }
  .btn-new {
    flex: 1; font-family: var(--font-ui); font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: none; border-radius: 11px; padding: 11px 14px;
  }
  .btn-new:active { background: var(--accent-deep); }
  .btn-ghost {
    font-family: var(--font-ui); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted);
    background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 11px 14px;
  }
  .btn-ghost:active { background: var(--paper); }
  .btn-save {
    flex: 1; font-family: var(--font-ui); font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent-deep); color: #fff; border: none; border-radius: 11px; padding: 11px 14px;
  }
  .btn-save:active { background: #24462f; }
  .btn-shop {
    width: 100%; font-family: var(--font-ui); font-size: 14px; font-weight: 600; cursor: pointer;
    background: var(--accent-soft); color: var(--accent-deep); border: 1px solid var(--accent-soft);
    border-radius: 11px; padding: 12px 14px; margin: 0 0 14px;
  }
  .btn-shop:active { background: #dbe7db; }
  .subbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: -4px 0 14px; }
  .gen-banner {
    background: var(--accent-soft); color: var(--accent-deep); border-radius: 11px;
    padding: 10px 13px; font-size: 12.5px; margin: 0 0 14px; line-height: 1.4;
  }

  /* ---- grocery / history ---- */
  .g-actions { display: flex; gap: 8px; margin: 4px 0 16px; }
  .g-actions button {
    flex: 1; font-family: var(--font-ui); font-size: 13px; font-weight: 600; cursor: pointer;
    border-radius: 10px; padding: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .g-actions button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .g-actions button:disabled { opacity: .5; }
  .g-list { list-style: none; margin: 0 0 4px; padding: 0; }
  .g-list li { font-size: 13.5px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); font-variant-numeric: tabular-nums; }
  .g-misc li { color: var(--muted); }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: #fff; font-size: 13px; padding: 10px 16px; border-radius: 999px; z-index: 60;
    box-shadow: var(--shadow); max-width: 90%; text-align: center;
  }
  .hist-item { padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
  .hist-date { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .hist-picks { font-size: 13px; margin-top: 4px; line-height: 1.5; }
  .hist-picks b { font-family: var(--font-head); font-weight: 600; }

  /* ---- footer actions ---- */
  .foot { display: flex; justify-content: center; margin-top: 8px; }

  /* ---- sheet / modal ---- */
  .scrim {
    position: fixed; inset: 0; background: rgba(30, 36, 31, .38); z-index: 40;
    opacity: 0; pointer-events: none; transition: opacity .2s ease;
  }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--surface); border-radius: 18px 18px 0 0;
    max-width: 560px; margin: 0 auto; max-height: 88vh; display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .26s cubic-bezier(.32, .72, 0, 1);
    box-shadow: 0 -8px 40px rgba(30, 36, 31, .22);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-grab { width: 38px; height: 4px; border-radius: 2px; background: var(--line); margin: 9px auto 4px; flex: none; }
  .sheet-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 6px 18px 12px; border-bottom: 1px solid var(--line-soft); flex: none;
  }
  .sheet-title { font-family: var(--font-head); font-size: 19px; font-weight: 600; line-height: 1.2; }
  .sheet-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .x { flex: none; border: none; background: var(--line-soft); color: var(--ink); width: 30px; height: 30px; border-radius: 999px; font-size: 17px; cursor: pointer; line-height: 1; }
  .sheet-body { padding: 4px 18px calc(26px + env(safe-area-inset-bottom)); overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* recipe detail */
  .macro-strip { display: flex; gap: 8px; margin: 14px 0 6px; }
  .macro-strip .cell {
    flex: 1; text-align: center; background: var(--paper); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 4px; font-variant-numeric: tabular-nums;
  }
  .macro-strip .cell .v { font-size: 16px; font-weight: 600; }
  .macro-strip .cell .k { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
  .macro-strip .cell.p { background: var(--accent-soft); border-color: var(--accent-soft); }
  .macro-strip .cell.p .v { color: var(--accent-deep); }
  .desc { font-size: 13.5px; color: var(--muted); margin: 12px 0 0; }
  .rsec-h { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 20px 0 8px; }
  .rsub { font-family: var(--font-head); font-size: 13.5px; font-weight: 600; margin: 12px 0 4px; }
  .ing, .steps, .notes { margin: 0; padding-left: 18px; }
  .ing li, .notes li { font-size: 13.5px; margin: 4px 0; }
  .steps { padding-left: 20px; }
  .steps li { font-size: 13.5px; margin: 7px 0; padding-left: 3px; }
  .notes li { color: var(--muted); }

  /* swap / side option list */
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    padding: 12px 4px; border: none; border-bottom: 1px solid var(--line-soft);
    background: none; cursor: pointer; color: var(--ink); font-family: var(--font-ui);
  }
  .opt:active { background: #f6f8f4; }
  .opt-main { flex: 1; min-width: 0; }
  .opt-name { font-family: var(--font-head); font-size: 14.5px; }
  .opt-macros { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .opt-badge { font-size: 12px; font-weight: 600; color: var(--accent-deep); background: var(--accent-soft); border-radius: 8px; padding: 4px 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .opt.current { }
  .opt-cur-tag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .sort-note { font-size: 11.5px; color: var(--faint); margin: 2px 0 10px; }

  .empty { text-align: center; padding: 80px 20px; color: var(--muted); font-family: var(--font-head); }

  /* ---- access gate ---- */
  #gate {
    position: fixed; inset: 0; z-index: 100; background: var(--paper);
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .gate-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
    box-shadow: var(--shadow); padding: 26px 22px; width: 100%; max-width: 340px; text-align: center;
  }
  .gate-mark { font-size: 30px; line-height: 1; }
  .gate-card h2 { font-family: var(--font-head); font-weight: 600; font-size: 20px; margin: 12px 0 4px; }
  .gate-card p { font-size: 12.5px; color: var(--muted); margin: 0 0 18px; }
  .gate-card input {
    width: 100%; font-size: 16px; font-family: var(--font-ui); color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px; margin-bottom: 9px; -webkit-appearance: none;
  }
  .gate-card input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .gate-card button {
    width: 100%; font-size: 14px; font-weight: 600; font-family: var(--font-ui);
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 12px; margin-top: 4px; cursor: pointer;
  }
  .gate-card button:active { background: var(--accent-deep); }
  .gate-err { color: var(--warn); font-size: 12.5px; min-height: 16px; margin-top: 10px; }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .scrim, .meal, .swap { transition: none; }
  }
</style>

<div id="gate">
  <form class="gate-card" id="gate-form">
    <div class="gate-mark">🥗</div>
    <h2>This week's meal plan</h2>
    <p>Enter the shared login to view.</p>
    <input id="gate-user" type="text" autocomplete="username" placeholder="Login" autocapitalize="none" autocorrect="off" spellcheck="false" />
    <input id="gate-pass" type="password" autocomplete="current-password" placeholder="Password" />
    <button type="submit">Open plan</button>
    <div class="gate-err" id="gate-err"></div>
  </form>
</div>

<div id="app" class="wrap"></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-grab"></div>
  <div class="sheet-head">
    <div>
      <div class="sheet-title" id="sheet-title"></div>
      <div class="sheet-sub" id="sheet-sub"></div>
    </div>
    <button class="x" id="sheet-close" aria-label="Close">&times;</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</div>

d; gently fold through the blueberries.","Heat a non-stick pan over medium-low with a little olive oil. Scoop in batter, cook 1–2 min per side, covering with a lid halfway to cook through. Repeat for ~8 small pancakes.","Divide between 2 plates. Top each portion with 150g protein yogurt and a 10g maple drizzle."],"notes":["`servings: 2` = cooked for 2 people; your per-serving macros are half the batter plus one yogurt side.","The protein yogurt side lifts this to ~25g protein, hitting the ≥25g breakfast target — without it the pancakes alone are only ~10g protein.","Baking powder and vanilla extract were added to `ingredients-common.md` from USDA for this recipe."]},"breakfast/ready-meals/crepes":{"id":"breakfast/ready-meals/crepes","name":"Simple crepes with berries & yogurt","meal":"breakfast","servings":2,"calories":536,"protein":32.3,"carbs":60.3,"fat":19.6,"isBase":false,"description":"Sunday / weekend long breakfast: thin classic crepes cooked for 2 (flour, eggs, milk, a little butter & sugar), served with strawberries and protein yogurt. Per-serving macros = your one portion (half the batter + the yogurt & berry side).","ingredients":["### Crepe batter (2-serving batch, ~6 thin crepes)","- 100g plain (all-purpose) flour (generic/USDA)","- 250g (250ml) whole (full-cream) milk (generic/USDA)","- 120g (2 XL eggs, Hacendado)","- 15g (1 tbsp) butter, unsalted (generic/USDA), melted","- 10g (~2 tsp) sugar, white/caster (generic/USDA)","- pinch salt (sea salt flakes)","- 2.5g (½ tsp) olive oil, for the pan (generic/USDA)","### To serve (per portion)","- 150g protein yogurt (Hacendado)","- 80g strawberry (generic/USDA)"],"method":["Whisk the flour, sugar and a pinch of salt in a bowl. Make a well, crack in the eggs and whisk in.","Gradually whisk in the milk until you have a smooth, thin batter, then whisk in the melted butter. Rest 10 min if you have time.","Heat a non-stick pan over medium with a little olive oil. Pour in a thin ladle of batter, swirl to coat, cook ~1 min until the edges lift, flip and cook ~30 sec more. Repeat for ~6 crepes.","Divide between 2 plates. Serve each portion folded or rolled with 150g protein yogurt and 80g sliced strawberries (swap in blueberries if you prefer)."],"notes":["`servings: 2` = cooked for 2 people; your per-serving macros are half the batter plus one yogurt & berry side.","The protein yogurt side carries the protein to ~32g, comfortably over the ≥25g breakfast target; the crepes alone are ~17g protein.","Crepe batter is thinner than pancake batter — no raising agent, so they stay flat and delicate."]},"breakfast/ready-meals/granola-yogurt-blueberry-bowl":{"id":"breakfast/ready-meals/granola-yogurt-blueberry-bowl","name":"Granola, yogurt & blueberry bowl","meal":"breakfast","servings":1,"calories":337,"protein":21,"carbs":41,"fat":11,"isBase":false,"description":"Assembly bowl using pre-made [granola base](../base/granola-base.md). No cooking — ~2 min to make.","ingredients":["- 30g granola base (see [../base/granola-base.md](../base/granola-base.md))","- 100g Greek yogurt light (Hacendado)","- 100g protein yogurt (Hacendado)","- 50g banana","- 50g blueberry"],"method":["Layer the two yogurts in a bowl.","Top with granola, sliced banana, and blueberries."],"notes":[]},"breakfast/ready-meals/sunny-side-eggs-veggie-plate":{"id":"breakfast/ready-meals/sunny-side-eggs-veggie-plate","name":"Sunny side eggs, veggies & toast","meal":"breakfast","servings":1,"calories":417,"protein":30,"carbs":26,"fat":23,"isBase":false,"description":"Full breakfast plate built on [sunny-side eggs base](../base/sunny-side-eggs-base.md). Eggs cooked fresh; veg can be pre-chopped.","ingredients":["- 1 portion sunny-side eggs base (see [../base/sunny-side-eggs-base.md](../base/sunny-side-eggs-base.md))","- 1 slice mixed-grain bread — ~42.5g","- 5g Philadelphia light","- 50g cherry tomatoes, halved","- 50g cucumber, sliced","- 20g baby spinach (small handful)","- _Optional: 50g avocado, sliced_"],"method":["Cook the egg base per its method.","Toast the bread. Spread with Philadelphia light.","Plate the eggs alongside cherry tomatoes, cucumber, and spinach. Add avocado if using."],"notes":["**Bread macros are a placeholder** (USDA mixed-grain). Update `ingredients-common.md` with the actual label.","Cheese (Havarti) and turkey variants can be split into their own plate files later, swapping the protein add-on.","Decent breakfast carb load (~26g) — good for tennis-day mornings."]},"breakfast/ready-meals/turkey-egg-avocado-toast":{"id":"breakfast/ready-meals/turkey-egg-avocado-toast","name":"Turkey, egg & avocado toast","meal":"breakfast","servings":1,"calories":405,"protein":44.9,"carbs":25.3,"fat":15.2,"isBase":false,"description":"Sunday / weekend savoury breakfast, cooked fresh per portion. Lean turkey and an egg-white-boosted scramble over toast with a little avocado and tomato — high protein, high satiety. Built from existing pantry ingredients (no new ingredients added).","ingredients":["- 1 XL egg (Hacendado) — 70g","- 100g liquid egg whites (Guillén)","- 70g Turkey breast, roasted/deli (skinless)","- 30g avocado, sliced","- 1 slice mixed-grain bread — ~42.5g","- 50g cherry tomatoes, halved"],"method":["Whisk the whole egg with the egg whites and scramble gently in a non-stick pan (no oil needed) until just set.","Warm the turkey through briefly in the same pan.","Toast the bread. Top with the scramble, turkey, sliced avocado and cherry tomatoes."],"notes":["Macros computed from `ingredients.md` (XL eggs, egg whites) and `ingredients-common.md` (turkey breast, avocado, mixed-grain bread, cherry tomatoes) — no site nutrition copied.","**Bread macros are a placeholder** (USDA mixed-grain estimate, already flagged in `ingredients-common.md`) — update from the actual label.","Egg-white boost + lean turkey give ~45g protein at only 15g fat — the highest-protein breakfast in the week, sized as the Sunday special."]},"dinner/ready-meals/15-minute-tortilla-pizza":{"id":"dinner/ready-meals/15-minute-tortilla-pizza","name":"15-minute tortilla pizza","meal":"dinner","servings":1,"calories":446,"protein":32,"carbs":40,"fat":17,"isBase":false,"description":"If you want pizza and you want it now - this recipe is for you! Single portion. 15 min. From The Felu Cookbook (p. 67).","ingredients":["- 1 wheat tortilla (25cm or 10inch) (≈62 g)","- 50 g shredded mozzarella","- 50 g deli meat","- 100 g storebought tomato sauce","- 1 g oregano","- 2 g oil","- Salt and black pepper"],"method":["Heat up a cast iron pan on medium-high. Add oil to the pan.","Add a tortilla and let it cook for 2 minutes until the bottom gets color.","Spread the tomato sauce, deli meat and Mozzarella on top.","Season with salt, pepper, and oregano.","Put the cast iron pan under the broiler on top a baking sheet for 2-3 minutes until the cheese starts to become brown and bubbly.","Remove the homemade pizza and enjoy!"],"notes":["You can change up the toppings and use tuna with onions or a vegetabrian pizza for more volume!","Macros recomputed from our per-100g ingredient tables: 446 kcal for the portion vs the book's 419 kcal (whole recipe)."]},"dinner/ready-meals/2-ingredient-pizza":{"id":"dinner/ready-meals/2-ingredient-pizza","name":"2-ingredient pizza","meal":"dinner","servings":1,"calories":493,"protein":38,"carbs":49,"fat":16,"isBase":false,"description":"Turn the 2 ingredient dough into speedy delicious pizza! Single portion. 15 min. From The Felu Cookbook (p. 68).","ingredients":["- 1 serving 2 ingredient dough (Felu Cookbook p. 246 — not imported)","- 50 g shredded mozzarella","- 50 g deli meat","- 60 g storebought tomato sauce","- 1 g oregano","- 2 g oil","- Salt and black pepper"],"method":["Start by making 1 serving of 2-ingredient dough.","Add a bit of oil to a pan (25cm/10 inches) and place the dough ball in it. Now, shape the dough into a round pizza by pressing it down and pushing out the edges.","Turn the heat to medium and cook the bottom of the dough for 3-4 minutes. Then, flip the dough and cook for another 2-3 minutes.","Next, spread the tomato sauce on top, followed by the deli meat, and finally the cheese.","Put the pizza under the broiler for 1 minute until the cheese is fully melted. Done!"],"notes":["You can change up the toppings and use tuna with onions or a vegetabrian pizza for more volume!","Macros recomputed from our per-100g ingredient tables: 493 kcal for the portion vs the book's 475 kcal (whole recipe)."]},"dinner/ready-meals/air-fryer-chicken-crispy-potatoes":{"id":"dinner/ready-meals/air-fryer-chicken-crispy-potatoes","name":"Air-fryer chicken & crispy potatoes","meal":"dinner","servings":1,"calories":509,"protein":51,"carbs":65,"fat":7,"isBase":false,"description":"Once you make these potatoes for the first time, you’ll never go back to eating normal potatoes. Single portion. 35 min. From The Felu Cookbook (p. 122).","ingredients":["- 1 chicken breast (180 g)","- 350 g mealy potatoes","- 2 g garlic powder","- 2 g cayenne pepper","- ½ tsp baking soda (3 g)","- 2000 g water","- 4 g oil","- Salt and black pepper"],"method":["Clean the potatoes and peel them, in this case peeling them will make it crunchier. Then cut them into chunks.","Prepare the chicken as described in the chapter “How to tenderize chicken breast”.","Add the water to a pot and bring to a boil. Add baking soda and a couple of teaspoons salt. Add in the potatoes and let them simmer for 10 minutes.","Rinse the potatoes and add them to a bowl.","Add oil and black pepper. Shake the bowl for around 30 seconds, so the surface of the potatoes starts to break, and the surface of the bowl gets coded with a slurry.","Bake the potatoes in the air fryer at 180°C or 350°F for 15 minutes.","After 15 minutes, flip the potatoes and keep baking them for another 15 minutes.","Add salt, pepper, garlic powder, and cayenne pepper to a glass and mix.","Add 2g of oil to the chicken breast and cover it with garlic powder and cayenne pepper.","Add chicken to the air fryer for the last 10-12 minutes. If you don‘t have space for everything in your air fryer you can fry the chicken in a pan or bake it in the oven.","Use a food thermometer to prevent overbaking the chicken.","Add everything to a plate. Done!"],"notes":["Avocado Greek yogurt dip is perfect as a dipping sauce for this recipe.","Macros recomputed from our per-100g ingredient tables: 509 kcal for the portion vs the book's 497 kcal (whole recipe)."]},"dinner/ready-meals/air-fryer-chicken-nuggets":{"id":"dinner/ready-meals/air-fryer-chicken-nuggets","name":"Air-fryer chicken nuggets","meal":"dinner","servings":1,"calories":317,"protein":49,"carbs":27,"fat":3,"isBase":false,"description":"The juiciest chicken nuggets that are not deep fried. Single portion. 20 min. From The Felu Cookbook (p. 157).","ingredients":["- 1 chicken breast (180 g)","- 5 g flour","- 30 g egg whites","- 25 g cornflakes","- 1 g cayenne pepper","- 1 g smoked paprika","- Salt and black pepper"],"method":["Start by dry-brining the chicken as described in the chapter „How to Cook a Juicy Chicken Breast.“","After brining, cut the chicken into nuggets. The size of the nuggets will dictate the baking time, with thicker nuggets needing longer in the air fryer or oven.","To create the breading, add cornflakes to a ziplock bag and crush them into a rough powder using a heavy pot.","Set up three separate bowls containing flour, egg whites, and crushed cornflakes. Dip each piece of chicken into the bowls in that order, making sure that each piece is fully coated with breading.","Place the chicken into the air fryer basket and spray some oil on top. Flip the chicken and add another spritz of oil.","Set the air fryer to 200°C or 400°F and cook for 8-12 minutes. Use a food thermometer to ensure that the internal temperature of the chicken reaches 74°C or 165°F to be safe."],"notes":["As a dipping sauce I recommend using the ranch sauce or the PB sauce from this book, see chapter.","Macros recomputed from our per-100g ingredient tables: 317 kcal for the portion vs the book's 351 kcal (whole recipe)."]},"dinner/ready-meals/alfredo-chicken":{"id":"dinner/ready-meals/alfredo-chicken","name":"Alfredo chicken","meal":"dinner","servings":1,"calories":623,"protein":70,"carbs":60,"fat":13,"isBase":false,"description":"Alfredo chicken is a wonderful comfort meal! Single portion. 20 min. From The Felu Cookbook (p. 170).","ingredients":["- 1 chicken breast (180 g)","- 250 g potatoes","- 1 medium onion (50 g)","- 1 clove of garlic (≈3 g)","- 1 g garlic powder","- 1 g onion powder","- 4 g oil","- 100 g cottage cheese","- 15 g parmesan cheese","- 50 g evaporated milk","- Salt and black pepper"],"method":["Peel and cut the potatoes into thick slices, then into fries, and then again into bite-size cubes (2x2cm or 1x1 inch).","Place the potatoes in a pot filled with water, add salt, and bring it to a boil. Allow the potatoes to simmer for 10-12 minutes until they are soft.","Dice the onion and peel and grate the garlic. Slice the chicken breast into thin slices.","In a blender, combine cottage cheese, evaporated milk, garlic powder, onion powder, and some black pepper. Blend on high for 30 seconds.","Add 2g of oil to a pan (18cm/7inch) over medium heat. Add the onions with a pinch of salt and sauté them for 2-3 minutes.","Push the onions aside, add a bit more oil, and then add the chicken breast. Season with some salt and pepper, and cook the chicken breast for 1-2 minutes on each side.","Remove the pan from the heat and immediately pour in the blended sauce. Grate the parmesan cheese on top and mix everything for 30 seconds.","Plate the boiled potatoes and place the chicken alfredo on top."],"notes":["Can be made with 60g (weighted raw) pasta instead potatoes.","The sauce can be also prepared with 10g of gochujang for additional heat.","Macros recomputed from our per-100g ingredient tables: 623 kcal for the portion vs the book's 636 kcal (whole recipe)."]},"dinner/ready-meals/baked-chicken-nuggets":{"id":"dinner/ready-meals/baked-chicken-nuggets","name":"Baked chicken nuggets","meal":"dinner","servings":4,"calories":408,"protein":30,"carbs":38.1,"fat":14.9,"isBase":false,"description":"Oven-baked panko chicken nuggets with a sweet-and-sour pineapple dipping sauce. Makes 4 portions. Source: simplehomeedit.com. > **Fully computed — no placeholders.** Chicken mince, panko, flour, ketchup, cider vinegar, mustard powder and pineapple juice are sourced (USDA), and the 20g Grana Padano in the coating now has a branded label, so every ingredient is accounted for. Computed 408 kcal / 30g protein per serving lands right on the site's 414 kcal / 30g protein reference; the site number is *not* written here per the recompute rule.","ingredients":["**Sweet & sour dipping sauce:**","- 125ml pineapple juice","- 2 tbsp (42g) honey (BM)","- 1 tbsp (~17g) tomato ketchup","- 2 tsp soy sauce (Kikkoman)","- 2 tsp apple cider vinegar","- ¼ tsp mustard powder, ground","- 1½ tsp (~4g) cornstarch / cornflour (Maizena), mixed with 2 tsp water","**Coating:**","- 75g panko breadcrumbs","- 20g Grana Padano, grated","- 1 tsp (~2.5g) sweet paprika","- ½ tsp sea salt flakes","- ¼ tsp black pepper, ground","**Chicken:**","- 500g minced (ground) chicken, raw","- 1 XL egg (Hacendado)","- 30g panko breadcrumbs","- 2 tbsp (~16g) plain (all-purpose) flour","- 1 tsp soy sauce (Kikkoman)","- 1 tsp (~2.5g) onion powder","- ½ tsp (~1.5g) garlic, raw, grated","- ¼ tsp black pepper, ground","- ½ tsp sea salt flakes","- Olive oil spray"],"method":["**Sauce:** combine pineapple juice, honey, ketchup, soy sauce, vinegar and mustard powder; simmer 2–3 min, then stir in the cornflour slurry until thickened.","Combine all coating ingredients in a bowl.","Preheat the oven to 190°C (375°F).","Mix the chicken mince, egg, panko, flour, soy sauce, onion powder, garlic, salt and pepper.","Roll 1 tbsp portions, coat in the breadcrumb mix and place on a lined tray.","Spray generously with oil; bake 15–18 min, turning and re-spraying halfway, until golden."],"notes":["Per-serving macros now include every ingredient: chicken mince, panko, flour, ketchup, cider vinegar, mustard powder and pineapple juice (USDA), plus the 20g Grana Padano coating (branded label). No `?` placeholders remain. Computed 408 kcal / 30g protein matches the site's 414 kcal / 30g reference."]},"dinner/ready-meals/baked-chicken-rissoles":{"id":"dinner/ready-meals/baked-chicken-rissoles","name":"Baked chicken rissoles","meal":"dinner","servings":4,"calories":306,"protein":28.9,"carbs":13.2,"fat":15.3,"isBase":false,"description":"Oven-baked panko-crumbed chicken rissoles (12 rissoles, 3 per serve). Makes 4 portions. Source: simplehomeedit.com. > **Fully computed — no placeholders.** Chicken mince and panko are sourced (USDA), and the 35g Grana Padano and 1 tsp (~3.5g) Knorr chicken stock now have branded labels, so every ingredient is accounted for. Computed 306 kcal / 28.9g protein per serving runs just under the site's 316 kcal / 28g protein reference; the site number is *not* written here per the recompute rule.","ingredients":["**Rissoles:**","- Olive oil spray","- 500g minced (ground) chicken, raw","- 1 small (~70g) brown onion (yellow), grated","- 1 tsp (~3g) garlic, raw, minced","- 1 tbsp (~4g) parsley, fresh, chopped, plus extra to serve","- 20g panko breadcrumbs","- 1 XL egg (Hacendado)","- 1 tsp (~3.5g product) chicken stock (Knorr)","- Black pepper, ground, to season","**Coating:**","- 1 tsp (~2.5g) sweet paprika","- 40g panko breadcrumbs","- 35g Grana Padano, grated","- ¼ tsp sea salt flakes","- ¼ tsp black pepper, ground"],"method":["Preheat the oven to 220°C (200°C fan); spray a baking tray with oil.","Combine the coating ingredients in a shallow bowl.","Mix the chicken, onion, garlic, parsley, panko, egg, stock powder and pepper.","Form ¼-cup portions into rissoles, roll in the coating, and place on the tray. Spray generously with oil.","Bake 18–20 min, turning and re-spraying halfway, until golden.","Serve with lemon wedges and extra parsley (mashed potato on the side optional)."],"notes":["Per-serving macros now include every ingredient: chicken mince and panko (USDA), plus the 35g Grana Padano and 1 tsp (~3.5g product) Knorr chicken stock (branded labels). No `?` placeholders remain. The Knorr conversion is 28g product = 500ml prepared stock, so 1 tsp ≈ 3.5g of product. Computed 306 kcal / 28.9g protein runs just under the site's 316 kcal / 28g reference."]},"dinner/ready-meals/baked-garlic-chicken-breast":{"id":"dinner/ready-meals/baked-garlic-chicken-breast","name":"Baked garlic chicken breast","meal":"dinner","servings":4,"calories":234,"protein":30.2,"carbs":2.8,"fat":12,"isBase":false,"description":"Quick marinated garlic-paprika chicken breast steaks. Makes 4 portions (2 breasts halved into 4 steaks). Source: simplehomeedit.com. > Fully resolved — all ingredients now have real macros. Computed **234 kcal** vs the site's 199 kcal (+18%, within tolerance). Chicken breast assumed at ~250g per large breast (500g total raw).","ingredients":["- 500g chicken breast (Hacendado) (2 large breasts, halved into 4 steaks)","- 3 tbsp (42g) olive oil","- 1 tsp (~4g) brown sugar","- 1 tbsp (~15g) lemon juice, fresh","- 1 tsp (~3g) garlic, raw, minced","- 1 tsp (~2.5g) sweet paprika","- 1 tsp (~1g) thyme, dried","- 1 tsp sea salt flakes","- ½ tsp black pepper, ground","- Fresh thyme, to garnish (optional)"],"method":["Preheat the oven to 220°C (200°C fan).","Pound the chicken between parchment to an even ~1.5cm thickness.","Combine the oil, brown sugar, lemon juice, garlic, paprika, dried thyme, salt and pepper; coat the chicken.","Bake on a lined tray 15–18 min until cooked through (74°C internal).","Rest 2 min, garnish with fresh thyme. Serve with mashed potato and a leafy salad."],"notes":["All ingredients resolved against the ingredient tables (brown sugar and dried thyme sourced from USDA into `ingredients-common.md`).","Lean ~30g protein for lettuce, cut into strips","- 3 tbsp (42g) olive oil","- 1 tbsp (~15g) lemon juice, fresh","- ½ tsp sea salt flakes","- ¼ tsp black pepper, ground"],"method":["Preheat the oven to 220°C (200°C fan).","**Dip:** combine all dip ingredients (using Greek yogurt in place of the mayo) until smooth; chill.","Mix the panko with garlic powder, paprika, salt and pepper.","Coat each tender: flour → egg → panko. Arrange on an oiled rack/tray, spray with oil.","Bake 16–18 min, flipping halfway, until golden.","**Garlic butter:** mix the melted Mantequilla light with garlic, salt and parsley; brush over the hot tenders and sprinkle with Grana Padano.","**Salad:** toss the cos with oil, lemon, salt and pepper. Serve with the dip and fries."],"notes":["The dip mayo was swapped for an equal weight of Greek yogurt light (Hacendado). Cold dip, so no heat-splitting risk.","Computed total is lower than the site's 849 kcal because of the mayo→yogurt swap. All ingredients are resolved: chicken tenderloin, panko and flour from USDA (`ingredients-common.md`); butter as Mantequilla light (Hacendado); parmesan as Grana Padano."]},"dinner/ready-meals/baked-lemon-garlic-butter-salmon":{"id":"dinner/ready-meals/baked-lemon-garlic-butter-salmon","name":"Baked lemon garlic butter salmon","meal":"dinner","servings":4,"calories":412,"protein":31,"carbs":3,"fat":30.1,"isBase":false,"description":"Oven-baked salmon fillets in a lemon-garlic-butter glaze. Makes 4 portions. Source: simplehomeedit.com. > Fully resolved — salmon computed against generic raw Atlantic salmon (USDA, `ingredients-common.md`), butter as Mantequilla light (Hacendado), dried oregano from USDA. Computed **412 kcal / 31g protein** vs the site's **407 kcal / 34g protein** — within 2%, a clean match. Salmon assumed at ~150g per fillet (600g total raw). No `?` placeholders remain.","ingredients":["- 2 tbsp (28g) Mantequilla light (Hacendado), melted","- 2 tbsp (28g) olive oil","- 2 tbsp (~30g) lemon juice, fresh","- 1 tsp (~3g) garlic, raw, minced","- 1 tsp (~7g) honey (BM)","- 1 tsp (~2.5g) sweet paprika","- 1 tsp (~1g) oregano, dried","- 1 tsp sea salt flakes","- ½ tsp black pepper, ground","- ½ tsp chilli flakes (optional)","- 4 (~150g each, 600g) salmon, Atlantic, raw, skin-on","- Lemon slices and chopped parsley, to serve"],"method":["Preheat the oven to 220°C (425°F).","Mix the melted Mantequilla light, oil, lemon juice, garlic, honey, paprika, oregano, salt, pepper and chilli flakes.","Place the salmon skin-side down in a roasting tin; spoon the glaze over.","Bake 12 min, then broil 3 min until caramelised.","Serve with mashed potato/greens, lemon slices and parsley."],"notes":["All ingredients resolved: salmon as generic raw Atlantic salmon (USDA), butter as Mantequilla light (Hacendado), dried oregano from USDA. Computed 412 kcal lands within 2% of the site's 407 kcal."]},"dinner/ready-meals/baked-miso-salmon":{"id":"dinner/ready-meals/baked-miso-salmon","name":"Baked miso salmon","meal":"dinner","servings":4,"calories":400,"protein":32.9,"carbs":10.6,"fat":24.5,"isBase":false,"description":"Oven-baked miso-glazed salmon with quick pickled red onion, served over rice with greens. Makes 4 portions. Source: simplehomeedit.com. > Fully computed. Computed **400 kcal / 32.9g protein** vs the site's **351 kcal / 37g protein** (+14%, within tolerance). Miso paste and tamari use **generic USDA values** (no label supplied yet) — swap in your label macros if they differ. Salmon assumed at ~150g per fillet (600g total raw).","ingredients":["**Red onion pickle:**","- 1 (~110g) red onion, finely sliced","- 2 tbsp (30g) rice wine vinegar (Otafuku)","- 1 tsp (~4g) sugar, white/caster","**Salmon:**","- 4 (~150g each, 600g) salmon, Atlantic, raw, skin-on","**Marinade:**","- 2 tbsp (~34g) miso paste (generic/USDA)","- 2 tbsp (~32g) tamari (generic/USDA), or soy sauce","- 1 tbsp (~14g) sesame oil","- 1 tbsp (~12g) brown sugar","- 2 tbsp (30g) rice wine vinegar (Otafuku)","**To serve:**","- 1 tbsp (~6g) spring onion (scallion), sliced","- 1 tsp (~3g) sesame seeds, whole dried (black & white)","- Bok choy or vegetables of choice, steamed","- Sliced fresh chilli, steamed rice"],"method":["Preheat the oven to 200°C (400°F).","Combine the red onion pickle ingredients; set aside.","Mix the marinade ingredients in a shallow dish until the sugar dissolves; add the salmon and coat.","Bake 12 min, add 2–3 tbsp water, then grill 3–5 min until caramelised.","Serve with steamed greens, rice and the pickled onion; garnish with sesame seeds, spring onion and chilli."],"notes":["Fully resolved: salmon, sesame oil, sugars and sesame seeds from USDA (`ingredients-common.md`); miso paste and tamari use generic USDA values (no label supplied). Replace those two with your label macros if they differ — they mainly affect protein/sodium.","Well within the 800 kcal/serving meal-fit ceiling."]},"dinner/ready-meals/bang-bang-chicken":{"id":"dinner/ready-meals/bang-bang-chicken","name":"Bang bang chicken","meal":"dinner","servings":4,"calories":514,"protein":47.3,"carbs":65.4,"fat":7.8,"isBase":false,"description":"Oven-baked chicken thighs glazed with a creamy bang bang sauce, served with rice and crunchy veg. Makes 4 portions. Source: simplehomeedit.com. **Mayonnaise in the sauce (250g) was swapped for the same weight of Greek yogurt** — and the sauce is brushed on and baked, so see the heat warning in Notes. > **All macros now real.** Sweet chilli sauce (Hacendado) and sriracha now have label values, so every ingredient is computed — no `?` placeholders remain. Because of the mayo→yogurt swap, the computed total still sits below the site's **754 kcal / 32g protein** — expected, not an error.","ingredients":["**Bang bang sauce:**","- 250g Greek yogurt light (Hacendado) *(was 250g whole-egg mayonnaise)*","- 60g sweet chilli sauce (Hacendado)","- 1 tbsp (~15g) sriracha (optional)","- 1 tbsp (21g) honey (BM)","- 1 tbsp (~15g) lime juice, fresh","**Chicken:**","- 600g chicken thigh, boneless & skinless (Hacendado)","- 1 tsp (~2.5g) sweet paprika","- 1 tsp (~2.5g) onion powder","- ¼ tsp black pepper, ground","- 1 tbsp (16g) tamari (generic/USDA), or soy sauce","- 1 tbsp (~12g) brown sugar","- 1 tbsp (14g) olive oil","- 1 (~15g) spring onion (scallion), sliced","**To serve:**","- Steamed rice (200g dry basmati (Hacendado), ~50g/serving)","- 75g red/purple cabbage, shredded","- 2 (~120g) carrots, grated or julienned","- 1 (~150g) cucumber, sliced","- 1 (~15g) spring onion (scallion), finely sliced"],"method":["Preheat the oven to 220°C (425°F); line a tray.","Combine the sauce ingredients (Greek yogurt in place of the mayo); reserve a quarter separately for serving.","Pound the chicken even and halve each piece.","Coat the chicken with the paprika, onion powder, pepper, tamari, brown sugar and oil.","Arrange on the tray; brush the (non-reserved) bang bang sauce over the tops.","Bake 25–30 min until golden and cooked through.","Serve with rice, cabbage, carrot and cucumber; drizzle the reserved sauce and scatter spring onion."],"notes":["The sauce mayo was swapped for an equal weight of Greek yogurt light (Hacendado). **Greek yogurt can split under high heat — brush the chicken with sauce, but stir the reserved serving sauce in off the heat, and watch the bake.**","Computed total (514 kcal) is lower than the site's 754 kcal because of the mayo→yogurt swap. Sweet chilli sauce (Hacendado) and sriracha are now real, so no `?` placeholders remain.","\"Steamed rice\" assumed as 200g dry basmati (Hacendado) for the batch (~50g/serving). At 514 kcal/serving it is well under the 800 kcal meal-fit ceiling."]},"dinner/ready-meals/beef-broccoli":{"id":"dinner/ready-meals/beef-broccoli","name":"Beef & broccoli","meal":"dinner","servings":1,"calories":424,"protein":51,"carbs":25,"fat":13,"isBase":false,"description":"Beef & broccoli not only looks great but also has so many different flavours that will all work together like a charm. Single portion. 20 min. From The Felu Cookbook (p. 88).","ingredients":["- 200 g lean cut beef (sirloin)","- 200 g broccoli","- 2 cloves of garlic (≈6 g)","- 1 piece of fresh ginger (thumb size) (≈10 g)","- 2 g cornstarch","- 2 g oil","**Sauce:**","- 20 g soy sauce","- 10 g oyster sauce","- 10 g rice vinegar","- 5 g hoisin","- 1 g chili flakes"],"method":["Start with the washing and marinating first if you choose to do it (go to the chapter “Washing and Marinating Meat to Tenderize”). Otherwise, just cut the meat into strips.","Chop up the broccoli florets and cut them into equal bitesize pieces.","Peel and grate garlic and ginger.","Add all sauce ingredients to a glass and mix until combined.","Prepare a small glass with 50g water, add 2g of cornstarch, and mix, so there are no clumps.","Add broccoli to a pan (24cm/9,5inch) and cover with cold water until submerged. Cook the broccoli florets on a stove on medium-high for 2-3 minutes to get them soft.","Rinse the broccoli and wipe the pan with a paper towel and add in the beef. If you don’t marinate the beef, you need to add a bit of oil to the pan.","Fry the beef for 1 minute on each side so it gets color.","Remove the beef, add oil to the pan and fry the broccoli for 1-2 min, so they have a crunchy exterior with a soft interior.","Add back the beef and the grated garlic and ginger. Fry them for 20 seconds.","Add soy sauce and half of the cornstarch slurry and let it simmer until thick, around 1 minute. Add more slurry if the sauce is too thin. Done!"],"notes":["The recipe is great in itself but even better on rice. 50g will add 175 calories.","Macros recomputed from our per-100g ingredient tables: 424 kcal for the portion vs the book's 385 kcal (whole recipe)."]},"dinner/ready-meals/beef-casserole":{"id":"dinner/ready-meals/beef-casserole","name":"Beef casserole","meal":"dinner","servings":4,"calories":447,"protein":30.7,"carbs":35.6,"fat":17.1,"isBase":false,"description":"Slow-braised beef chuck with red wine, carrots and baby potatoes. Makes 4 portions. **Scaled from the site's 6 servings to 4** (×0.667 on every quantity). Source: simplehomeedit.com. Macros include the beef stock.","ingredients":["- 533g beef chuck / braising steak, lean, cut into bite-sized pieces","- 1⅓ tsp sea salt flakes","- ⅔ tsp (~1.4g) black pepper, ground","- 1⅓ tbsp (~18.7g) olive oil","- 1⅓ (~147g) brown onion (yellow), finely diced","- ⅔ tbsp (~6g) garlic, raw, roughly chopped","- ⅔ tbsp (~10.7g) tomato paste","- 23g plain (all-purpose) flour","- 167ml (~167g) dry red wine","- 667ml water","- 1⅓ tsp beef stock powder / bouillon (~37 g product for the 667 ml liquid)","- 2–3 sprigs (~2.7g) thyme, fresh (or ⅔ tsp dried)","- ⅔ bay leaf, dried","- ⅔ tsp (~2.8g) sugar","- 2⅔ large (~400g) carrots, peeled and sliced","- 333g baby potatoes (white), halved"],"method":["Season the beef; brown in batches in the hot oil.","Sauté the onion and garlic; add the tomato paste.","Return the beef; stir in the flour, then the red wine.","Add the water, stock, thyme, bay leaf and sugar.","Cover and cook 2 h on low heat.","Add the carrots and potatoes; cook 1 h more."],"notes":["All quantities scaled ×0.667 from the site's 6 servings to land at 4.","Macros include the beef stock powder / bouillon (Knorr-style, ~37 g product for 667 ml prepared). Bay leaf contributes negligibly.","Computed 447 kcal/serving for the stew alone (vs site 459).","Meal-fit: 447 kcal/serving is well under the 700 ceiling, so the recipe is kept.","<\/content>"]},"dinner/ready-meals/beef-rissoles":{"id":"dinner/ready-meals/beef-rissoles","name":"Beef rissoles","meal":"dinner","servings":4,"calories":510,"protein":25.8,"carbs":15.1,"fat":38,"isBase":false,"description":"Pan-fried beef rissoles (4 servings). Serve with mash and steamed greens. Imported from simplehomeedit.com.","ingredients":["- 500 g minced (ground) beef, 85% lean (USDA generic)","- 1 onion (~110 g), grated (Brown onion, USDA generic)","- 1 tsp minced garlic (~3 g) (Garlic, raw, USDA generic)","- 1 egg (~60 g) (XL eggs, Hacendado)","- 60 g panko breadcrumbs (USDA generic)","- 1 tbsp ketchup (~17 g) (Tomato ketchup, USDA generic)","- ½ tsp freshly cracked black pepper (Black pepper, ground, USDA generic)","- 1 tsp sea salt flakes (Salt, USDA generic)","- 3 tbsp olive oil (~42 g), for frying (Olive oil, USDA generic)","- 1 tbsp finely chopped flat-leaf parsley (~4 g) (Parsley, fresh, USDA generic)"],"method":["Combine minced beef, grated onion, minced garlic, egg, panko, ketchup, pepper and salt in a large bowl. Roll into golf-ball portions and flatten with your palm into rissoles.","Heat olive oil in a heavy-based frying pan over medium–low heat. Cook the rissoles 8–10 minutes until browned, turning once. Cook in batches to avoid crowding.","Optional gravy: turn off the heat, drain excess oil, add 2–3 tablespoons water and scrape up the pan drippings.","Drizzle the pan juices over the rissoles and serve with mashed potato, steamed greens and chopped parsley."],"notes":["Mashed potato and steamed greens are unquantified \"to serve\" sides and are not included in the per-serving macros — add them per portion.","Computed 510 kcal/serving (vs the site's 542) — close; the difference is the excluded sides and the leaner beef cut. No pending placeholders remain. Under the 700 kcal/serving meal-fit ceiling."]},"dinner/ready-meals/bibimbap":{"id":"dinner/ready-meals/bibimbap","name":"Bibimbap","meal":"dinner","servings":1,"calories":573,"protein":54,"carbs":71,"fat":9,"isBase":false,"description":"A classic Korean lunch that is delicious and also highly versatile. Single portion. 20 min. From The Felu Cookbook (p. 87).","ingredients":["- 1 chicken breast (180 g)","- 150 g pak choi","- ½ red bell pepper (75 g)","- 1 carrot (100 g)","- 1 medium onion (50 g)","- 50 g raw rice","- 6 g oil","**Sauce:**","- 15 g gochujang","- 15 g soy sauce","- 10 g rice vinegar"],"method":["Start by adding rice and 125g of water to a pot with a pinch of salt.","Put the stove on high heat, and as soon as the water starts to boil, turn the heat down to low, close the lid and let it simmer for 12-15 min.","In the meantime, chop up all the vegetables into equal bite-sized pieces.","Cut chicken breast into strips.","Add all sauce ingredients to a glass and mix until combined, this should take 20 seconds.","Put a pan (28cm or 11 inch) on the stove on medium heat and add in 6g of oil. Add in all the vegetables, salt and pepper and fry them for 7-8 min until caramelized.","Push the veggies to the side to make space for the chicken. Add in 2g of oil and fry the chicken on both sides for 60-90 seconds until done.","Add rice as a layer in a bowl. The chicken goes into the middle on top of the rice and the vegetables around the chicken. Drizzle the sauce on everything. Done!"],"notes":["Vegetables can be swapped out for anything you like. Pickled veggies are amazing in combination with the sauce.","If you have a smaller pan, first fry the chicken, remove it and fry the veggies and at the end, add in the chicken just to reheat it.","Macros recomputed from our per-100g ingredient tables: 573 kcal for the portion vs the book's 544 kcal (whole recipe)."]},"dinner/ready-meals/buffalo-mac-n-cheese":{"id":"dinner/ready-meals/buffalo-mac-n-cheese","name":"Buffalo mac n cheese","meal":"dinner","servings":1,"calories":612,"protein":61,"carbs":56,"fat":17,"isBase":false,"description":"Another mac n cheese recipe but this time buffalo style. Single portion. 15 min. From The Felu Cookbook (p. 80).","ingredients":["- 60 g dry pasta","- 1 chicken breast (180 g)","- 1 g garlic powder","- 1 g onion powder","- 1 g cayenne pepper","- 1 g smoked paprika","- 4 g oil","- 1 serving 3 ingredient cheese sauce (Felu Cookbook p. 295 — not imported)","- Salt and black pepper"],"method":["Add pasta to a pot filled with water and a small pinch of salt. Place the pot on the stove, set to high heat. As soon as it starts to boil, reduce the heat to medium-high and let it simmer until the pasta is al dente, typically about 12 minutes.","While the pasta is cooking, cut the chicken into thin strips and place them in a bowl. Add oil, onion powder, garlic powder, cayenne pepper, smoked paprika, black pepper and mix the chicken evenly.","Mix the 3 ingredints cheese sauce in a small bowl.","Put a pan (24cm/9,5inch) on the stove on medium-high heat and fry the chicken for 60-90 seconds on each side just until they turn brown in color.","Turn off the heat. Add the previously prepared cheese sauce to the chicken in the pan, mixing it in for about 30 seconds until you achieve a creamy consistency.","Once the pasta is cooked, reserve some of the pasta water and then drain the rest. Add the drained pasta to the pan with chicken and sauce, combining everything thoroughly. If the sauce appears too thick, add a little evaporated milk or some of the reserved pasta water to adjust."],"notes":["You can add onions and red bell peppers to increase the volume. Fry them in the pan for 3-5 minutes before adding the chicken.","Macros recomputed from our per-100g ingredient tables: 612 kcal for the portion vs the book's 619 kcal (whole recipe)."]},"dinner/ready-meals/butter-chicken":{"id":"dinner/ready-meals/butter-chicken","name":"Butter chicken","meal":"dinner","servings":1,"calories":598,"protein":71,"carbs":52,"fat":17,"isBase":false,"description":"Butter chicken is the ultimate recipe when you don’t want to eat dry and dull chicken. Single portion. 25 min. From The Felu Cookbook (p. 174).","ingredients":["- 200 g skinless, boneless chicken thighs","- 1 medium onion (50 g)","- 2 cloves of garlic (≈6 g)","- 200 g crushed tomatoes","- 100 g 3 % fat evaporated milk","- 1 laughing cow wedge (≈17 g)","- 50 g skyr or 0.2 % fat greek yogurt","- 4 g garam masala","- 2 g garlic powder","- 2 g paprika","- 2 g turmeric","- 21 g cayenne pepper","- 4 g oil","- Salt and black pepper"],"method":["Cut chicken into bite-size pieces. Place chicken into a bowl. Add Greek yogurt, 2g garam Masala and a strong pinch of salt. Mix everything with a spoon until the chicken is coated.","Dice onions, peel and grate garlic.","Add 2g of oil to a pan (24cm/9,5inch) on high heat. Wait until the pan is hot, then add chicken and fry one side for 1 minute. Flip the chicken and fry the other side for another minute until both sides have color. Remove the chicken from the pan.","Add 2g of oil to the pan, switch heat to medium, add the onions and fry them for 3 minutes under occasional stirring until brown.","Add 2g garam Masala, garlic powder, paprika, turmeric, cayenne pepper and black pepper. Mix everything and keep toasting them for 30 seconds.","Make some space in the pan and add the grated garlic. Fry the garlic for 20 seconds until fragrant.","Add crushed tomatoes with a splash of water and mix everyt - hing. Let this simmer for 5-6 minutes.","Now add evaporated milk and Laughing Cow cheese. Mix it by pressing the laughing cow down, so everything gets incorporated. Add the chicken back to the pan and let everything simmer for 5-7 minutes until the chicken is cooked through. Done!"],"notes":["50 g of raw jasmine rice will add another 175 calories.","Chicken thighs are hard to overcook, so don’t worry if you let it simmer a bit longer to be safe.","You can marinate the chicken after seasoning for 1-4 hours in the fridge.","Macros recomputed from our per-100g ingredient tables: 598 kcal for the portion vs the book's 583 kcal (whole recipe)."]},"dinner/ready-meals/cajun-chicken-lemon-rice":{"id":"dinner/ready-meals/cajun-chicken-lemon-rice","name":"Cajun chicken & lemon rice","meal":"dinner","servings":1,"calories":605,"protein":58,"carbs":70,"fat":12,"isBase":false,"description":"Cajun spice mix is amazing especially in combination with creamy chicken. Single portion. 20 min. From The Felu Cookbook (p. 81).","ingredients":["- 1 chicken breast (180 g)","- 50 g raw rice","- 125 g water","- 1 lemongrass stem (optional) (≈15 g)","- 1 medium onion (50 g)","- 1 red bell pepper (150 g)","- 100 g evaporated milk","- 1 laughing cow wedge (≈17 g)","- 4 g cajun seasoning","- 4 g oil","- Salt and black pepper"],"method":["Cut the lemongrass stem into 3-4 pieces. Smash with the flat part of your knife, so it cracks a bit.","Add the lemongrass, rice, and 125 g water to a pot (18cm or 7inch diameter) with a pinch salt.","Put on the stove on a high heat. Wait until the water starts to boil, before turning down the heat to low. Close the lid and let it simmer for 12-15 mins.","While the rice is cooking, chop up the onion and pepper into equal bite-sized pieces.","Cut the chicken into strips. Add 2 g of oil on the chicken and spread the Cajun seasoning on top. Mix with your hands so that the seasoning coats the entire chicken.","Put a pan (24cm/9,5inch) on the stove on medium-high heat and fry the chicken for 60-90 seconds on each side just until they turn brown in color.","Remove the chicken from the pan, add 2 g of oil to the pan, turn the heat down to medium and fry the onion and pepper for 4-5 minutes until caramelized.","Add the chicken back to the pan along with the milk and laughing low cheese. Mix everything with a spatula, smashing the cheese wedge, so it gets incorporated into the sauce. Simmer for 1 more minute.","Add rice into a bowl and add the cajun chicken on top. Done!"],"notes":["Macros recomputed from our per-100g ingredient tables: 605 kcal for the portion vs the book's 575 kcal (whole recipe)."]},"dinner/ready-meals/caprese-chicken":{"id":"dinner/ready-meals/caprese-chicken","name":"Caprese chicken","meal":"dinner","servings":1,"calories":396,"protein":57,"carbs":16,"fat":13,"isBase":false,"description":"The Italian way to eat chicken breast is to add cheese, tomatoes and basil. Single portion. 20 min. From The Felu Cookbook (p. 158).","ingredients":["- 1 chicken breast (180 g)","- 1 medium onion (50 g)","- 1 clove of garlic (≈3 g)","- 200 g tomatoes","- 60 g fresh light mozzarella","- 100 g water","- 4 g oil","- 5 g fresh basil","- 0.5 g oregano","- Salt and black pepper"],"method":["Flatten the chicken breast evenly with something heavy and optional dry brine it as described in the chapter “How to cook chicken breast”.","Dice the onion. Peel and grate garlic. Chop up tomatoes. Cut mozzarella into strips.","Heat up a pan (24cm/9,5inch) to medium-high heat and add in 2g of oil. Add in the chicken breast. Fry it for 2-3 minutes on each side until almost cooked through.","Remove the chicken. Add another touch of oil, switch the heat to medium and add in the onion. Fry them for 3 minutes until they start to caramelize.","Add in the garlic. Keep frying for 20 seconds.","Add in water and tomatoes. Season with salt, pepper and oregano. Mix everything, close the lid and let it simmer for 5-6 minutes until the tomatoes release their juices, and the sauce thickens up.","Add the chicken back, top the chicken with Mozzarella cheese, and close the lid again. Keep it simmering for 30-45 seconds until Mozzarella is melted and the chicken is heated up again. Top with fresh basil. Done!"],"notes":["This taste amazing with rice or potatoes.","It can also be made with shredded Mozzarella instead fresh.","Macros recomputed from our per-100g ingredient tables: 396 kcal for the portion vs the book's 378 kcal (whole recipe)."]},"dinner/ready-meals/cheese-grits-polenta":{"id":"dinner/ready-meals/cheese-grits-polenta","name":"Cheese grits / polenta","meal":"dinner","servings":1,"calories":568,"protein":55,"carbs":60,"fat":12,"isBase":false,"description":"Are you feeling tired of oats and rice? Then try these cheese grits for your next high protein meal. Single portion. 20 min. From The Felu Cookbook (p. 150).","ingredients":["- 50 g cornmeal","- 180 g skinless, boneless chicken thighs","- 1 medium onion (50 g)","- 1 carrot (100 g)","- 1 laughing Cow wedge (≈17 g)","- 1 slice american cheese (≈19 g)","- 4 g vegetable broth powder","- 250 g water","- 1 g cayenne pepper","- 2 g smoked paprika","- 2 g oil","- Salt and black pepper"],"method":["Add cornmeal with water and broth powder into a pot and place it on a stove on high heat. As soon it starts to boil, reduce the heat to low, close the lid and let it simmer for 15 minutes.","Dice onion and carrot.","Cut chicken thigh into bite-size cubes, add oil on top and add a pinch of salt, black pepper, cayenne pepper and smoked paprika. Mix everything with your hands until the entire chicken turns red.","Heat a pan (24cm/9,5inch) to medium, add in oil and then onion and carrot. Fry this for 3-5 minutes under occasional stirring.","Switch up the heat to medium-high and add in chicken thighs. Spread it with a spatula, so as much meat as possible comes in contact with the pan. Let it fry for 90 seconds and then flip it and fry again for 2 more minutes until the chicken is done.","As soon as the grits are done, add in the laughing low wedge. Cut the cmerican cheese slice into smaller pieces and add it in as well.","Stir the grits until the cheese is melted and the grits are creamy.","Add the grits to a plate, top it with the chicken and optional parsley. Done!"],"notes":["Don’t worry about overcooking chicken thighs. It’s very difficult to overcook thighs and get them tough.","Macros recomputed from our per-100g ingredient tables: 568 kcal for the portion vs the book's 601 kcal (whole recipe)."]},"dinner/ready-meals/cheesy-chicken-broccolini-rice":{"id":"dinner/ready-meals/cheesy-chicken-broccolini-rice","name":"Cheesy chicken and broccolini rice","meal":"dinner","servings":4,"calories":581,"protein":39,"carbs":49,"fat":28,"isBase":false,"description":"One-pan creamy chicken-thigh risotto-style rice with broccolini and melted cheddar/parmesan. Scaled from the site's 6 servings to 4 (per-serving macros unchanged). Imported from simplehomeedit.com.","ingredients":["- ⅔ tbsp (~9g) olive oil","- ⅔ onion (~73g), finely diced","- ⅔ tsp (~2g) freshly minced garlic","- 333g boneless, skinless chicken thighs (Hacendado), bite-sized","- ⅓ tsp salt, ⅓ tsp black pepper","- ⅔ tsp sweet paprika","- ⅔ tsp onion powder","- ⅔ tsp dried oregano","- 220g arborio (risotto) rice","- 667ml chicken stock (Knorr)","- ~83ml (~86g) cream (Nata para cocinar, Hacendado) — optional","- ⅔ bunch broccolini (~117g), bite-sized","- 167g grated cheddar","- 33g grated parmesan (Grana Padano)","- ⅔ tbsp chopped parsley, to garnish"],"method":["Heat olive oil in a large pan over medium–high heat. Add onion and garlic; cook 1–2 min until fragrant.","Add chicken, salt and pepper; cook 3–5 min until golden.","Stir in paprika, onion powder and oregano, then the rice, chicken stock and cream. **Stir the cream in gently and keep the simmer gentle — light cream can split if boiled hard.**","Bring to a simmer, cover and cook on low 15 min, stirring halfway.","Scatter broccolini over; stir gently, cover and cook 5 min.","Off the heat, stir through cheddar and parmesan; cover 2 min to melt.","Sprinkle parsley and extra parmesan; serve."],"notes":["Native recipe is 6 servings; quantities scaled to 4. Per-serving macros are batch ÷ servings, unchanged by scaling.","All ingredients are real (chicken stock uses the existing Knorr row) — no pending placeholders. Under the 700 ceiling.","Conversions: oil 14g/tbsp, chicken stock per the Knorr row, cream 83ml ≈ 86g, broccolini ~175g/bunch (native)."]},"dinner/ready-meals/chicken-adobo-felu":{"id":"dinner/ready-meals/chicken-adobo-felu","name":"Chicken adobo (Felu)","meal":"dinner","servings":1,"calories":469,"protein":61,"carbs":40,"fat":10,"isBase":false,"description":"Chicken, rice and broccoli but it tastes good. Single portion. 35 min. From The Felu Cookbook (p. 175).","ingredients":["- 200 g skinless, boneless chicken thighs","- 1 medium onion (50 g)","- 5 cloves of garlic (≈15 g)","- ½ broccoli (200 g)","- 4 g ginger paste","- 1 chili (≈20 g)","- 5 bay leaves dry (≈1 g)","- 30 g soy sauce","- 30 g rice vinegar","- 30 g water","- 10 g honey","- 5 g oil","- Black pepper"],"method":["Chop the onion, chili, and peel and grate the garlic. Cut the broccoli florets into bite-size pieces.","In a glass, mix vinegar, soy sauce, water, and honey.","In a pan over medium heat, add oil and fry the onion for 3 minutes, stirring occasionally.","Push the onions to the side of the pan, add more oil, and add the chicken thighs. Fry both sides for 1-2 minutes to get some color. Add black pepper.","As soon as the chicken has color, add all other ingredients, mix everything, and close the lid. Reduce heat to low and let it simmer for 15 minutes.","After 15 minutes, flip the chicken and give the vegetables a stir. Close the lid again and let it simmer for 10 more minutes.","After 25 minutes, check the sauce for seasoning and thickness. If it‘s too thin, add a starch slurry. Done!"],"notes":["50 g of raw jasmine rice will add another 175 calories.","Chicken thighs are hard to overcook, so don’t worry if you let it simmer a bit longer to be safe.","This dish can also be made with black pepper corns instead of cracked pepper.","Macros recomputed from our per-100g ingredient tables: 469 kcal for the portion vs the book's 480 kcal (whole recipe)."]},"dinner/ready-meals/chicken-adobo":{"id":"dinner/ready-meals/chicken-adobo","name":"Chicken adobo","meal":"dinner","servings":4,"calories":585,"protein":44,"carbs":54,"fat":20,"isBase":false,"description":"Filipino-style soy-vinegar braised chicken thighs with sesame-ginger cucumbers and steamed rice. Makes 4.","ingredients":["- 600g boneless, skinless chicken thighs (Hacendado), bite-sized","- 1 tbsp (9g) minced garlic","- 80ml (80g) soy sauce (Kikkoman)","- 80ml (80g) white vinegar (or apple cider vinegar)","- 2 bay leaves (dried)","- 1 tbsp (12g) brown sugar","- ½ tsp black pepper, ground","- 2 tbsp (28g) olive oil (for the chicken)","- 4 cups (~630g) cooked jasmine rice, to serve","**Sesame-ginger cucumbers:**","- 2 Lebanese cucumbers (~340g), thickly sliced","- 2 tbsp (28g) olive oil","- 1 tbsp (14g) sesame oil","- 1 tsp (3g) minced ginger","- ½ tsp
