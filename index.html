fajitas":{"id":"dinner/ready-meals/chicken-fajitas","name":"Chicken fajitas","meal":"dinner","servings":1,"calories":745,"protein":60,"carbs":77,"fat":24,"isBase":false,"description":"I make this recipe 2-3 per week. It‘s the perfect weeknight meal. Single portion. 20 min. From The Felu Cookbook (p. 178).","ingredients":["- 1 chicken breast (180 g)","- 2 bell peppers (200 g)","- 1 medium onion (50 g)","- 1 cloves of garlic (≈3 g)","- ½ lime (≈15 g)","- 1 serving avocado cream cheese dip (Felu Cookbook p. 300 — not imported)","- 2 wheat tortillas (20cm or 8inch) (≈90 g)","- 1 g paprika","- 1 g cumin","- 1 g chili powder","- 0.51 g oregano","- 5 g oil","- Bunch cilantro","- Salt and black pepper"],"method":["Cut the chicken into bite-size pieces. Place the chicken in a bowl and drizzle a little oil on top.","In a small bowl, mix together paprika, cumin, chili powder, oregano, a pinch of salt, and black pepper.","Sprinkle the seasoning mixture over the chicken and use your hands to mix until all the pieces are coated. Set aside.","Chop up the peppers and the onion into bite-size pieces. Peel and grate the garlic.","Prepare either the avocado dip or the taco sauce.","Add oil to a pan on medium heat. Start with adding the peppers and the onion, add a pinch of salt and fry them for 5 minutes.","After the vegetables are brown, push the to the side of the pan, another bit of oil and add in the chicken.","Fry the chicken for 1 minute on one side and then mix everyt - hing so the seasoning spreads evenly.","Keep frying for another minute until the chicken is cooked through and then add in the grated garlic. Fry the garlic for anot - her 20 seconds and then remove the pan from the heat.","Squeeze in the juice from half a lime and add a bunch of chopped cilantro. Mix everything.","Heat up 2 tortillas, you can also do this step while frying the chicken. Plate everything. Done!"],"notes":["The taco dip will save you 100 calories. You can also use lean beef and for the chicken and do the same steps.","Macros recomputed from our per-100g ingredient tables: 745 kcal for the portion vs the book's 723 kcal (whole recipe)."]},"dinner/ready-meals/chicken-korma":{"id":"dinner/ready-meals/chicken-korma","name":"Chicken korma","meal":"dinner","servings":1,"calories":586,"protein":69,"carbs":40,"fat":18,"isBase":false,"description":"Indian cuisine has so many healthy and unknown gemsto try. Chicken Korma in my opinion is certainly one of those delicious gems! Single portion. 20 min. From The Felu Cookbook (p. 72).","ingredients":["- 200 g skinless, boneless chicken thighs","- 300 g frozen veggie mix","- 2 cloves of garlic (≈6 g)","- 1 piece of fresh ginger (thumb size) (≈10 g)","- 1 medium onion (50 g)","- 2 g turmeric","- 1 g chili powder","- 2 g paprika","- 1 g cumin","- 150 g low fat coconut milk","- 100 g plain yogurt","- 2 g oil","- Salt and black pepper"],"method":["Cut the chicken thighs into strips, and dice the onion.","Peel and grate the garlic and ginger.","Mix the turmeric, chili, paprika, cumin, salt, and pepper in a small bowl.","Mix the yogurt and coconut milk in a glass.","Add oil to a pan on medium heat.","Add in the onion and fry them for 3 minutes until the onion caramelizes.","Add in the chicken and keep frying them on each side for around 1 minute or until brown.","Add the garlic and ginger and mix everything well. Keep frying for another 20 seconds.","Add the spices and combine everything. Add in the coconut yogurt mixturte and stir everything. Add salt and pepper to taste.","Close the lid and let it simmer for around 10 minutes until thick.","Turn the heat to high, and add the frozen veggies and cook them for 2 minutes. Done!"],"notes":["Taste great on 50g of rice. That will add 175 calories.","You can dice 250 g of potatoes into tiny pieces and add them in when you add the yogurt mixture and let them simmer until done.","Macros recomputed from our per-100g ingredient tables: 586 kcal for the portion vs the book's 590 kcal (whole recipe)."]},"dinner/ready-meals/chicken-meatball-parmigiana":{"id":"dinner/ready-meals/chicken-meatball-parmigiana","name":"Chicken meatball parmigiana","meal":"dinner","servings":4,"calories":674,"protein":48,"carbs":47,"fat":34,"isBase":false,"description":"Baked chicken meatballs in tomato sauce, topped with cheddar, mozzarella and crispy panko. Makes 4.","ingredients":["**Meatballs:**","- 500g minced (ground) chicken","- 1 tsp sea salt flakes","- ½ tsp black pepper, ground","- 2 tbsp (~8g) chopped flat-leaf parsley","- 1 tsp (3g) minced garlic","- 60g panko breadcrumbs","- 2 tbsp (30g) whole milk","- 50g grated parmesan (Grana Padano)","- 1 egg (Hacendado XL)","**Sauce:**","- 1 tbsp (14g) olive oil","- 1 onion (~150g), diced","- 1 tbsp (9g) minced garlic","- 3 tbsp (48g) tomato paste","- 1 tbsp (15g) red wine vinegar","- 800g canned diced tomatoes","- 2 tsp (8g) sugar","- 1 tsp sea salt flakes","- ½ tsp black pepper, ground","- 2 tsp dried oregano","**The bake:**","- 60g shredded cheddar","- 150g shredded mozzarella (Hacendado)","- 60g panko breadcrumbs","- Olive oil spray"],"method":["Mix the meatball ingredients and roll into balls. Brown in a pan, then set aside.","For the sauce, soften the onion and garlic in the oil; add tomato paste, vinegar, diced tomatoes, sugar, seasoning and oregano. Simmer 10 min.","Nestle the meatballs into the sauce in a baking dish. Top with cheddar, mozzarella and panko, spray with oil.","Bake at 200°C for 20 min until bubbling and golden. Serve with a green salad."],"notes":["Computed 674 vs site 681 — close; under the 700 ceiling."]},"dinner/ready-meals/chicken-parm":{"id":"dinner/ready-meals/chicken-parm","name":"Chicken parm","meal":"dinner","servings":1,"calories":381,"protein":59,"carbs":19,"fat":8,"isBase":false,"description":"One of the most delicious chicken meals that with the right technique can be turned in a low calorie high protein meal. Single portion. 20 min. From The Felu Cookbook (p. 97).","ingredients":["- 1 chicken breast (180 g)","- 10 g panko bread crumbs","- 5 g all purpose flour","- 30 g egg whites","- 50 g storebought tomato sauce","- 50 g fresh mozzarella light","- 2 g onion powder","- 2 g garlic powder","- Salt and black pepper"],"method":["Start with dry brining the chicken breast if you choose to (see chapter on Brining chicken)","For 1 serving, I use only 1 plate. Put it on a scale.","Add flour to the plate and then the chicken. Cover the entire chicken.","Add egg whites to the plate. Coat the chicken with it. Last is to add panko to the same plate and again cover the chicken.","Add the coated chicken breast on top of parchment paper on a baking sheet and bake it in the oven for 12-15 minutes, depending on the thickness the chicken breast. Use a thermometer to be safe (72°C or 160°F should be aimed for). Alternatively use the air fryer.","In the meantime, cut the mozzarella into small pieces and prepare the sauce. I don’t bother making my own for one serving because you will need only 50g of sauce.","Remove the chicken from the oven. Spread sauce on top the chicken, so the surface is fully covered (only the top side of the chicken). Add mozzarella on top and then bake it again under the broiler for 2-3 minutes until the cheese has melted."],"notes":["You can use shredded mozzarella if you can’t find the fresh, wet version. In that case, use 30 g only.","Macros recomputed from our per-100g ingredient tables: 381 kcal for the portion vs the book's 377 kcal (whole recipe)."]},"dinner/ready-meals/chicken-potato-stir-fry":{"id":"dinner/ready-meals/chicken-potato-stir-fry","name":"Chicken & potato stir-fry","meal":"dinner","servings":1,"calories":616,"protein":60,"carbs":66,"fat":13,"isBase":false,"description":"One of my go-to meals when I want a quick lunch. It’s delicious and super simple to make. Single portion. 20 min. From The Felu Cookbook (p. 142).","ingredients":["- 1 chicken breast (180 g)","- 1 egg (≈55 g)","- 1 medium onion (50 g)","- 250 g mealy potatoes","- 250 g frozen wok vegetables","- 4 g oil","- Salt and black pepper"],"method":["Dice onion. Cut chicken into strips.","Clean the potatoes, I don’t peel them, but you can if you don’t like the skin. Cut the potatoes into french fries and then again into bite-size cubes. 2x2 cm or 1x1 inch.","If you have a microwave place the potatoes in a container and microwave for 5 minutes.","Place a pan (24cm/9,5inch) on a stove on medium-high. Add oil and fry the chicken on one side for 60 seconds. Add a pinch of salt and black pepper.","Flip the chicken and fry the other side for 60 seconds. Don’t cook the chicken through; just look for color.","Remove the chicken, add again 2 g oil into the pan and add the potatoes. If you microwaved them, fry them for 5-6 minutes until golden brown. If you add them raw, switch the heat to medium and close the lid and fry them for 12-15 minutes under occasional stirring.","When the potatoes are almost ready, add in the onion and keep frying for 2-3 minutes.","Add frozen vegetables with a splash of water, switch the heat to high, close the lid and wait for 2 minutes until the vegetables are thawed. Add another pinch of salt and black pepper.","Remove the lid, keep frying until the water is evaporated and add in the chicken back for 30 seconds while mixing everything.","Add the egg, mix it and keep frying for 30 seconds until the egg is cooked. Done!"],"notes":["Switch up the vegetables or add seasoning like cajun to add other flavors.","Make a tzatziki while the potatoes are cooking to dip everything in. See recipe for guide.","Macros recomputed from our per-100g ingredient tables: 616 kcal for the portion vs the book's 634 kcal (whole recipe)."]},"dinner/ready-meals/chicken-stew":{"id":"dinner/ready-meals/chicken-stew","name":"Chicken stew","meal":"dinner","servings":1,"calories":583,"protein":57,"carbs":77,"fat":7,"isBase":false,"description":"Stew is a great meal for weight loss because it has endless combinations. Single portion. 30 min. From The Felu Cookbook (p. 176).","ingredients":["- 180 g skinless, boneless chicken thighs","- 250 g potatoes","- 1 medium onion (50 g)","- 1 red bell pepper (150 g)","- 100 g carrots","- 2 cloves of garlic (≈6 g)","- 100 g tomatoes","- 20 g soy sauce","- 300 g vegetables or chicken stock","- 2 g oil","- Black pepper"],"method":["Clean the potatoes under cold water and then cut them into bite-sized pieces. Chop up the onion, red bell pepper, tomatoes, garlic cloves, and carrots.","In a pan over medium heat, add oil and fry the chicken thighs on both sides for 2 minutes each.","Then add the onions, bell pepper, and carrots, continuing to fry for another 3 minutes.","Now add the tomatoes and chopped garlic along with black pepper, stirring for 20-30 seconds.","Add the potatoes, stock, and soy sauce, giving everything a good stir.","Bring the mixture to a boil, then close the lid and let it simmer for 15 minutes.","After that, remove the lid and allow it to simmer uncovered for another 10 minutes, or until the potatoes are cooked through. Done!"],"notes":["Chicken thighs are hard to overcook, so don’t worry if you let it simmer a bit longer to be safe.","This dish can also be made with chili flakes for additonal heat.","You can also add fresh herbs like rosemary when simmering.","Macros recomputed from our per-100g ingredient tables: 583 kcal for the portion vs the book's 634 kcal (whole recipe)."]},"dinner/ready-meals/chicken-teriyaki":{"id":"dinner/ready-meals/chicken-teriyaki","name":"Chicken teriyaki","meal":"dinner","servings":1,"calories":339,"protein":48,"carbs":24,"fat":6,"isBase":false,"description":"Teryiaki is one of the most well-known dishes in East Asia and is the perfect meal to add on a bed of rice. Single portion. 15 min. From The Felu Cookbook (p. 145).","ingredients":["- 1 chicken breast (180 g)","- 1 medium onion (50 g)","- 100 g kohlrabi","- 25 g soy sauce","- 10 g honey","- 10 g rice vinegar","- 2 g cornstarch","- 4 g oil"],"method":["Optional Step : Prepare the chicken as described in the chapter “washing and marinating meat to tenderize”.","If you don’t marinate, cut the chicken into bite-sized cubes and add salt on top of the chicken.","Chop up onion and Kohlrabi into roughly the same size.","Place a small glass on a scale. Add soy, honey, rice vinegar and cornstarch and mix until combined.","Add 2 g of oil to a pan (24cm/9,5inch) on medium heat. Start with frying onion and Kohlrabi for 5 minutes under occasional stirring.","Push the veggies to the edges of the pan, and switch the heat to medium high, before adding 2 g oil and the chicken breast. Fry the chicken for 2-3 minutes.","Add sauce and keep cooking until it’s sticky, around 30 seconds. Done!"],"notes":["You can swap out Kohlrabi for cabbage or carrots.","Make it with 50 g of rice. This will add 175 more calories and will taste great.","Macros recomputed from our per-100g ingredient tables: 339 kcal for the portion vs the book's 337 kcal (whole recipe)."]},"dinner/ready-meals/chicken-thai-basil-stir-fry":{"id":"dinner/ready-meals/chicken-thai-basil-stir-fry","name":"Chicken and Thai basil stir-fry with noodles","meal":"dinner","servings":4,"calories":478,"protein":27,"carbs":53,"fat":18,"isBase":false,"description":"Minced chicken stir-fried with broccolini, Thai basil and rice vermicelli in a tamari-sesame sauce. Makes 4.","ingredients":["**Sauce:**","- 1 tbsp (16g) tamari","- 1 tbsp (16g) soy sauce (Kikkoman, for dark soy)","- 1 tbsp (14g) sesame oil","- 1 tbsp (16g) fish sauce","- 1 tbsp (12g) brown sugar","- 80ml (80g) water","- 2 tbsp (16g) cornflour (Maizena)","- ½ tsp chicken stock powder (Knorr)","**Stir-fry:**","- 200g rice vermicelli noodles","- 1 tbsp (14g) olive oil","- 2 spring onions (~30g), sliced","- 1 tbsp (9g) garlic, grated","- 1 tbsp (9g) ginger, grated","- 500g minced (ground) chicken","- 1 bunch broccolini (~150g), cut into pieces","- 1 handful (~10g) Thai basil leaves","- 1 lime, in wedges"],"method":["Whisk all sauce ingredients in a bowl.","Soak/prepare the rice vermicelli per packet, drain.","Heat olive oil in a wok over high. Stir-fry spring onion, garlic and ginger 30 sec, then add the minced chicken and cook 5–6 min, breaking it up.","Add the broccolini; stir-fry 2 min. Pour in the sauce and cook until thickened.","Toss through the noodles and basil. Serve with lime wedges."],"notes":["Computed 478 vs site 504 — close."]},"dinner/ready-meals/chicken-tikka":{"id":"dinner/ready-meals/chicken-tikka","name":"Chicken tikka","meal":"dinner","servings":1,"calories":543,"protein":69,"carbs":57,"fat":9,"isBase":false,"description":"Chicken tikka is one the most popular dishes in India. This recipe has been tweaked slightly to reduce the calories without reducing flavor. Single portion. 20 min. From The Felu Cookbook (p. 137).","ingredients":["- 1 chicken breast (180 g)","- 400 g crushed tomatoes","- 100 g plain yogurt","- 100 g 3% fat evaporated milk","- 1 medium onion (50 g)","- 4 cloves of garlic (≈12 g)","- 1 piece of fresh ginger (thumb size) (≈10 g)","- 1 g coriander","- 1 g chili powder","- 2 g turmeric","- 2 g paprika","- ½ lemon (juice) (≈22.5 g)","- 2 g oil","- Salt and black pepper"],"method":["Peel and grate garlic and ginger.","Mix all spices in a small container.","Place a bowl on a scale. Add in yogurt and half of the spices. 2 grated cloves of garlic, and 1 piece of minced ginger.","Add a pinch of salt. Squeeze in the lemon juice and mix until combined.","Cut the chicken into 3-4 pieces and add it into the bowl and cover the chicken with the marinade. Cover the bowl and let it marinate in the fridge for 1-4 hours.","Chop up the onion.","Place a pan on the stove on medium-high heat and add in the chicken breast. Fry each side for around 1 minute.","Remove the chicken, add in oil and add in the onions. Fry them for 3-5 minutes and then add in the remaining garlic and ginger and keep frying for 30 seconds.","Add remaining spices, mix everything together including the crushed tomatoes. Stir it and let it simmer on medium heat for 10 minutes.","Add evaporated milk and mix until the color changes to a warm orange.","Add in the chicken again and let it simmer until the chicken is cooked through. This should take about 3-4 more minutes. Done!"],"notes":["This tastes great with white fluffy rice.","Chicken breast can be swapped out for thighs.","Macros recomputed from our per-100g ingredient tables: 543 kcal for the portion vs the book's 501 kcal (whole recipe)."]},"dinner/ready-meals/chili-con-carne-meal-prep":{"id":"dinner/ready-meals/chili-con-carne-meal-prep","name":"Chili con carne (meal prep)","meal":"dinner","servings":5,"calories":562,"protein":55,"carbs":57,"fat":14,"isBase":false,"description":"Chili is one of the best comfort foods and is very easy to meal prep. Makes 5. 75 min. From The Felu Cookbook (p. 278).","ingredients":["- 5 SERVINGS:","- 900 g ground beef 95/5","- 400 g kidney beans","- 400 g potatoes","- 800 g crushed tomatoes","- 3 bell peppers (450 g)","- 2 medium onions (100 g)","- 3 jalapenos (150 g)","- 4 cloves of garlic (≈12 g)","- 250 g water","- 18 g dry gelatine","- 20 g vegetable broth powder","- 15 g cocoa powder","- 6 g cumin","- 6 g chili","- 6 g paprika","- 10 g oil","- Salt and black pepper"],"method":["Chop peppers, onions, and jalapenos into small pieces. Peel and grate garlic. Clean and cut potato - es into bite-size cubes.","In a glass of water, combine stock powder and dry gelatine. Mix until well combined and set aside.","Heat oil in a large pan over medium-high heat. Add ground beef and cook in batches until browned. Transfer the browned beef to a large pot and repeat with the remaining beef.","After all the beef is cooked and removed, add more oil to the pan and sauté the vegetables for 5-7 minutes until they have some color.","Add minced garlic, chili powder, paprika, cumin, a strong pinch of salt, and black pepper to the pan. Toast the spices for 20 seconds, then pour in the vegetable stock. De utes.","Remove the lid and if the chili is not thick enough, let it simmer for another 5 minutes, so more liquid is evaporated. Done!"],"notes":["Chili is amazing for meal prepping. It lasts for 3-4 days. Adjust the recipe to make more servings by multiplying by 2.","Chili can become a gel when cooled down because of the gelatin. It will dissolve immediately as soon as it gets reheated, so don‘t worry.","Macros recomputed from our per-100g ingredient tables: 813 kcal for the portion vs the book's 739 kcal (whole recipe)."]},"dinner/ready-meals/chilli-beef-fried-rice":{"id":"dinner/ready-meals/chilli-beef-fried-rice","name":"Chilli beef fried rice","meal":"dinner","servings":1,"calories":716,"protein":55,"carbs":87,"fat":15,"isBase":false,"description":"Spicy, savory and with a ton of protein! Single portion. 25 min. From The Felu Cookbook (p. 65).","ingredients":["- 180 g ground beef 95/5","- 60 g raw rice","- 1 red bell pepper (150 g)","- 1 medium onion (50 g)","- 100 g peas frozen","- 2 clove of garlic (≈6 g)","- 1 piece of fresh ginger (thumb size) (≈10 g)","- 25 g pickled jalapenos","- 25 g soy sauce","- 10 g hoisin","- 1 g chili powder","- 1 g paprika","- 4 g oil","- Black pepper"],"method":["Rinse the rice under cold water to remove excess starch. Add rice with 125g of water and a pinch of salt into a pot.","Put the pot on a stove on high heat. As soon the water starts to boil, reduce the heat to low, close the lid and let it simmer for 12-15 minutes.","Chop the jalapeños, bell pepper, and onion. Peel and grate the garlic and ginger. In a glass, mix together soy sauce and hoisin sauce.","Add 2g of oil to a pan over medium heat. Add the onion and bell pepper with a pinch of salt, frying the vegetables for 3 minutes while occasionally stirring.","Push the vegetables to one side of the pan, add a bit more oil, and then add the beef. Try to separate it with a spatula and let it fry for 1 minute.","Add chili powder, paprika, jalapeños, garlic, ginger, and peas. Sti  portion vs the book's 519 kcal (whole recipe)."]},"dinner/ready-meals/egg-white-pizza":{"id":"dinner/ready-meals/egg-white-pizza","name":"Egg white pizza","meal":"dinner","servings":1,"calories":436,"protein":44,"carbs":34,"fat":14,"isBase":false,"description":"The protein packed pizza that is made out of eggs. Single portion. 15 min. From The Felu Cookbook (p. 70).","ingredients":["- 70 g egg whites","- 70 g skyr","- 30 g flour","- 50 g shredded mozzarella","- 50 g deli meat","- 60 g storebought tomato sauce","- 1 g oregano","- 1 g garlic powder","- 1 g onion powder","- 2 g oil","- Salt and black pepper"],"method":["Place a bowl on a scale and add flour, garlic powder, onion powder, and salt. Mix them together.","Then, add skyr and egg whites to the bowl and mix until smooth.","Add oil to a pan (25cm/10 inches) on medium heat and pour in the batter. Immediately start tilting and shaking the pan until you achieve a round pizza shape.","Close the lid and let it cook for 3 minutes. Then, flip the pizza dough every minute until both sides have a nice brown color, for a total of 5 minutes.","Next, spread the tomato sauce on top, followed by the deli meat, and finally the cheese.","Put the pizza under the broiler for 1 minute until the cheese is fully melted. Done!"],"notes":["You can change up the toppings and use tuna with onions or a vegetabrian pizza for more volume!","Macros recomputed from our per-100g ingredient tables: 436 kcal for the portion vs the book's 445 kcal (whole recipe)."]},"dinner/ready-meals/enchiladas":{"id":"dinner/ready-meals/enchiladas","name":"Enchiladas","meal":"dinner","servings":3,"calories":827,"protein":75,"carbs":75,"fat":25,"isBase":false,"description":"A classic mexican dish that is super easy to meal prep and packed with protein. Makes 3. 60 min. From The Felu Cookbook (p. 279).","ingredients":["- 3-4 SERVINGS:","- 600 g skinless, boneless chicken thighs","- 6 wheat tortillas (25 cm or 10 inch) (≈372 g)","- 140 g shredded mozzarella","- 6 servings mint sauce (Felu Cookbook p. 291 — not imported)","- 1 medium onion (50 g)","- 2 cloves of garlic (≈6 g)","- 100 g tomato salsa","- 200 g water","- 5 g chicken stock powder","- 9 g smoked paprika","- 6 g garlic powder","- 4 g cayenne pepper","- 4 g cumin","- 1 g chili powder","- 6 g oil","- Salt and black pepper"],"method":["Preheat the oven to 200°C or 400°F.","Add chicken thighs to a large bowl and mix in 6g garlic powder, 6g smoked paprika, 3g cayenne pepper, 3g cumin, 4g salt, and black pepper until the thighs are well coated.","Transfer the seasoned chicken to a baking sheet, spread them out evenly, and spray a little oil at the bottom. Bake in the oven for 15 minutes.","Meanwhile, chop the onion and grate the garlic. In a glass of water, mix the chicken stock powder. Heat a little oil in a pan over medium heat and sauté the onions for 3 minutes. Then add a little more oil and minced garlic and continue frying for 20 seconds.","Add 1g chili powder, 1g cayenne pepper, 3g smoked paprika, and 1g cumin to the pan. Toast the spices for 30 seconds before adding the chicken stock, tomato salsa, a pinch of salt, and black pepper. Mix everything well and let it simmer over low heat for 10 minutes.","Make the mint sauce using the recipe in the corresponding chapter.","Once the chicken is cooked, remove it from the oven and cut it into bite-size pieces on a cutting board.","Place 6 tortillas on a board. Spread the chicken evenly over all 6 tortillas. Add 10-15g of mint sauce on top of each serving of chicken, then sprinkle 15g of cheese over each tortilla. Roll up all the tortillas.","Prepare a baking dish, add a layer of red sauce to the bottom, and place all 6 rolled tortillas in the dish. Add the rest of the sauce on top and sprinkle the remaining cheese.","Bake in the oven at 200°C or 400°F for 3-4 minutes until the cheese has melted. Distribute into 3-4 meal prep container."],"notes":["Macros recomputed from our per-100g ingredient tables: 2480 kcal for
