ntil you form a dough ball.","In a small bowl, add olive oil. Grate the garlic into the bowl, chop the parsley, and add it as well. Mix until combined.","Chop the deli meat into fine pieces.","Cut the dough ball into four equal pieces. Lay a large piece of parchment paper on your board, drizzle some oil on it, and spread the oil around with your hand. Place the dough balls on the parchment paper and press them flat to form small tortilla shapes.","Fill each tortilla with an equal amount of cheese and meat. Then fold one side of each tortilla over to create four small calzones.","Place the calzones in a pan over medium heat and cook on both sides with a closed lid for 2-3 minutes until they turn golden brown.","Now, spread the infused olive oil on top of all the calzones in the pan and continue frying for another 30 seconds. Done!"],"notes":["You can store the calzones in the freezer for up to 3 months.","Macros recomputed from our per-100g ingredient tables: 914 kcal for the batch vs the book's 900 kcal (whole recipe)."]},"lunch/ready-meals/chicken-burrito-bowls":{"id":"lunch/ready-meals/chicken-burrito-bowls","name":"Chicken burrito bowls","meal":"lunch","servings":4,"calories":666,"protein":37,"carbs":76,"fat":25,"isBase":false,"description":"Spiced chicken burrito bowls with rice, black beans, corn, pico de gallo, avocado and a chipotle-style Greek yogurt sauce. Makes 4. Mayo swapped for Greek yogurt.","ingredients":["**Chicken:**","- 400g boneless, skinless chicken breast (Hacendado), diced","- 3 tbsp (42g) olive oil","- 1 tsp (3g) minced garlic","- 1 tsp dried oregano","- 1 tsp (2g) ground cumin","- 1 tsp sweet paprika","- 1 tsp onion powder","- 1 tbsp (16g) tomato paste","- 1 tsp smoked paprika (in place of chipotle in adobo)","**Pico de gallo:**","- 2 tomatoes (~250g), diced","- 1 small onion (~80g), diced","- ⅓ bunch coriander (~10g)","- ½ tsp sea salt flakes","- 1 lime, juiced","**To serve:**","- 450g microwave rice (long-grain)","- 1 avocado (~150g), mashed","- 150g corn kernels","- 180g canned black beans, drained","- 100g corn chips","- 1 jalapeño, sliced (optional)","**Chipotle-style yogurt sauce:**","- 125g Greek yogurt light (Hacendado) — in place of mayo","- 1 tsp smoked paprika (in place of chipotle in adobo)","- ½ tsp sea salt flakes","- ¼ tsp black pepper, ground","- 1 tbsp lime juice"],"method":["Toss the chicken with the oil, garlic, spices and tomato paste; cook in a hot pan 6–8 min until golden.","Combine pico de gallo ingredients.","Stir the yogurt sauce ingredients together.","Build bowls: rice, chicken, beans, corn, pico, avocado and corn chips. Drizzle with the yogurt sauce and add jalapeño."],"notes":["Mayo swapped for Greek yogurt (cold use). Chipotle in adobo replaced with smoked paprika (already in `ingredients-common.md`).","Computed 666 vs site 1223 — site uses whole-egg mayo and more oil; this is under the 700 ceiling after the swap."]},"lunch/ready-meals/chicken-feta-salad":{"id":"lunch/ready-meals/chicken-feta-salad","name":"Chicken feta salad","meal":"lunch","servings":1,"calories":311,"protein":39.5,"carbs":10.5,"fat":13.7,"isBase":false,"description":"A quick assembled lunch: a portion of the baked chicken base over leaves with feta and a yogurt-mustard dressing. > Greens are estimated at 40g (you didn't specify an amount); adjust freely, it barely moves the total.","ingredients":["- 1 portion [baked chicken breast base](../base/baked-chicken-breast-base.md) (~125g raw)","- 40g baby spinach (or romaine)","- 50g cucumber","- 50g cherry tomatoes","- 30g feta (Hacendado), crumbled","- 30g Greek yogurt light (Hacendado)","- 1 tsp (~5g) Dijon mustard (Hacendado)"],"method":["Whisk the Greek yogurt and mustard together into a dressing; season to taste.","Dice the cucumber and halve the cherry tomatoes.","Toss the spinach, cucumber and tomatoes in a bowl.","Top with the sliced baked chicken and crumbled feta.","Drizzle over the yogurt-mustard dressing."],"notes":["39g protein for ~306 kcal — a lean, protein-dense lunch. Feta + chicken drive the fat (13.6g), of which 6g saturated.","Uses one portion of the [baked chicken base](../base/baked-chicken-breast-base.md); cook the batch of 4 and this comes together in minutes."]},"lunch/ready-meals/chicken-gyros":{"id":"lunch/ready-meals/chicken-gyros","name":"Chicken gyros","meal":"lunch","servings":4,"calories":660,"protein":70.7,"carbs":48,"fat":20.9,"isBase":false,"description":"Greek-style marinated chicken thigh gyros with tomato, red onion and olives in flatbread. Makes 4.","ingredients":["- 1kg boneless, skinless chicken thighs (Hacendado)","- 1 tsp sweet paprika","- 2 tsp dried oregano","- 1 tsp sea salt flakes","- ½ tsp black pepper, ground","- 1 tbsp (9g) minced garlic","- 1 lemon (~40g juice), juiced and zested","- 60ml (56g) olive oil","- 4 pita breads / flatbreads","- 4 tbsp tzatziki","- 2 tomatoes (~250g), sliced","- 1 red onion (~110g), finely sliced","- 1 tbsp chopped flat-leaf parsley","- 2 tbsp (~20g) sliced kalamata olives"],"method":["Marinate the chicken in paprika, oregano, salt, pepper, garlic, lemon and olive oil for 10 min (or overnight).","Grill or pan-cook the thighs 5 min each side until charred and cooked through. Rest, then slice.","Warm the flatbreads, spread with tzatziki, and fill with chicken, tomato, red onion, parsley and olives."],"notes":["Pita estimated at 70g each (4 × 70g = 280g); tzatziki 4 tbsp ≈ 60g.","Computed 660 kcal/serving including pita and tzatziki — in line with the site's 650."]},"lunch/ready-meals/chicken-poke-bowl":{"id":"lunch/ready-meals/chicken-poke-bowl","name":"Chicken poke bowl","meal":"lunch","servings":1,"calories":769,"protein":61,"carbs":99,"fat":17,"isBase":false,"description":"This dish is a combination of sweet and savory and tastes incredible. Single portion. 20 min. From The Felu Cookbook (p. 161).","ingredients":["- 1 chicken breast (180 g)","- 60 g raw rice","- 60 g avocado","- 100 g canned pineapple","- 50 g peas","- 100 g carrots","- 4 g garlic powder","- 4 g oil","- 1 serving pb & soy sauce (Felu Cookbook p. 297 — not imported)","- Salt and black pepper"],"method":["Add rice with water in a pot (18cm or 7inch dia meter) with a pinch of salt. Place it on a stove on high heat. As soon the water starts to boil, reduce the heat to low, close the lid and let it simmer for 12-15 minutes.","Preapre the pb & soy sauce.","Next, cut the chicken breast into bite-sized pieces and season them with salt, black pepper, and garlic powder. Similarly, dice the carrots, avocado, and pineapple into bite-sized pieces.","Preheat a pan (24cm or 9.5 inch) over mediumhigh heat and add oil to it. Begin by frying the chicken pieces on one side for about 1 minute. Then flip the chicken over and cook for an additional minute. Remove the chicken from the pan and set aside. If you‘re using frozen peas, fry them in the same pan for 1 minute.","To serve, add rice to a bowl. Top the rice with the prepared fruit, vegetables, and chicken. Finish off with a drizzle of the PB & soy sauce mixture."],"notes":["You can also use the spicy Greek yogurt for this recipe.","Try different kinds of fruits or vegetables to switch things up. Mangos or peaches work great here.","Macros recomputed from our per-100g ingredient tables: 769 kcal for the portion vs the book's 769 kcal (whole recipe)."]},"lunch/ready-meals/chicken-potato-bowl":{"id":"lunch/ready-meals/chicken-potato-bowl","name":"Chicken & potato bowl","meal":"lunch","servings":1,"calories":530,"protein":52,"carbs":60,"fat":10,"isBase":false,"description":"This chicken bowl has so many flavours and they all work perfectly. Single portion. 20 min. From The Felu Cookbook (p. 82).","ingredients":["- 1 chicken breast (180 g)","- 250 g potatoes","- 1 medium onion (50 g)","- 1 red bell pepper (150 g)","- 20 g mint sauce (Felu Cookbook p. 291 — not imported)","- 1 g cayenne pepper","- 1 g smoked paprika","- 6 g oil","- Salt and black pepper"],"method":["Peel and Cut the potatoes into thick slices, then into fries and then again into bite-size cubes. 2x2cm or 1x1 inch.","Microwave the potatoes in a bowl for 5 min at 600W.","Chop the onion and bell pepper. Cut the chicken into thin strips. Prepare the mint sauce and store it in a squeeze bottle.","Heat a 24cm (9.5 inch) pan over medium-high heat. Fry the microwaved potatoes in a bit of oil with a pinch of salt for 3-4 minutes, stirring occasionally.","Push the potatoes to one side of the pan, add a bit more oil, then add the vegetables with another pinch of salt. Continue frying everything for an additional 2-3 minutes.","Push everything to the side, add a bit more oil, and then add the chicken. Use a spatula to separate the chicken pieces for maximum browning.","Season with salt, black pepper, smoked paprika, and garlic powder. Let the chicken fry for one minute on one side before flipping and mixing everything in the pan. Allow the chicken to cook through for another minute, then remove the pan from the heat.","Transfer everything into a bowl. Add 20g of mint sauce on top and mix well. Enjoy your meal!"],"notes":["Macros recomputed from our per-100g ingredient tables: 530 kcal for the portion vs the book's 565 kcal (whole recipe)."]},"lunch/ready-meals/chicken-quesadilla":{"id":"lunch/ready-meals/chicken-quesadilla","name":"Chicken quesadilla","meal":"lunch","servings":1,"calories":390,"protein":36,"carbs":34,"fat":12,"isBase":false,"description":"Quesadillas all day every day, this time with chicken. Single portion. 20 min. From The Felu Cookbook (p. 134).","ingredients":["- 1 wheat tortilla (20cm or 8inch) (≈45 g)","- ½ chicken breast (100 g)","- 1 medium onion (50 g)","- ½ red bell pepper (75 g)","- 25 g shredded mozzarella","- 20 g peanut butter sauce (See recipe)","- 2 g oil","- Salt and black pepper"],"method":["Chop up all vegetables into small pieces.","Cut chicken into bite-size pieces.","Add oil into a pan (24cm/9,5inch) on medium-high heat and add in the onion and the pepper. Fry them for 3-4 minutes.","Add in the chicken and an optional 1g of turmeric and chili powder, season with salt and pepper.","Keep frying for a further 2 minutes until the chicken is cooked through.","Add Mozzarella to the pan and combine everything until the cheese is melted.","Transfer the meat to the tortilla you prepared. Take the tortilla and put it back into the pan, bottom side down.","Add the sauce on top of the meat.","Flip one side of the tortilla on top of the other to form a quesadilla, and press it down gently with your spatula. Salt the outside of the tortilla and fry both sides for about 30 seconds. Done!"],"notes":["You can use other spices like smoked paprika, chili or cumin.","Macros recomputed from our per-100g ingredient tables: 390 kcal for the portion vs the book's 365 kcal (whole recipe)."]},"lunch/ready-meals/chicken-quesadillas":{"id":"lunch/ready-meals/chicken-quesadillas","name":"Chicken quesadillas","meal":"lunch","servings":12,"calories":297,"protein":23,"carbs":27,"fat":11,"isBase":false,"description":"Freezer Quesadillas are quick way to have a healthy lunch when you don‘t have time to cook. Makes 12. 50 min. From The Felu Cookbook (p. 271).","ingredients":["- 12 wheat tortillas (20 cm or 8 inch) (≈540 g)","- 4 chicken breasts (720 g)","- 240 g shredded cheese","- 2 red bell peppers (300 g)","- 3 medium onions (150 g)","- 34 g oil","- 6 g garlic powder","- 6 g cayenne pepper","- 6 g onion powder","- 3 g cumin","- 6 g paprika","- Salt and black pepper"],"method":["Start by slicing the chicken breast into strips, then into bite-sized pieces. Place the chicken in a bowl, add 20g of olive oil and all the seasonings, and mix well.","Chop the onions and bell peppers and set them aside in a separate bowl.","In another bowl, combine the avocados, Greek yogurt, chopped mint, juice of 2 limes, salt, and garlic powder. Mash with a fork until you have a dip.","Stir-fry the chicken in a pan over medium-high heat for 1 minute on each side, then transfer it to a bowl. t. Serves 4. The optional mayo drizzle is swapped to Greek yogurt.","ingredients":["- 60 ml mirin (Mirin)","- 60 ml cooking sake (Cooking sake)","- 60 ml tamari (Tamari (generic/USDA))","- 1 tbsp brown sugar (Brown sugar)","- 1 tbsp olive oil (Olive oil)","- 800 g boneless, skinless chicken thighs (Chicken thigh, boneless & skinless, Hacendado)","- 140 g edamame beans (Edamame, shelled)","- 75 g shredded red cabbage (Red/purple cabbage)","- 90 g julienned carrot (Carrot)","- 800 g cooked jasmine rice (Jasmine rice, cooked)","- 125 g Greek yogurt, optional drizzle (Greek yogurt light, Hacendado)","- 1 tsp white and black sesame seeds, optional (Sesame seeds, whole dried)","- 1 sliced fresh red chilli, optional"],"method":["Combine mirin, sake, tamari and brown sugar for the sauce.","Brown chicken in oil ~8 minutes, add sauce and cook 1 minute, then finish cooking another minute.","Build bowls with rice, edamame, cabbage and carrot; top with sliced chicken.","Drizzle with Greek yogurt (in place of mayo) and scatter sesame seeds and chilli."],"notes":["Mayo swapped for Greek yogurt light (cold drizzle — no heat warning needed).","Computed 675 kcal/serv is well below the site's 1,354 because the site nutrition appears to total all 4 servings; computed value is per single serving."]},"lunch/ready-meals/chicken-tzatziki-wraps":{"id":"lunch/ready-meals/chicken-tzatziki-wraps","name":"Lemon and Oregano Chicken Tzatziki Wraps","meal":"lunch","servings":4,"calories":490,"protein":41,"carbs":37,"fat":26,"isBase":false,"description":"Pan-fried lemon-oregano chicken thighs with homemade cucumber-yogurt tzatziki in flour tortillas. Serves 4.","ingredients":["- 500 g boneless, skinless chicken thighs (Chicken thigh, boneless & skinless, Hacendado)","- 1 tsp freshly minced garlic (Garlic, raw)","- 4 tsp fresh lemon juice, total (Lemon juice, fresh)","- 1 tsp sea salt flakes, plus ½ tsp (Salt)","- 1 tsp sweet paprika (Sweet paprika)","- 1 tsp onion powder (Onion powder)","- 1 tsp garlic powder (Garlic powder)","- 1 tsp dried oregano (Oregano, dried)","- 1 tbsp brown sugar (Brown sugar)","- ½ tsp black pepper (Black pepper, ground)","- 3 tbsp olive oil (Olive oil)","- 1 small cucumber, grated and squeezed (Cucumber)","- 1 tbsp finely chopped fresh dill (Dill, fresh)","- 1 tbsp finely chopped fresh mint (Mint, fresh)","- 250 g plain Greek yoghurt (Greek yogurt light, Hacendado)","- 4 flour tortillas, ~60 g each (Flour tortilla maxi, Hacendado)","- 7 g chopped fresh flat-leaf parsley (Parsley, fresh)","- 2 tomatoes, grated and squeezed (Tomato, roma/plum)","- ¼ red onion, sliced (Red onion)"],"method":["Combine the chicken with garlic, 3 tsp lemon juice, salt, paprika, onion powder, garlic powder, oregano, brown sugar, pepper and olive oil; coat evenly.","Mix the tzatziki: cucumber, dill, mint, Greek yogurt, 1 tbsp lemon juice, ½ tsp garlic, ½ tsp salt. Set aside.","Cook chicken in a hot pan 10–12 minutes until golden, turning regularly; add ½ cup water in the last 2 minutes. Slice and toss through pan juices.","Fill wraps with tzatziki, parsley, tomato, red onion and chicken."],"notes":["Wraps mapped to Flour tortilla maxi (Hacendado), 4 × 60 g. Computed 490 kcal/serv vs site 456 — close."]},"lunch/ready-meals/cold-meat-plate":{"id":"lunch/ready-meals/cold-meat-plate","name":"Cold meat plate","meal":"lunch","servings":1,"calories":676,"protein":61,"carbs":51,"fat":24,"isBase":false,"description":"This is the italian way to eat a ton of protein if you have no time. Single portion. 10 min. From The Felu Cookbook (p. 173).","ingredients":["- 2 wheat tortilla (20cm or 8inch) (≈90 g)","- 125 g fresh mozzarella light","- 100 g tomatoes","- 100 g deli meat","- 4 g olive oil","- 0.5 g oregano","- Salt and black pepper"],"method":["Cut the Mozzarella and the tomatoes into equal thick slices.","Place the deli on a plate, then the mozzarella and the tomatoes.","Add oregano, pepper and salt on top.","Add olive oil over the entire plate.","heat up tortillas in a dry pan for 1 minute each side and serve with the meat plate. Done!"],"notes":["You can add more cold meat if you want, I usually go with turkey or chicken.","You need fresh Mozzarella for this recipe. The low-moisture shredded Mozzarella will not work.","I use protein tortillas for this recipe but regular wheat tortillas will work just as fine.","Macros recomputed from our per-100g ingredient tables: 676 kcal for the portion vs the book's 634 kcal (whole recipe)."]},"lunch/ready-meals/crazy-melon-salad":{"id":"lunch/ready-meals/crazy-melon-salad","name":"Crazy melon salad","meal":"lunch","servings":1,"calories":509,"protein":57,"carbs":45,"fat":14,"isBase":false,"description":"Don’t judge a book by its cover - this might be the best description of this meal. Give it a try! Single portion. 15 min. From The Felu Cookbook (p. 149).","ingredients":["- 300 g water melon","- 200 g cantaloupe","- 60 g light feta cheese","- 1 chicken breast (180 g)","- 40 g pickled onions (Felu Cookbook p. 255 — not imported)","- 20 g mint sauce (Felu Cookbook p. 291 — not imported)","- 2 g oil","- 2 g garlic powder","- Salt and black pepper"],"method":["Chop up melon flesh into bite-size cubes and add them to a big plate.","Crumble the feta cheese into small pieces and add it to the melon.","Slice the chicken breast into bite-size pieces (same size as melon) and add a pinch of salt, black pepper and garlic powder. Mix it.","Heat a pan (24cm/9,5inch) on medium-high heat, add in oil and add chicken breast.","Fry this now for 2-3 minutes under occasional stirring until chicken is nicely browned and cooked through.","Add chicken on top of the melon and feta cheese. Top everything with pickled onions and then the mint sauce. Done!"],"notes":["You can switch the melon with different kinds of fruit to add more flavor.","Don‘t judge this meal too early, try it you will like it :)","Macros recomputed from our per-100g ingredient tables: 509 kcal for the portion vs the book's 485 kcal (whole recipe)."]},"lunch/ready-meals/creamy-beef-bowl":{"id":"lunch/ready-meals/creamy-beef-bowl","name":"Creamy beef bowl","meal":"lunch","servings":1,"calories":691,"protein":62,"carbs":70,"fat":18,"isBase":false,"description":"Another beef bowl that takes 20 minutes and is super creamy. Single portion. 20 min. From The Felu Cookbook (p. 169).","ingredients":["- 180 g ground beef 95/5","- 250 g potatoes","- 1 red bell pepper (150 g)","- 1 medium onion (50 g)","- 1 g garlic powder","- 1 g chili powder","- 5 g oil","- 100 g cottage cheese","- 50 g tomato salsa","- 50 g evaporated milk","- 1 g oregano","- Salt and black pepper"],"method":["Peel and cut the potatoes into thick slices, then into fries and then again into bite-size cubes. 2x2cm or 1x1 inch.","Microwave the potatoes in a bowl for 5 min at 600W.","Dice the onion and bell pepper.","Add oil to a pan over medium heat and start by frying the microwaved potatoes for 5 minutes with a pinch of salt.","Then, add a bit more oil and add the pepper and onion with another small pinch of salt. Continue frying for another 3 minutes before adding a bit more oil and adding the ground beef. Spread the beef so that as much meat as possible comes in contact with the pan. Fry the beef for 1 minute.","Add black pepper, garlic powder, and chili powder. Mix everything and continue frying for another 1-2 minutes until the beef is cooked through.","Meanwhile, add cottage cheese, tomato salsa, evaporated milk, salt, and oregano to a blender. Blend on high for 60 seconds.","Remove the beef from the heat and add the sauce to the pan, using the remaining heat to bring the sauce to temperature and mix everything together. Done!"],"notes":["Use different spices like cayenne pepper or turmeric and add it to the pan for more flavor.","The sauce can be also prepared with 10g of tomato puree.","Macros recomputed from our per-100g ingredient tables: 691 kcal for the portion vs the book's 693 kcal (whole recipe)."]},"lunch/ready-meals/creamy-freezer-burritos":{"id":"lunch/ready-meals/creamy-freezer-burritos","name":"Creamy freezer burritos","meal":"lunch","servings":6,"calories":507,"protein":44,"carbs":41,"fat":17,"isBase":false,"description":"The Italian style burrito but this time you can meal prep it for the entire week. Makes 6. 50 min. From The Felu Cookbook (p. 268).","ingredients":["- 6 wheat tortillas (25 cm or 10 inch) (≈372 g)","- 900 g ground beef 95/5","- 2 large onions (200 g)","- 300 g crushed tomatoes","- 4 laughing cow wedges (≈68 g)","- 120 g shredded mozzarella","- 5 g oil","- 8 g garlic powder","- 8 g onion powder","- 4 g oregano","- Salt and black pepper"],"method":["Chop all onions into bite-sized pieces. Add crushed tomatoes with salt, pepper, oregano, onion powder and garlic powder into a container.","Preheat a pan (28cm or 11 inch) to medium-high heat and add in oil. Start with frying ground beef. Spread it out with a spatula and wait for 2 minutes until the bottom has developed color.","Add salt and pepper.","After 2-3 mins, add in onions and mix everything and keep frying for 2-3 minutes. The onions will become translucent.","Add in crushed tomatoes and combine everything. Keep cooking for another 2-3 minutes.","Add laughing cow wedges and incorporate them into the meat with a spatula by pressing them down. The sauce will slowly become orange and creamy.","Add mozzarella and mix until the cheese is fully melted. Place a big plate on a scale. Transfer the meat to that plate and remember the weight. Try to press the meat down, so it becomes flat. Put it into the fridge to cool down for 20 minutes. This will help prevent the burrito from becoming soggy.","Now place the meat plate on a scale. Take out 1 tortilla. Divide your remembered weight from before by 6. Take out this number from the meat plate and spread it on top of the tortilla. Try to cover the lower third the tortilla and leave a bit of space around the edges.","Flip both sides left and right toward the middle of the tortilla. Now rolling from the bottom upward, make a burrito shape. Wrap it tight into aluminum foil. Done.","Repeat with all tortillas. Add them into a ziplock back and freeze them for up to 3 months.","The quickest way to defrost them is in a microwave. Remove them from the aluminum foil and place them on a plate. Microwave for 260W or defrost setting for 7 minutes and then switch to 620W for another 3-4 minutes. Ready!"],"notes":["Feel free to add more spices like cumin, chili or paprika.","Can be made with ground turkey as well.","Macros recomputed from our per-100g ingredient tables: 3044 kcal for the batch vs the book's 3056 kcal (whole recipe)."]},"lunch/ready-meals/creamy-lemon-chicken-noodle-soup":{"id":"lunch/ready-meals/creamy-lemon-chicken-noodle-soup","name":"Creamy Lemon Chicken Noodle Soup","meal":"lunch","servings":4,"calories":631,"protein":46,"carbs":40,"fat":33,"isBase":false,"description":"Shredded chicken, egg noodles and vegetables in a creamy lemon-parmesan broth. Serves 4.","ingredients":["- 500 g boneless, skinless chicken breasts, halved into steaks (Chicken breast, Hacendado)","- 1 tsp sweet paprika (Sweet paprika)","- 2 tsp dried thyme, total (Thyme, dried)","- ½ tsp salt, plus pepper (Salt / Black pepper, ground)","- 2 tbsp olive oil (Olive oil)","- 1 brown onion, finely diced (Brown onion (yellow), raw)","- 1 tbsp freshly minced garlic (Garlic, raw)","- 1 carrot, finely diced (Carrot)","- 2 celery stalks, finely diced (Celery, raw)","- 2 tbsp unsalted butter (Mantequilla light, Hacendado)","- 35 g plain flour (Plain (all-purpose) flour)","- 1 litre chicken stock (Chicken stock, Knorr)","- 500 ml water","- 1 tsp dried oregano (Oregano, dried)","- 150 g vermicelli egg noodles (Egg noodles, dried (thin))","- 1 zucchini, finely diced (Zucchini (courgette), raw)","- 250 ml thickened cream (Nata para cocinar, Hacendado)","- 100 g grated parmesan (Grana Padano)","- 2 tbsp chopped parsley (Parsley, fresh)","- 2 tbsp fresh lemon juice (Lemon juice, fresh)"],"method":["Season and sear chicken; set aside.","Sauté onion, garlic, carrot and celery; add butter and flour to make a roux.","Add stock, water, thyme and oregano; simmer chicken ~10 minutes, then shred.","Add noodles, zucchini and cream; cook 2–3 minutes.","Finish with parmesan, parsley and lemon juice."],"notes":["Cream mapped to Nata para cocinar (lighter cooking cream).","Computed 631 kcal/serv vs site 919 — ~31% lower, driven by the lighter cooking-cream value, not a conversion error. Verify cream value against your product if it matters."]},"lunch/ready-meals/creamy-potato-bowl":{"id":"lunch/ready-meals/creamy-potato-bowl","name":"Creamy potato bowl","meal":"lunch","servings":5,"calories":549,"protein":66,"carbs":41,"fat":15,"isBase":false,"description":"Perfect meal prep for cold weather! Makes 5. 60 min. From The Felu Cookbook (p. 277).","ingredients":["- 5 SERVINGS:","- 1000 g chicken breast","- 600 g potatoes","- 600 g cauliflower","- 500 g water","- 15 g vegetable broth powder","- 500 g water","- 15 g dry gelatine","- 15 g vegetable broth powder","- 2 bell peppers (300 g)","- 4 medium onions (200 g)","- 2 cloves of garlic (≈6 g)","- 200 g 0.2 % fat cream cheese","- 100 g milk","- 150 g 0.2 % fat cream cheese","- 30 g mustard","- 40 g butter","- 20 g oil","- Salt and black pepper"],"method":["Cut the potatoes into bite-sized pieces and separate the cauliflower into florets. In one bowl, combine broth powder with water. In another bowl, mix water with broth powder and gelatin.","Peel and chop the garlic, and finely chop 2 onions.","In a 24 cm (9.5 inch) pot over medium heat, add 20g butter and stir-fry the onions with a pinch of salt for 7–8 minutes. Add the garlic and cook for 1 more minute.","Then add the potatoes, cauliflower, and the broth without gelatin. Stir well, cover with a lid, and let simmer for 12–14 minutes.","Meanwhile, chop the remaining onions and bell peppers.","Slice the chicken into thick pieces.","Once the potatoes are cooked through, transfer everything to a large blender or food processor. Add cream cheese, milk, and black pepper. Blend on high for 60 seconds.","Heat a pan over medium-high heat and add 4 g oil. Fry the chicken in batches with salt and black pepper, about 1 minute per side. Remove from the pan and repeat until all the chicken is cooked.","Add 8 g oil to the same pan and sauté the onions and bell peppers with salt and black pepper for about 8 minutes.","Add the mustard, stir briefly, then pour in the gelatin broth. Let simmer for 5 minutes to reduce.","Turn off the heat, add 20 g butter, and stir until melted.","Transfer the potatoes, chicken, and gravy into 5 meal prep containers. Done!"],"notes":["Macros recomputed from our per-100g ingredient tables: 2747 kcal for the batch vs the book's 2900 kcal (whole recipe)."]},"lunch/ready-meals/deconstructed-big-mac":{"id":"lunch/ready-meals/deconstructed-big-mac","name":"Deconstructed Big Mac","meal":"lunch","servings":1,"calories":702,"protein":55,"carbs":65,"fat":25,"isBase":false,"description":"A big mac without a bun and tasty potatoes instead is amazing! Single portion. 20 min. From The Felu Cookbook (p. 165).","ingredients":["- 180 g ground beef 95/5","- 250 g potatoes","- 1 medium onion (50 g)","- 50 g lettuce","- 50 g pickles","- 50 g tomatoes","- 5 g oil","- 1 g dry rosemary","- 1 serving 1000 island sauce (Felu Cookbook p. 287 — not imported)","- 1 serving 3 ingredient cheese sauce (Felu Cookbook p. 295 — not imported)"],"method":["Peel and Cut the potatoes into thick slices, then into fries and then again into bite-size cubes. 2x2cm or 1x1 inch.","Microwave the potatoes in a bowl for 5 min at 600W.","Prepare one serving each of 1000 Island sauce and cheese sauce.","Finely chop onions, pickles, lettuce, and tomatoes.","In a pan, heat oil over medium-high heat. Add the microwaved potatoes and a pinch of salt. Fry them for about 5 minutes or until they are golden brown. Then remove the potatoes from the pan.","Add a bit more oil to the pan, and sauté the onions for 2-3 minutes, or until they are translucent and slightly golden.","Push the onions to the side of the pan, add another bit of oil, and place the beef in the pan. Break up the meat, ensuring as much of the meat as possible is in contact with the pan. Season with salt and black pepper.","After one minute, combine the beef with the onions in the pan and continue frying for another minute.","Turn off the heat, then pour in the cheese sauce, mixing continuously for about 30 seconds until the mixture is creamy.","To serve, arrange the fried potatoes on a plate, top with the chopped vegetables, followed by the 1000 Island sauce, and finally, add the creamy cheesy beef mixture on top. Done!"],"notes":["Add chili flakes for addiotnal heat.","You can add more vegetables like bell peppers or carrots for more volume.","Macros recomputed from our per-100g ingredient tables: 702 kcal for the portion vs the book's 683 kcal (whole recipe)."]},"lunch/ready-meals/deli-sub":{"id":"lunch/ready-meals/deli-sub","name":"Deli sub","meal":"lunch","servings":1,"calories":622,"protein":56,"carbs":70,"fat":12,"isBase":false,"description":"Deli subs are actually great for weight loss if you do some simple tweeks. Single portion. 10 min. From The Felu Cookbook (p. 109).","ingredients":["- 120 g french baguette","- 65 g fresh mozzarella light","- 100 g deli meat","- 50 g tomatoes","- 50 g lettuce","- 50 g pickles","- 1 serving spicy Greek yogurt (Felu Cookbook — sauces chapter, not imported)","- Salt and black pepper"],"method":["Start by cutting the baguette in half and scooping out the soft part of the bread to save about half the calories.","Next, prepare the spicy Greek yogurt. Chop the lettuce, tomatoes, pickles, and mozzarella.","Lay one half of the baguette on a piece of parchment paper and spread the Greek yogurt over it as the base. Add your choice of deli meat, followed by the mozzarella. Next, layer the chopped vegetables, sprinkle a bit of salt for taste, and then place the other half of the baguette on top.","Roll the entire sandwich in the parchment paper, done!"],"notes":["The soft part of the bread can be baked in the oven to make croutons, or you can place it in a zip-lock bag and use it to feed the birds outside your house.","Try different meat combinations, most of them work great.","Macros recomputed from our per-100g ingredient tables: 622 kcal for the portion vs the book's 475 kcal (whole recipe).","Light mayo swapped for Greek yogurt light (Hacendado) — house rule; the macros below already reflect the swap. Stir it in off the heat so it does not split."]},"lunch/ready-meals/egg-white-quesadilla":{"id":"lunch/ready-meals/egg-white-quesadilla","name":"Egg white quesadilla","meal":"lunch","servings":1,"calories":428,"protein":26,"carbs":43,"fat":20,"isBase":false,"description":"If you’ve been craving a quesadillas but don’t fancy a meaty dish, this recipe is for you! Single portion. 20 min. From The Felu Cookbook (p. 135).","ingredients":["- 1 wheat tortilla (20cm or 8inch) (≈45 g)","- 100 g egg whites","- 1 medium onion (50 g)","- 150 g pak choi","- 1 slice american cheese (≈19 g)","- 30 g cream cheese 0.2 % fat","- ½ avocado (70 g)","- ½ lime (juice) (≈15 g)","- 2 g garlic powder","- 2 g oil","- Salt and black pepper"],"method":["Chop up all vegetables into small pieces. Cut the american cheese into small pieces as well.","Add avocado, cheese, lime juice, salt, pepper and garlic powder into a bowl. Mash it with a fork until smooth.","Spread the avocado mix on the tortilla as a layer.","Add oil into a pan (24cm/9,5inch) on medium-high heat and fry the onion and pak choi for 3-4 minutes.","Add salt and pepper and mix.","Now add the egg whites and immediately follow with the cheese. Spread everything out nicely with a spatula for 30 seconds.","Transfer the egg on top of the tortilla and avocado and spread the eggs with a spatula. Put the tortilla back into the pan.","Flip one side of the tortilla on top of the other to form a quesadilla, and press it down gently with your spatula. Salt the outside of the tortilla and fry both sides for about 30 seconds or until you have a nice color. Done!"],"notes":["You can add 25g shredded Mozzarella if you don’t like american cheese.","You can add another sauce to save calories. My mint sauce (see chapter) works best.","Macros recomputed from our per-100g ingredient tables: 428 kcal for the portion vs the book's 398 kcal (whole recipe)."]},"lunch/ready-meals/gyro":{"id":"lunch/ready-meals/gyro","name":"Gyro","meal":"lunch","servings":1,"calories":588,"protein":69,"carbs":57,"fat":10,"isBase":false,"description":"The Greek way of making a burrito. Different flavor but equally delicious. Single portion. 25 min. From The Felu Cookbook (p. 106).","ingredients":["- 200 g skinless, boneless chicken thighs","- 1 medium onion (50 g)","- 50 g tomatoes","- 50 g greek yogurt 0.2% fat","- ½ lemon (juice) (≈22.5 g)","- 1 clove of garlic (≈3 g)","- 4 g olive oil","- 5 g chopped dill","- 2 g garlic powder","- 1 g oregano","- 1 serving 2 ingredient dough (Felu Cookbook p. 246 — not imported)","- Salt and black pepper"],"method":["Preheat the oven to 200°C or 400°F","Add oil on both sides of the chicken thigh. Add salt, pepper, garlic powder, and oregano and cover the entire thigh.","Add chicken to a baking sheet and bake in the oven for 20 minutes. Alternatively use air fryer.","In the meantime, make 1 serving of two-ingredient dough naan bread (see chapter) or prepare a store-bought pita.","Peel and grate the garlic. Combine Greek yogurt, olive oil, lemon juice, salt, chopped dill, and grated garlicin a glass and mix until smooth.","Dice the tomatoes and onion.","If you have a store-bought pita, then heat it up in a pan.","Lay the pita/naan on a plate. Spread yogurt sauce in the middle. Add tomatoes and onions on top.","Remove the chicken thigh from the oven and cut it into small chunks. Lay them on top of the tomatoes and onions. Close the gyro, and you’re done!"],"notes":["If you buy a pita, try to shoot for 200 calories max.","Macros recomputed from our per-100g ingredient tables: 588 kcal for the portion vs the book's 558 kcal (whole recipe)."]},"lunch/ready-meals/homemade-chicken-soup":{"id":"lunch/ready-meals/homemade-chicken-soup","name":"Homemade Chicken Soup","meal":"lunch","servings":4,"calories":530,"protein":33,"carbs":29,"fat":31,"isBase":false,"description":"Whole-chicken broth with vegetables and egg noodles. Makes 4 servings.","ingredients":["- 2 tbsp olive oil (~28 g)","- 2 onions, finely diced (~300 g, brown onion)","- 1 whole free-range chicken (~1.5 kg; ~600 g meat & skin consumed)","- 2 large carrots, peeled and halved lengthways (~140 g)","- 2 stalks celery, including leaves, cut into 15 cm lengths (~80 g)","- 3 tsp sea salt flakes","- 1 tsp freshly cracked black pepper, plus extra to serve","- 1 tbsp apple cider vinegar (~15 g)","- 3 litres filtered water","- 100 g vermicelli egg noodles","- 2 tbsp freshly chopped flat-leaf parsley, to serve (~8 g)"],"method":["Sauté onions in olive oil until soft.","Add the rinsed whole chicken with carrots, celery, salt, pepper, and apple cider vinegar to boiling water; simmer ~1.5 hours until tender.","Remove chicken and vegetables; shred the meat and cut vegetables into bite-sized pieces. Skim excess fat from the broth.","Return meat and vegetables to the broth with the egg noodles; cook 10 minutes.","Serve with parsley and extra pepper."],"notes":["Macros computed on ~600 g consumed chicken meat & skin (a whole 1.5 kg bird yields roughly this in edible meat; bones and most rendered fat are skimmed). This is why the computed 530 kcal lands below the site's 631 kcal — the site counts the whole bird."]},"lunch/ready-meals/hot-honey-beef-bowl":{"id":"lunch/ready-meals/hot-honey-beef-bowl","name":"Hot honey beef bowl","meal":"lunch","servings":1,"calories":825,"protein":60,"carbs":83,"fat":28,"isBase":false,"description":"The viral beef bowl but made with a ton of protein. Single portion. 20 min. From The Felu Cookbook (p. 60).","ingredients":["- 180 g ground beef 95/5","- 1/2 avocado (70 g)","- 250 g sweet potatoes","- 100 g cottage cheese","- 10 g gochujang","- 25 g soy sauce","- 1 g paprika","- 7 g oil","- Salt and black pepper","**Sauce:**","- 15 g honey","- 15 g sriracha"],"method":["Cut the potato into bite-sized pieces and place into a bowl. Add 4 g of oil, salt, and paprika, and mix. Then air fry at 200°C or 400°F for 12 minutes.","Mix all sauce ingredients in a small glass until smooth.","Mix the gochujang and soy sauce in a small glass until smooth.","Add 3 g of oil into a pan on medium heat. Then stir-fry the ground beef for 3 minutes in total.","Add black pepper to the beef, then add the soy sauce mixture and stir until combined for 30 seconds. Then remove from the heat.","Into a bowl, add the baked sweet potatoes, the ground beef, and the cottage cheese. Then halve an avocado, scoop out the fruit, and add it to the bowl. Finally, drizzle it with the hot honey. Done!"],"notes":["Use hot honey if you can find it in the store. Otherwise, a mix of sriracha and honey is a pretty good alternative.","Macros recomputed from our per-100g ingredient tables: 825 kcal for the portion vs the book's 775 kcal (whole recipe)."]},"lunch/ready-meals/italian-creamy-burrito":{"id":"lunch/ready-meals/italian-creamy-burrito","name":"Italian creamy burrito","meal":"lunch","servings":1,"calories":718,"protein":63,"carbs":61,"fat":23,"isBase":false,"description":"Burritos but made like an italian. Not traditional but evenly delicious. Single portion. 20 min. From The Felu Cookbook (p. 98).","ingredients":["- 2 wheat tortillas (20cm or 8inch) (≈90 g)","- 200 g ground beef 95/5","- 1 medium onion (50 g)","- 100 g storebought tomato sauce","- 1 laughing cow wedge (≈17 g)","- 30 g gouda fat reduced","- 2 cloves of garlic (≈6 g)","- 2 g oil","- Salt and black pepper"],"method":["Chop up the onion into small pieces. Peel and grate garlic.","Add oil into the pan (24cm/9,5inch) on medium-high heat. Add the onion and fry for 3 minutes, then add ground beef and fry both for another 1-2 minutes under occasional stirring until beef has some color. Add a pinch of salt and black pepper.","Add in garlic and fry for 20 seconds.","Add tomato sauce and mix everything, so all the meat is red.","Add the laughing cow wedge, turn the heat to mediumlow and mix the cheese slowly into the sauce by pressing it down with a spatula for around 1 minute.","Once the sauce is creamy, add in the gouda cheese and melt it in for around 30 seconds.","Add another pan to the stove. Dry cook the tortillas for 30 seconds on each side on medium-high. Add some salt to them.","Assemble burritos by laying half the meat mixture into one tortilla. I just roll them like a cigar, but you can also lay both sides left and right towards the middle and then roll it into a closed burrito shape. Done!"],"notes":["The recipe can also be divided in half for a smaller serving, apart from the laughing low wedge.","Macros recomputed from our per-100g ingredient tables: 718 kcal for the portion vs the book's 698 kcal (whole recipe)."]},"lunch/ready-meals/lahmacun":{"id":"lunch/ready-meals/lahmacun","name":"Lahmacun","meal":"lunch","servings":1,"calories":449,"protein":36,"carbs":57,"fat":9,"isBase":false,"description":"I make this recipe 2-3 per week. It‘s the perfect weeknight meal. Single portion. 20 min. From The Felu Cookbook (p. 179).","ingredients":["- 100 g ground beef 95/5","- 60 g tomatoes","- 60 g bell peppers","- 2 cloves of garlic (≈6 g)","- ½ medium onion (25 g)","- 10 g tomato puree","- 1 g paprika","- 1 g cumin","- 1 g cayenne pepper","- Bunch parsley","- 1 serving 2 ingredient dough (Felu Cookbook p. 246 — not imported)","- Salt and black pepper"],"method":["Start by preparing 1 serving of 2-ingredient dough (see recipe).","Prepare a blender or food processor.","Chop up the onion, pepper, and garlic, and blend them for 30 seconds.","Next, add the tomatoes and parsley into the food processor and mix again for 30 seconds.","Then, add the beef, tomato puree, and all the seasonings. Mix for 45-60 seconds until it turns into a paste.","Add oil into a non-stick pan (24cm/9.5inch). Don‘t turn on the stove yet. Add in the dough ball and press it down and press the edges slowly until it turns into a flat, round bread.","Now, add the ground beef filling on top of the dough. Spread it around with a spoon. Turn on the heat to medium and let it cook with a closed lid for 5-7 minutes.","As soon as the bottom has some color, you can either put the pan for 2 minutes under the broiler in the oven or flip the lahmacun and let it fry for another 2 minutes.","Remove the lahmacun and optionally add fresh vegetables with a bit of lemon and roll it into a burrito shape. Done!"],"notes":["I use onions, romaine lettuce, tomatoes, and a squeeze of fresh lemon as a filling before rolling it up.","Macros recomputed from our per-100g ingredient tables: 449 kcal for the portion vs the book's 498 kcal (whole recipe)."]},"lunch/ready-meals/loaded-pesto-potato-bowl":{"id":"lunch/ready-meals/loaded-pesto-potato-bowl","name":"Loaded pesto potato bowl","meal":"lunch","servings":1,"calories":665,"protein":70,"carbs":61,"fat":17,"isBase":false,"description":"The green sauce makes all the difference here, do not skip it!. Single portion. 20 min. From The Felu Cookbook (p. 83).","ingredients":["- 1 chicken breast (180 g)","- 300 g potatoes","- 100 g cottage cheese","- 20 g parmesan cheese","- 20 g basil fresh","- 1 clove of garlic (≈3 g)","- 1 g cayenne pepper","- 1 g smoked paprika","- 1 g onion powder","- 1 g garlic powder","- 8 g oil","- Salt and black pepper"],"method":["Peel and Cut the potatoes into thick slices, then into fries and then again into bite-size cubes. 2x2cm or 1x1 inch.","Microwave the potatoes in a bowl for 5 min at 600W.","Cut the chicken into bite-sized pieces. In a separate bowl, combine the cayenne pepper, smoked paprika, onion powder, garlic powder, salt, and black pepper; mix well.","In a blender, combine the cottage cheese, garlic, Parmesan, basil, and salt. Blend on high for 60 seconds.","Heat a 24 cm (9.5-inch) pan over medium-high heat. Add a little oil and fry the microwaved potatoes with a pinch of salt for 3–4 minutes, stirring occasionally.","Push the potatoes to one side of the pan and add a bit more oil. Then add the chicken along with a pinch of salt. Stir-fry the chicken for 1 minute on each side.","Add the seasonings (from the bowl) to the pan and stir everything to coat the chicken and potatoes. Then re move the pan from the heat.","Transfer the chicken and potatoes to a plate. Add the green sauce and mix well. Done!"],"notes":["Do not add the sauce to the hot pan or it will ruin the consistency..","Macros recomputed from our per-100g ingredient tables: 665 kcal for the portion vs the book's 687 kcal (whole recipe)."]},"lunch/ready-meals/massive-salad":{"id":"lunch/ready-meals/massive-salad","name":"Massive salad","meal":"lunch","servings":1,"calories":538,"protein":68,"carbs":36,"fat":17,"isBase":false,"description":"This is the salad to end hunger! Single portion. 15 min. From The Felu Cookbook (p. 116).","ingredients":["- 200 g skinless, boneless chicken thighs","- 100 g cucumber","- 100 g tomatoes","- 60 g Spinach","- 2 roman lettuce (300 g)","- 20 g light feta cheese","- 50 g avocado","- 1 medium onion (50 g)","- 0.5 g oregano","- 1 g garlic powder","- Salt and black pepper","**Sauce:**","- 60 g skyr or 0.2 % fat greek yogurt","- 5 g mustard","- 2 g olive oil","- 1 g garlic powder","- ½ lemon (juice) (≈22.5 g)","- Bunch dill","- Salt and black pepper"],"method":["Add salt, black pepper, oregano, and garlic powder on both sides of the chicken, and then air fry them at 200°C or 400°F for 12 minutes.","Add all sauce ingredients into a glass and mix until smooth.","Chop up all the vegetables, feta, and avocado into bite-size pieces."," ,"notes":["Vegetarian; feta is the protein source (~17 g/serving)."]},"lunch/ready-meals/pasta-salad":{"id":"lunch/ready-meals/pasta-salad","name":"Pasta salad","meal":"lunch","servings":1,"calories":616,"protein":61,"carbs":63,"fat":14,"isBase":false,"description":"A perfect summer meal that is packed with protein. Single portion. 15 min. From The Felu Cookbook (p. 79).","ingredients":["- 70 g dry pasta (red lentil or chickpea)","- 75 g frozen edamame","- 1 medium onion (50 g)","- 100 g cucumber","- 100 g tomato","- 100 g deli meat","- 20 g Greek yogurt light (Hacendado)","- 50 g skyr or 0.2% fat greek yogurt","- ½ lime juice (≈15 g)","- 5 g olive oil","- 1 g garlic powder","- Salt"],"method":["Cook the pasta in salted water for 3 minutes longer than the package instructions, then drain it as soon as it’s done.","Chop up all vegetables and deli meat into bite-sized pieces.","In a small bowl (or glass), combine the Greek yogurt light (Hacendado), skyr, lime juice, olive oil, garlic powder, and salt; mix well.","Place a bowl on a scale and add the frozen edamame. Then add the drained pasta and stir—it will defrost the edamame and cool down the pasta.","Add the vegetables, deli meat, and sauce, and give everything a good stir. Done!"],"notes":["You can add cayenne pepper and onion powder to the sauce for more flavor.","Dor the deli meat I use turkey, it is the best in my opinion.","Macros recomputed from our per-100g ingredient tables: 616 kcal for the portion vs the book's 623 kcal (whole recipe).","Light mayo swapped for Greek yogurt light (Hacendado) — house rule; the macros below already reflect the swap. Stir it in off the heat so it does not split."]},"lunch/ready-meals/pastrami-sandwich":{"id":"lunch/ready-meals/pastrami-sandwich","name":"Pastrami sandwich","meal":"lunch","servings":1,"calories":514,"protein":44,"carbs":67,"fat":7,"isBase":false,"description":"This is a great high protein sandwich and it‘s made with pastrami. Single portion. 10 min. From The Felu Cookbook (p. 111).","ingredients":["- 2 english muffins (≈120 g)","- 70 g pickles","- 100 g pastrami","- 100 g 0.2 % fat cream cheese","- 5 g honey","- 1 g paprika","- 1 g garlic powder","- Salt and black pepper"],"method":["Combine cream cheese, honey, paprika, garlic powder, and a pinch of salt in a bowl. Cut the pickles into small slices.","Place the muffins in an air fryer or in the oven at 200°C or 400°F for 2-3 minutes until they become brown and crispy.","Spread the cream cheese mixture on the bottom halves of the muffins. Top each with pastrami, pickles, and more of the cream cheese mixture. Place the other halves of the muffins on top. Done!"],"notes":["Try different meat combinations like turkey or chicken, most of them work great.","Macros recomputed from our per-100g ingredient tables: 514 kcal for the portion vs the book's 450 kcal (whole recipe)."]},"lunch/ready-meals/patty-melt":{"id":"lunch/ready-meals/patty-melt","name":"Patty melt","meal":"lunch","servings":1,"calories":400,"protein":30,"carbs":36,"fat":15,"isBase":false,"description":"An easy way to make a burger. Single portion. 10 min. From The Felu Cookbook (p. 103).","ingredients":["- 2 sandwich bread slices (≈60 g)","- 100 g ground beef 95/5","- 1 medium onion (50 g)","- 1 slice american cheese (≈19 g)","- 4 g oil","- Salt and black pepper"],"method":["Form a burger patty with the ground beef and dice the onion.","Heat oil in a 24 cm (9.5-inch) pan over medium-high heat. Add the sandwich bread and toast on one side, then remove it and place a cheese slice on top of the toasted side.","Add more oil to the pan and fry the patty for 1–2 minutes on each side. Season with salt and black pepper.","Once the burger is cooked, place it on top of the sandwich bread with cheese.","Add oil to the pan, then add the diced onions with a pinch of salt and a splash of water. Stir occasionally over medium heat until the water has evaporated. Repeat by adding another splash of water and cook until evaporated, repeating this process three more times.","Place the cooked onions on top of the burger patty. Close the sandwich and add it back to the pan, toasting the remaining sides until golden brown. Done!"],"notes":["This recipe can also be prepared for meal prep. Simply multiply the ingredients as needed.","The patty melts can be frozen and later microwaved for 5 minutes.","Macros recomputed from our per-100g ingredient tables: 400 kcal for the portion vs the book's 418 kcal (whole recipe)."]},"lunch/ready-meals/portuguese-style-chilli-chicken-wrap":{"id":"lunch/ready-meals/portuguese-style-chilli-chicken-wrap","name":"Portuguese-style chilli chicken wrap","meal":"lunch","servings":4,"calories":660,"protein":49.5,"carbs":46.9,"fat":30,"isBase":false,"description":"Paprika chicken with a chilli sauce, Greek yogurt, gouda and lettuce in a pita wrap. Makes 4. Source: simplehomeedit.com. (Mayonnaise swapped for Greek yogurt.)","ingredients":["**Chicken:**","- 600g chicken breast (Hacendado), sliced into thin schnitzels","- 1 tsp (~2.3g) sweet paprika","- ½ tsp onion powder","- ½ tsp garlic powder","- 1 tsp sea salt flakes","- ½ tsp black pepper, ground","- 2 tbsp (28g) olive oil","**Chilli sauce:**","- 125g chilli paste / sambal oelek","- 60ml (56g) olive oil","- 1 tbsp (15g) fresh lemon juice","- ½ tsp garlic, raw, minced","- ½ tsp ginger, raw, minced","- ½ tsp (~2g) caster sugar","- Salt & pepper, to taste","**To serve:**","- 4 pita bread wraps (~70g each)","- 90g Greek yogurt light (Hacendado)","- 4 slices gouda (~20g each)","- 140g iceberg lettuce, shredded","- Oven/air-fryer fries (optional)"],"method":["Marinate the chicken in spices and olive oil; cook (stovetop, air fryer or BBQ) until done.","Combine the chilli sauce ingredients.","Warm the wraps; layer Greek yogurt, cheese, hot chicken, lettuce and chilli sauce; roll."],"notes":["Greek yogurt replaces mayonnaise (cold use — no heat warning).","Pita estimated at 70g each (4 × 70g = 280g); gouda slices at 20g each (4 × 20g = 80g)."]},"lunch/ready-meals/pumpkin-pearl-cous-cous-feta-salad":{"id":"lunch/ready-meals/pumpkin-pearl-cous-cous-feta-salad","name":"Pumpkin, pearl couscous & feta salad","meal":"lunch","servings":4,"calories":450,"protein":9.9,"carbs":27.3,"fat":22.1,"isBase":false,"description":"Roasted spiced pumpkin with pearl couscous, feta, mint, almonds and pomegranate. Scaled from the site's 6 servings to 4. Source: simplehomeedit.com. > Fully computed (vegetable/chicken stock cooked into the couscous adds negligible calories). Computed 450 vs site 493 kcal — within tolerance. Feta provides the protein source. A light lunch — best paired with extra protein on the day.","ingredients":["**Pumpkin:**","- ~533g pumpkin / kabocha squash, raw, cubed","- 0.7 tsp (~1.5g) sweet paprika","- 0.7 tsp (~1.3g) coriander seed, ground","- 0.7 tsp (~1.3g) cumin, ground","- 0.7 tsp (~1.3g) garlic powder","- ⅓ tsp sea salt flakes","- 1.3 tbsp (~18.6g) olive oil","**Couscous:**","- 187g pearl couscous (dried)","- 250ml vegetable or chicken stock","- 165ml water","**Dressing:**","- 53ml olive oil","- zest of ⅔ lemon","- 0.7 tbsp (~14g) honey (BM)","- ⅓ tsp sea salt flakes","- ¼ tsp black pepper, ground","**Salad:**","- 50g feta (Hacendado), crumbled","- ⅓ bunch (~10g) mint, leaves","- ~6g almonds, raw, slivered","- ~100g pomegranate seeds (arils)"],"method":["Roast the spiced pumpkin at 220°C for 25–30 min.","Cook the pearl couscous in the stock and water ~10 min.","Whisk the dressing.","Coat the couscous in half the dressing; plate with pumpkin, feta, mint, almonds and pomegranate; drizzle the rest."],"notes":["Light on protein — pair with a protein main on the day to hit the floor.","Under the 700 kcal/serving ceiling."]},"lunch/ready-meals/shakshuka":{"id":"lunch/ready-meals/shakshuka","name":"Shakshuka","meal":"lunch","servings":4,"calories":343,"protein":12,"carbs":10,"fat":27,"isBase":false,"description":"Eggs poached in a spiced tomato-capsicum sauce, topped with avocado and feta. 4 servings.","ingredients":["- 2 tbsp olive oil (Olive oil)","- 1 brown onion, finely diced (~110 g) (Brown onion)","- 1 red capsicum, finely diced (~120 g) (Red capsicum, raw)","- 1 tbsp freshly minced garlic (~9 g) (Garlic, raw)","- 1 tbsp sweet paprika (~7 g) (Sweet paprika)","- 1 tsp ground cumin (Cumin, ground)","- 400 g canned crushed tomatoes (Crushed tomatoes, canned)","- 1 tsp sea salt flakes (Salt)","- ½ tsp freshly cracked black pepper (Black pepper, ground)","- 1 tsp sugar (Sugar, white)","- 5 eggs (XL eggs — Hacendado)","- 1 avocado, sliced (~150 g) (Avocado)","- 75 g crumbled feta (Feta — Hacendado)","- 25 g chopped coriander or parsley (Coriander, fresh)"],"method":["Soften onion and capsicum in oil. Add garlic, paprika and cumin.","Add crushed tomatoes, salt, pepper and sugar; simmer 10 min.","Make wells and crack in the eggs; cover and cook to desired set.","Top with avocado, feta and herbs."],"notes":["Protein-light for a lunch; pair with a higher-protein side if needed."]},"lunch/ready-meals/sheet-pan-burritos":{"id":"lunch/ready-meals/sheet-pan-burritos","name":"Sheet pan burritos","meal":"lunch","servings":10,"calories":569,"protein":35,"carbs":47,"fat":27,"isBase":false,"description":"The sheet pan method is a legit meal prep technique and it is very fun to use. Makes 10. 90 min. From The Felu Cookbook (p. 269).","ingredients":["- 10 wheat tortillas (25 cm or 10 inch) (≈620 g)","- 500 g ground beef 95/5","- 20 eggs (≈1100 g)","- 150 g cheddar cheese","- 6 medium onions (300 g)","- 2 red bell peppers (300 g)","- 500 g potatoes","- 30 g oil","- 8 g garlic powder","- 8 g smoked paprika","- 8 g cayenne pepper","- Salt and black pepper"],"method":["Chop the onions and bell peppers into fine pieces. Cut the potatoes into similarly sized small pieces.","Add everything to a sheet pan, drizzle with oil, and add a generous pinch of salt. Mix everything well with a spatula and bake in the oven at 200°C (400°F) for 30 minutes. Halfway through, give everything a good stir and continue baking.","Remove the hot sheet pan from the oven. Add the meat on top and spread it out evenly with a spatula. Add all the seasonings, give it another good stir, and put it back into the oven for 10 minutes.","Crack all the eggs into a large bowl and whisk well.","Once the meat is cooked, remove the sheet pan and pour the eggs evenly over the mixture. Carefully place the sheet pan back into the oven and bake for another 10 minutes.","When the eggs are fully cooked, remove the sheet pan from the oven and divide it into 10 pieces using a spatula. They should look like pizza squares. Place the egg squares on a plate and let them cool for 20 minutes.","Take one egg square at a time, place it on top of a tortilla, add 15 g of cheddar cheese, and roll it into a burrito shape. Repeat with all 10 tortillas.","Wrap each burrito in parchment paper and then in aluminum foil. Freeze for up to 3 months."],"notes":["Feel free to add more spices like cumin, chili or paprika.","Can be made with ground turkey as well.","To defrost, simply place them directly in the microwave on medium power for 5 minutes. Alternatively, defrost them overnight in the fridge and air-fry for 3–4 minutes at 180°C (350°F).","Macros recomputed from our per-100g ingredient tables: 5694 kcal for the batch vs the book's 5410 kcal (whole recipe)."]},"lunch/ready-meals/sloppy-felus":{"id":"lunch/ready-meals/sloppy-felus","name":"Sloppy Felu's","meal":"lunch","servings":1,"calories":784,"protein":60,"carbs":81,"fat":24,"isBase":false,"description":"Sloppy Felu is the new Sloppy Joe! Single portion. 20 min. From The Felu Cookbook (p. 166).","ingredients":["- 2 wheat tortilla (20cm or 8inch) (≈90 g)","- 180 g ground beef 95/5","- ½ red bell pepper (75 g)","- 1 medium onion (50 g)","- 100 g tomatoes","- 1 clove of garlic (≈3 g)","- 30 g shredded mozzarella","- 50 g water","- 25 g soy sauce","- 15 g gochujang","- 150 g pumpkin puree","- 2 g oil"],"method":["Dice the onion. Chop up tomatoes and bell pepper into small pieces. Peel and grate garlic.","Place a bowl on a scale. Add in pumpkin puree, gochujang, soy sauce and water. Mix until smooth.","Heat up a pan (24cm/9,5inch) to medium heat and add in 2g of oil. Start with adding onions and bell pepper. Fry them for 3 minutes until they start caramelizing.","Add ground beef, switch up the heat to medium-high and keep frying the beef for 1-2 minutes. Separate the beef, so as much beef as possible gets in contact with the pan.","After the beef has some brown spots, add in the garlic and the tomatoes. Keep frying for another minute, pressing down the tomatoes, so they release their juices.","Add in the sauce and combine everything, around 1 minute longer.","Switch off the heat and add in mozzarella cheese. Combine everything so the cheese can melt.","Place 2 tortillas on a table. Distribute the meat equally on both tortillas. Clean the pan and place it back on the stove on medium-high heat.","Add 1 tortilla in and flip one side over the other to build a quesadilla. Repeat with the other tortilla, so both quesadillas are side by side in the pan. Add a small pinch salt on top of the quesadilla.","Flip after 30-60 seconds until both sides have a brown color. Done!"],"notes":["Use a big pan for this one, especially if you use 2 tortillas that will be cooked simultaneously at the end. Otherwise make 1 after the other.","Macros recomputed from our per-100g ingredient tables: 784 kcal for the portion vs the book's 767 kcal (whole recipe)."]},"lunch/ready-meals/slow-cooker-chicken-soup":{"id":"lunch/ready-meals/slow-cooker-chicken-soup","name":"Slow-cooker Chicken Soup","meal":"lunch","servings":4,"calories":638,"protein":37.9,"carbs":54.9,"fat":28.9,"isBase":false,"description":"Slow-cooked whole-chicken broth with carrots, celery and egg noodles. Makes 4 servings. Source: simplehomeedit.com. > Computed from the ingredient tables (~600 g consumed chicken meat & skin modeled from a whole bird, as in homemade-chicken-soup). Within the 700 kcal/serving ceiling.","ingredients":["- 1 tbsp (14 g) extra-virgin olive oil (Olive oil)","- 1 onion (~130 g), finely diced (Brown onion)","- 1 whole free-range chicken (~1.5 kg; ~600 g meat & skin consumed) (Whole chicken, raw (meat & skin))","- 2.5 litres water","- 3 tsp sea salt flakes (Salt)","- 2 celery stalks (~80 g), with leaves (Celery, raw)","- 4 carrots (~280 g), peeled and halved lengthways (Carrot)","- 250 g thin egg noodles (Egg noodles, dried (thin))","- ½ bunch flat-leaf parsley, roughly chopped (Parsley, fresh)","- Freshly cracked black pepper (Black pepper, ground)"],"method":["Sauté the onion in olive oil in the slow cooker (or a pan), then add to the cooker.","Add the whole chicken, water, salt, celery and carrots. Slow-cook on low ~6–8 h until tender.","Remove the chicken and vegetables; shred the meat and skim excess fat from the broth.","Return the meat to the broth with the egg noodles; cook until the noodles are tender.","Serve with parsley and black pepper."],"notes":["Macros modeled on ~600 g consumed chicken meat & skin (bones and most rendered fat skimmed), as in homemade-chicken-soup.md.","Computed 638 vs site's 427 kcal — driven by the full 250 g egg noodles plus the modeled 600 g chicken meat; verify portion sizes if tracking tightly (no swap/placeholder involved)."]},"lunch/ready-meals/spicy-bbq-burrito":{"id":"lunch/ready-meals/spicy-bbq-burrito","name":"Spicy BBQ burrito","meal":"lunch","servings":1,"calories":454,"protein":38,"carbs":46,"fat":13,"isBase":false,"description":"The korean style bbq burrito. Single portion. 15 min. From The Felu Cookbook (p. 105).","ingredients":["- 1 wheat tortilla (20cm or 8inch) (≈45 g)","- 120 g sirloin steak","- 1 medium onion (50 g)","- 100 g cabbage","- 20 g soy sauce","- 10 g gochujang","- 1 g cornstarch","- 5 g honey","- 25 g cream cheese","- 1 g garlic powder","- 4 g oil","- Black pepper"],"method":["Slice the beef into thin strips. Optional marinate it like in   // Compact synchronous SHA-256 (geraintluff, public domain) — hashes the shared
  // password in-browser so the plaintext never lives in the page source.
  function sha256(ascii) {
    function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
    var mathPow = Math.pow, maxWord = mathPow(2, 32), result = "", words = [];
    var asciiBitLength = ascii.length * 8;
    var hash = (sha256.h = sha256.h || []), k = (sha256.k = sha256.k || []);
    var primeCounter = k.length, isComposite = {};
    for (var candidate = 2; primeCounter < 64; candidate++) {
      if (!isComposite[candidate]) {
        for (var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
        hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
        k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
      }
    }
    ascii += "\x80";
    while ((ascii.length % 64) - 56) ascii += "\x00";
    for (i = 0; i < ascii.length; i++) {
      var j = ascii.charCodeAt(i);
      if (j >> 8) return;
      words[i >> 2] |= j << (((3 - i) % 4) * 8);
    }
    words[words.length] = (asciiBitLength / maxWord) | 0;
    words[words.length] = asciiBitLength;
    for (j = 0; j < words.length; ) {
      var w = words.slice(j, (j += 16)), oldHash = hash;
      hash = hash.slice(0, 8);
      for (i = 0; i < 64; i++) {
        var w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        var temp1 = hash[7]
          + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
          + ((e & hash[5]) ^ (~e & hash[6])) + k[i]
          + (w[i] = i < 16 ? w[i] : (w[i - 16]
              + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
              + w[i - 7]
              + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
        var temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
          + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(temp1 + temp2) | 0].concat(hash);
        hash[4] = (hash[4] + temp1) | 0;
      }
      for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
    }
    for (i = 0; i < 8; i++)
      for (j = 3; j + 1; j--) {
        var b = (hash[i] >> (j * 8)) & 255;
        result += (b < 16 ? 0 : "") + b.toString(16);
      }
    return result;
  }

  const DAY_FULL = { Mon: "Monday", Tue: "Tuesday", Wed: "Wednesday", Thu: "Thursday", Fri: "Friday", Sat: "Saturday", Sun: "Sunday" };
  const SLOT_LABEL = { breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner" };
  const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  // Fixed cooking cadence — used to label a freshly generated week.
  const CADENCE_NOTE = {
    "Mon:lunch": "L1 batch — Mon–Thu", "Tue:lunch": "L1 leftover", "Wed:lunch": "L1 leftover", "Thu:lunch": "L1 leftover",
    "Fri:lunch": "L2 batch — Fri–Sun", "Sat:lunch": "L2 leftover", "Sun:lunch": "L2 leftover",
    "Mon:dinner": "Dinner A — cook tonight", "Tue:dinner": "Dinner A leftover",
    "Thu:dinner": "Dinner B — cook tonight", "Fri:dinner": "Dinner B leftover",
    "Sat:dinner": "Dinner C — weekend cook", "Sun:dinner": "Dinner C leftover",
    "Sun:breakfast": "Sunday breakfast",
  };
  // Batch groups — the days that eat the same cook as leftovers. Swapping any one of
  // them re-picks the whole batch. Breakfast is unique per day; Wed dinner is takeaway (solo).
  const LUNCH_GROUPS = [["Mon", "Tue", "Wed", "Thu"], ["Fri", "Sat", "Sun"]];
  const DINNER_GROUPS = [["Mon", "Tue"], ["Thu", "Fri"], ["Sat", "Sun"]];
  function batchGroup(day, meal) {
    if (meal === "breakfast") return [day];
    const groups = meal === "lunch" ? LUNCH_GROUPS : DINNER_GROUPS;
    return groups.find((g) => g.includes(day)) || [day];
  }

  // ---------- utilities ----------
  const $ = (sel, el = document) => el.querySelector(sel);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (n) => {
    if (n == null || isNaN(n)) return "–";
    const r = Math.round(n * 10) / 10;
    return Number.isInteger(r) ? String(r) : r.toFixed(1);
  };
  const inline = (s) =>

  // ---------- state ----------
  const WEEK = DATA && DATA.meta ? DATA.meta.weekKey : "none";
  const STORE_KEY = "mealplan:" + WEEK;

  function loadOverrides() {

  // ---------- resolution ----------
  function planSlot(day, meal) {

  function planSide(day) {

  function resolve(day, meal, ovr) {

    if (o) return { recipe: DATA.recipes[o], note: CADENCE_NOTE[day + ":" + meal] || "" };
    const p = planSlot(day, meal);
    if (!p || p.takeaway) return { takeaway: true, label: p ? p.label : "—" };
    return { recipe: DATA.recipes[p.id], note: p.note };
  }
  function resolveSide(day, ovr) {
    ovr = ovr || overrides;

    // A day is exempt from the floors only while its dinner is still takeaway.

  function dayTotals(day, ovr, includeSide) {
    if (includeSide === undefined) includeSide = true;
    let t = { calories: 0, protein: 0, carbs: 0, fat: 0 };
    for (const meal of ["breakfast", "lunch", "dinner"]) {
      const r = resolve(day, meal, ovr);

  }
  // Floors are judged on the three MAIN meals alone — a side never clears them.
  const mainTotals = (day, ovr) => dayTotals(day, ovr, false);

  function alternatives(meal) {
    return Object.values(DATA.recipes)
      .filter((r) => r.meal === meal && !r.isBase)
      .sort((a, b) => (b.protein || 0) - (a.protein || 0));
  }

  // ---------- in-page week generator ----------
  // Re-picks the whole week from the embedded library, protein-first, respecting the
  // Mon–Sun cadence and the floors. A personal what-if: saved on this phone, doesn't
  // touch week-plan.md or the grocery list.
  const isWeekend = (r) => /crepe|pancake|waffle|french toast|shakshuka/i.test(r.name);
  function weightedPick(cands, exclude) {
    const pool = cands.filter((r) => !exclude || !exclude.has(r.id));
    const use = pool.length ? pool : cands;
    // Bias toward BOTH higher protein and higher calories (mains must reach 1,600 alone),
    // keeping randomness for variety.
    const w = use.map((r) => ((r.protein || 0) + 8) * ((r.calories || 0) + 150));
    let total = w.reduce((a, b) => a + b, 0), x = Math.random() * total;
    for (let i = 0; i < use.length; i++) { x -= w[i]; if (x <= 0) return use[i]; }

  }
  function buildCandidate() {

    const weekendBk = bk.filter(isWeekend).length ? bk.filter(isWeekend) : bk;
    // Once-a-month rule: avoid lunches/dinners used in the last 4 saved weeks.
    const avoid = recentUsedIds();
    const lp = alternatives("lunch").filter((r) => !avoid.has(r.id));
    const dp = alternatives("dinner").filter((r) => !avoid.has(r.id));
    const lunches = pickDistinct(lp.length >= 2 ? lp : alternatives("lunch"), 2);
    const dinners = pickDistinct(dp.length >= 3 ? dp : alternatives("dinner"), 3);
    const wk = pickDistinct(weekdayBk, Math.min(6, weekdayBk.length));
    const ovr = {};
    const set = (day, meal, id) => { (ovr[day] = ovr[day] || {})[meal] = id; };

    ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].forEach((d, i) => set(d, "breakfast", wk[i % wk.length].id));
    set("Sun", "breakfast", weightedPick(weekendBk).id);
    // Lunches: L1 Mon–Thu, L2 Fri–Sun.
    ["Mon", "Tue", "Wed", "Thu"].forEach((d) => set(d, "lunch", lunches[0].id));
    ["Fri", "Sat", "Sun"].forEach((d) => set(d, "lunch", lunches[1].id));
    // Dinners: A Mon+Tue, B Thu+Fri, C Sat+Sun. Wed left as takeaway.
    ["Mon", "Tue"].forEach((d) => set(d, "dinner", dinners[0].id));
    ["Thu", "Fri"].forEach((d) => set(d, "dinner", dinners[1].id));
    ["Sat", "Sun"].forEach((d) => set(d, "dinner", dinners[2].id));

  }
  function scoreWeek(ovr) {
    let score = 0;
    const seen = new Set();
    for (const day of DAYS) {
      if (isTakeawayDay(day, ovr)) continue;
      const t = mainTotals(day, ovr); // main meals only — the floor is on these
      // Reaching the 1,600 main-meal floor is the dominant goal.
      score += t.calories >= DATA.meta.floors.calories ? 20 : -(DATA.meta.floors.calories - t.calories) / 15;
      score += t.protein >= DATA.meta.floors.protein ? 12 : -(DATA.meta.floors.protein - t.protein);
      score -= Math.abs(t.protein - DATA.meta.targets.protein) * 0.12;
      score -= Math.abs(t.calories - DATA.meta.targets.calories) * 0.006;
    }
    // Reward distinct dinners across the week.
    for (const day of DAYS) { const r = resolve(day, "dinner", ovr); if (r.recipe) seen.add(r.recipe.id); }
    score += seen.size * 3;

  }
  function generateWeek() {
    let best = null, bestScore = -Infinity;

  }

  // ---------- saved-week log (phone history) ----------
  const LOG_KEY = "mealplan:log";
  function loadLog() { try { return JSON.parse(localStorage.getItem(LOG_KEY)) || []; } catch (e) { return []; } }
  function saveLog(l) { try { localStorage.setItem(LOG_KEY, JSON.stringify(l.slice(-12))); } catch (e) {} }
  // Lunch + dinner recipe ids used in the last 4 saved weeks (breakfasts exempt — pool too small).
  function recentUsedIds() {
    const ids = new Set();
    for (const w of loadLog().slice(-4))
      for (const d of w.plan.days) { if (d.lunch) ids.add(d.lunch); if (d.dinner) ids.add(d.dinner); }
    return ids;
  }
  function currentSnapshot() {
    return {
      days: DAYS.map((day) => {
        const o = { day };
        for (const m of ["breakfast", "lunch", "dinner"]) { const r = resolve(day, m); o[m] = r.recipe ? r.recipe.id : null; }
        return o;
      }),
    };
  }
  const rn = (id) => (DATA.recipes[id] ? DATA.recipes[id].name : "—");

  // ---------- grocery list (built in-browser, grouped by product) ----------
  const FRAC = { "¼": 0.25, "½": 0.5, "¾": 0.75, "⅓": 1 / 3, "⅔": 2 / 3, "⅛": 0.125, "⅜": 0.375, "⅝": 0.625, "⅞": 0.875 };
  function qnum(s) {
    s = String(s).trim();
    const m = s.match(/^(\d+)([¼½¾⅓⅔⅛⅜⅝⅞])$/); if (m) return (+m[1]) + FRAC[m[2]];
    if (FRAC[s] != null) return FRAC[s];
    if (/^\d+\s*\/\s*\d+$/.test(s)) { const [a, b] = s.split("/").map(Number); return a / b; }
    return parseFloat(s.replace(",", ".")) || 0;
  }
  const UNIT = /^(\d+[¼½¾⅓⅔⅛⅜⅝⅞]?|[¼½¾⅓⅔⅛⅜⅝⅞]|\d+(?:[.,]\d+)?|\d+\s*\/\s*\d+)\s*(kg|g|ml|l|tbsp|tbs|tsp|cups?|slices?|cloves?|cans?|tins?|bunch|sprigs?|handful|pinch|stalks?|leaves?|portions?)?\b/i;
  const G_SKIP = /quantities below|double the site|^serves\b/i;
  const G_PANTRY = /\b(bay leaf|bay|herb|salt|pepper|olive oil|\boil\b|paprika|oregano|thyme|rosemary|cumin|coriander|spice|seasoning|garlic powder|onion powder|sugar|flour|stock|bouillon|soy sauce|tamari|vinegar|mirin|sake|honey|maple|sesame|chilli flakes|cinnamon|mustard|tomato paste|sriracha|fish sauce|hoisin|cornflour|cornstarch|baking|water)\b/i;
  const G_WEIGHT = { onion: 110, tomato: 120, carrot: 80, celery: 40, cucumber: 200, zucchini: 200, potato: 170, capsicum: 120, eggplant: 250 };
  const G_KEEP = /\b(lemon|lime|avocado|banana|egg|pita|flatbread|tortilla|chilli|chile|spring onion|mussel)\b/;
  const G_STRIP = /\b(finely|freshly|roughly|thinly|coarsely|chopped|sliced|diced|minced|grated|julienned|shredded|halved|crushed|ground|cooked|raw|fresh|dried|light|boneless|skinless|large|medium|small|ripe|optional|split|whole|plus|beans?|leaves?|stalks?|cloves?|into|steaks?|fillets?|pieces?|portions?|trimmed|cut|scrubbed|bearded|shelled|thawed|drained|canned|rolled|extra|new|baby|unsalted|melted|softened|juiced|zested|picked)\b/gi;
  function gName(s) {
    let t = s.replace(/^_+|_+$/g, "").replace(/^\s*optional\s*:?\s*/i, "");
    t = t.replace(/\(see[^)]*\)/ig, "").replace(/\[[^\]]*\]\([^)]*\)/g, "").replace(/\([^)]*\)/g, "");
    t = t.replace(UNIT, "").replace(/^[\s\d¼½¾⅓⅔⅛⅜⅝⅞.,/x×-]+/i, "");
    t = t.replace(/\bto (serve|season|taste)\b.*/i, "").replace(/\s[—-]\s.*$/, "");
    return t.trim();
  }
  function gCanon(name) {
    let n = name.toLowerCase().replace(/[^\w\s\/-]/g, " ").replace(G_STRIP, "").replace(/\b(and|with|plus|the|for|of)\b/g, " ").replace(/\s+/g, " ").trim();
    if (/\bonion\b/.test(n) && !/powder|spring/.test(n)) n = "onion";
    else if (/\btomato/.test(n) && !/paste|passata|sun/.test(n)) n = "tomato";
    else if (/\bgarlic\b/.test(n) && !/powder/.test(n)) n = "garlic";
    else if (/chicken thigh/.test(n)) n = "chicken thigh";
    else if (/chicken breast/.test(n)) n = "chicken breast";
    else if (/greek yogurt/.test(n)) n = "greek yogurt light";
    else if (/mussel/.test(n)) n = "mussels";
    else if (/chilli|chile/.test(n) && !/flake/.test(n)) n = "chilli";
    n = n.replace(/\b(\w{3,}?)s\b/, (m, w) => (/ss$/.test(m) ? m : w));
    return n.trim();
  }
  const gRound = (n) => (Math.abs(n - Math.round(n)) < 0.05 ? String(Math.round(n)) : n.toFixed(1));
  const UNAME = { x: "", g: " g", ml: " ml", tbsp: " tbsp", tsp: " tsp", slice: " slices", clove: " cloves", can: " cans", bunch: " bunch", handful: " handful", sprig: " sprigs", pinch: " pinch" };
  function buildGrocery(snap) {
    const seen = new Set(), recipes = [];
    for (const d of snap.days) for (const m of ["breakfast", "lunch", "dinner"]) {
      const id = d[m]; if (id && !seen.has(id)) { seen.add(id); recipes.push(DATA.recipes[id]); }
    }
    const prod = new Map(), pantry = new Set();
    for (const r of recipes) for (const line of r.ingredients || []) {
      let s = line.trim().replace(/^[-*]\s*/, "");
      if (!s || /^\*\*.+\*\*:?$/.test(s) || /^#{1,6}\s/.test(line) || G_SKIP.test(s)) continue;
      const nm = gName(s), key = gCanon(nm);
      if (!key || key.length < 2) continue;
      if (G_PANTRY.test(key) || G_PANTRY.test(nm)) { pantry.add(key); continue; }
      const qm = s.match(UNIT);
      let qty = qm && qm[1] ? qnum(qm[1]) : null, unit = qm && qm[2] ? qm[2].toLowerCase() : "";
      if (unit === "kg") { qty *= 1000; unit = "g"; }
      if (unit === "l") { qty *= 1000; unit = "ml"; }
      if (unit === "tbs") unit = "tbsp";

      if (qty != null) {

  }
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
  function productLine(e) {
    const parts = Object.entries(e.units).filter(([u, v]) => u !== "some" && v)
      .map(([u, v]) => (u === "x" ? `${gRound(v)}×` : `${gRound(v)}${UNAME[u] || " " + u}`));

  }
  function groceryText(snap, g) {
    let t = `Grocery list — week of ${DATA.meta.generated}\n\n`;
    t += g.products.map((e) => "- " + productLine(e)).join("\n");
    if (g.pantry.length) t += "\n\nCheck you have (pantry):\n" + g.pantry.map((i) => "- " + cap(i)).join("\n");
    t += "\n\nPlan:\n" + snap.days.map((d) => `${d.day}: ${rn(d.breakfast)} / ${rn(d.lunch)} / ${d.dinner ? rn(d.dinner) : "takeaway"}`).join("\n");

  function download(name, text) {

  }

  function planEq(a, b) {

  function saveWeek() {
    if (isCurrentSaved()) { toast("This week is already saved"); return; }

  }
  function openGrocery() {
    const snap = currentSnapshot();
    const g = buildGrocery(snap);
    const list = g.products.length ? `<ul class="g-list">${g.products.map((e) => `<li>${esc(productLine(e))}</li>`).join("")}</ul>` : '<p class="desc">No ingredients found.</p>';
    const pantry = g.pantry.length ? `<div class="rsec-h">Check you have (pantry)</div><ul class="g-list g-misc">${g.pantry.map((i) => `<li>${esc(cap(i))}</li>`).join("")}</ul>` : "";
    const body = `
      <div class="sort-note">Grouped by product from this week's ${g.recipes.length} recipes (one batch each — 4 servings; scale for your household).</div>
      <div class="g-actions">

  }

  function openHistory() {
    const log = loadLog().slice().reverse();

      ? log.map((w) => `

            <div class="hist-date">Saved ${esc(w.savedAt)}</div>

      : `<p class="desc">No saved weeks yet. Tap <b>Save week</b> to start your history — saved lunches &amp; dinners then sit out for a month.</p>`;

  // ---------- render ----------
  function render() {
    const app = $("#app");

    const t = DATA.meta.targets;
    let html = `
      <header class="top">
        <div class="top-inner">

            <div class="eyebrow">Protein-first · this week</div>

    );
