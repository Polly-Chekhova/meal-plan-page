l the liquid has evaporated, around 2 minutes.","Add the beef & veggies back to the pan. Add in the sauce and keep stir-frying for 1 minute. Done!"],"notes":["Add a cornstarch slurry to thicken up the sauce.","Macros recomputed from our per-100g ingredient tables: 469 kcal for the portion vs the book's 386 kcal (whole recipe)."]},"dinner/ready-meals/shirataki-spicy-peanut-butter":{"id":"dinner/ready-meals/shirataki-spicy-peanut-butter","name":"Shirataki spicy peanut butter","meal":"dinner","servings":1,"calories":357,"protein":53,"carbs":24,"fat":8,"isBase":false,"description":"Peanut butter is highly underrated when added to savory dishes. This sauce is amazing! Single portion. 20 min. From The Felu Cookbook (p. 309).","ingredients":["- 200 g shirataki","- 1 chicken breast (180 g)","- 1 medium onion (50 g)","- 2 g oil","**Sauce:**","- 25 g soy sauce","- 10 g gochujang","- 13 g powdered peanuts","- 10 g rice vinegar","- 2 g sesame oil"],"method":["Remove shirataki from the package and rinse it under cold water for 30 seconds until the entire liquid is washed away. Let the shirataki sit in the sink until the end of the recipe.","Chop up the onion into bite-size pieces.","Cut the chicken breast into strips.","Add oil to a pan (24cm/9.5inch) on medium-high heat and fry chicken on one side for 1 minute.","Add the onions and flip the chicken and fry again for another 1-1:30 min until everything has color.","Remove the chicken and onion from the pan.","Add in the shirataki noodles, and dry fry them until the liquid has evaporated around 2 minutes.","Add in chicken and onion, and mix everything and add now the sauce.","Keep stir-frying for another minute, and you’re done!"],"notes":["Macros recomputed from our per-100g ingredient tables: 357 kcal for the portion vs the book's 364 kcal (whole recipe)."]},"dinner/ready-meals/shirataki-tuna":{"id":"dinner/ready-meals/shirataki-tuna","name":"Shirataki tuna","meal":"dinner","servings":1,"calories":293,"protein":42,"carbs":19,"fat":7,"isBase":false,"description":"A classic Italian tuna recipe and it is crazy high in protein too! Single portion. 20 min. From The Felu Cookbook (p. 305).","ingredients":["- 200 g shirataki","- 150 g canned tuna (no oil!)","- 250 g tomatoes","- 3 cloves of garlic (≈9 g)","- 100 g water","- 5 g oil","- Salt and black pepper"],"method":["Remove shirataki from the package and rinse it under cold water for 30 seconds until the entire liquid is washed away. Let the shirataki sit in the sink until the end of the recipe.","Peel and cut garlic into small pieces.","Add oil to a pan (24cm/9.5inch) on medium heat. Add garlic and let them fry for 20 seconds. Add tomatoes and water and close the lid.","Let the tomatoes cook for around 6 minutes until they start breaking and release their juices.","Add canned tuna and cook another 30 seconds. Add salt and pepper and stir everything.","Remove everything from the pan to a plate.","Add in the shirataki noodles, and dry fry them until liquid has evaporated, around 2 minutes.","Add the tomatoes tuna mix back to the pan and cook for 30 seconds until hot. Done!"],"notes":["Add Chili flakes for more heat.","Top with parsley or basil for some freshness.","Macros recomputed from our per-100g ingredient tables: 293 kcal for the portion vs the book's 275 kcal (whole recipe)."]},"dinner/ready-meals/shrimp-risotto":{"id":"dinner/ready-meals/shrimp-risotto","name":"Shrimp risotto","meal":"dinner","servings":1,"calories":578,"protein":57,"carbs":79,"fat":5,"isBase":false,"description":"Italian style risotto and thanks to the added shrimp, this is also full of protein. Single portion. 20 min. From The Felu Cookbook (p. 66).","ingredients":["- 200 g frozen shrimp","- 50 g raw rice","- 1 medium onion (50 g)","- 2 cloves of garlic (≈6 g)","- 10 g tomato puree","- 100 g crushed tomatoes","- 200 g water","- 10 g vegetable or fish broth powder","- 150 g peas","- 5 g fresh parsley","- 2 g oil","- Salt and black pepper"],"method":["Dice the onion. Add the water and broth powder to a glass and mix until combined.","Add oil to a pan on medium heat and add the onion. Fry them for around 3 minutes or until translucent.","Add the rice and fry for a further 2 minutes.","Add garlic and tomato puree and keep frying for about 20 seconds.","Add the crushed tomatoes, broth, and black pepper and mix everything well.","Close the lid and let it simmer for 12-15 minutes or until the rice is almost done.","Turn the heat to medium-high and add in the frozen prawns. Keep cooking for 2-3 minutes until the prawns are cooked, and the rice is done.","Add the peas at the very end and give everything a stir and keep cooking for another 30 seconds.","Turn the heat off, and add a bunch of parsley on top. Done!"],"notes":["I use Arborio rice for this recipe. If you use long-grain rice like Jasmine or Basmati, the cooking time will be reduced by a couple minutes.","You can also thaw the prawns overnight, so they cook faster, but it’s not necessary. I tend to always add them frozen.","Macros recomputed from our per-100g ingredient tables: 578 kcal for the portion vs the book's 593 kcal (whole recipe)."]},"dinner/ready-meals/slow-cooked-beef-ragu":{"id":"dinner/ready-meals/slow-cooked-beef-ragu","name":"Slow-cooked Beef Ragu","meal":"dinner","servings":4,"calories":411,"protein":33,"carbs":14,"fat":19,"isBase":false,"description":"Slow-cooked shredded beef chuck ragu. Originally 6 servings, scaled to 4. Serve over pasta (not included in macros).","ingredients":["- 1⅓ tbsp extra-virgin olive oil (Olive oil)","- 1⅓ brown onions, finely diced (~145 g) (Brown onion)","- 1⅓ large carrots, finely diced (~110 g) (Carrot)","- 1⅓ celery stalks, finely diced (~70 g) (Celery, raw)","- 1⅓ garlic cloves, chopped (~4 g) (Garlic, raw)","- 670 g beef chuck/braising steak, cubed (Beef chuck / braising steak, lean, raw)","- 85 ml dry red wine (Dry red wine)","- 85 g tomato paste (Tomato paste, canned)","- 470 ml tomato passata (Tomato passata)","- 330 ml beef stock (Beef stock / bouillon — Knorr-style)","- ⅔ tsp sea salt flakes (Salt)","- ⅓ tsp freshly cracked black pepper (Black pepper, ground)","- ⅔ tsp dried thyme (Thyme, dried)","- 1–2 bay leaves (Bay leaf, dried)","- Freshly grated Grana Padano, to serve (Grana Padano)"],"method":["Brown the beef in oil; set aside.","Soften onion, carrot, celery and garlic.","Deglaze with red wine; add tomato paste, passata, stock, seasoning, thyme and bay.","Return beef, cover and slow-cook ~3–4 h until it shreds. Shred and stir through sauce.","Serve over pasta with Grana Padano."],"notes":["Scaled from 6 servings to 4 (×2/3).","Pasta to serve not included in macros (add its kcal separately).","Parmesan swapped to Grana Padano (pantry rule)."]},"dinner/ready-meals/slow-cooked-traditional-goulash":{"id":"dinner/ready-meals/slow-cooked-traditional-goulash","name":"Slow-cooked Traditional Goulash","meal":"dinner","servings":4,"calories":406,"protein":32.8,"carbs":16.7,"fat":23.6,"isBase":false,"description":"Slow-cooked Hungarian-style beef goulash. Made with beef chuck (the recipe's beef option, chosen over the pork option). Serve over gnocchi/noodles/mash (not included in macros). Source: simplehomeedit.com. > Computed from the ingredient tables. Within the 700 kcal/serving ceiling.","ingredients":["- 600 g beef chuck/braising steak, cut into bite-sized pieces (Beef chuck / braising steak, lean, raw)","- ½ tsp sea salt flakes (Salt)","- ½ tsp freshly cracked black pepper (Black pepper, ground)","- 2 tbsp (28 g) olive oil (Olive oil)","- 2 large garlic cloves (~6 g), finely chopped (Garlic, raw)","- 2 onions (~260 g), roughly diced (Brown onion)","- 2 small carrots (~120 g), roughly diced (Carrot)","- 2 celery stalks (~80 g), roughly diced (Celery, raw)","- 2 tbsp (~14 g) sweet paprika (Sweet paprika)","- 1 tsp caraway seeds (optional)","- 2 tbsp (~32 g) tomato paste (Tomato paste, canned)","- 1½ tbsp (~12 g) plain flour (Plain (all-purpose) flour)","- 500 ml beef stock (Beef stock / bouillon — Knorr-style)","- 1 tbsp (~14 g) sour cream per serving, to serve (Sour cream)","- Finely chopped flat-leaf parsley, to garnish (Parsley, fresh)"],"method":["Season the beef with salt and pepper. Brown in olive oil in batches; set aside.","Soften the onion, carrot, celery and garlic. Stir in paprika and caraway.","Add tomato paste and flour, cook 1 min, then add beef stock and the beef.","Cover and slow-cook ~3–4 h until the beef is tender.","Serve over gnocchi/noodles/mash with a dollop of sour cream and parsley."],"notes":["Beef chuck used (the recipe's beef option) — pork option not used (pantry rule).","Sour cream included at ~1 tbsp (14 g) per serving.","Serving starch (gnocchi/noodles/mash) not included in macros."]},"dinner/ready-meals/slow-cooker-chicken-nachos":{"id":"dinner/ready-meals/slow-cooker-chicken-nachos","name":"Slow-cooker Chicken Nachos","meal":"dinner","servings":4,"calories":667,"protein":55.8,"carbs":52.6,"fat":26.3,"isBase":false,"description":"Slow-cooked Mexican shredded chicken over corn chips with melted cheese and a loaded corn topping. Scaled from the site's 6 servings to 4. Source: simplehomeedit.com. > Computed from the ingredient tables. Mexican cheese swapped for Mozzarella rallado (pantry rule). Within the 700 kcal/serving ceiling.","ingredients":["**Mexican chicken:**","- 667 g boneless, skinless chicken breast (Chicken breast (Hacendado))","- ⅔ onion (~87 g), finely diced (Brown onion)","- ~6 g (⅔ tbsp) minced garlic (Garlic, raw)","- ~21 g (1⅓ tbsp) tomato paste (Tomato paste, canned)","- 267 g canned diced tomatoes (Crushed tomatoes, canned)","- ~3 g (1⅓ tsp) ground cumin (Cumin, ground)","- ~3 g (1⅓ tsp) sweet paprika (Sweet paprika)","- ~2 g (⅔ tbsp) dried oregano (Oregano, dried)","- ~5 g (⅔ tbsp) onion powder (Onion powder)","- ~5 g (⅔ tbsp) garlic powder (Garlic powder)","- ~9 g (⅔ tbsp) brown sugar (Brown sugar)","- 1⅓ tsp sea salt flakes (Salt)","- ⅔ tsp black pepper (Black pepper, ground)","**Loaded corn topping:**","- 133 g corn kernels (Corn kernels (cooked/canned, drained))","- ⅔ lime, juiced and zested (Lime juice, fresh)","- 23 g crumbled feta (Feta (Hacendado))","- coriander leaves, finely chopped (Coriander (cilantro), fresh)","**Nachos:**","- 200 g corn chips (Corn chips (tortilla chips))","- 167 g shredded Mozzarella rallado (Mozzarella rallado (Hacendado))","- 40 g sour cream (Sour cream)","- 1 jalapeño, sliced (optional) (Jalapeño pepper, raw)"],"method":["Combine all the Mexican chicken ingredients in the slow cooker. Cook on low ~5–6 h, then shred.","Mix the corn topping ingredients.","Spread corn chips on a tray, top with shredded chicken and Mozzarella, and grill/bake until the cheese melts.","Top with the corn mixture, sour cream and jalapeño."],"notes":["Scaled from 6 servings to 4 (×2/3).","Mexican cheese → Mozzarella rallado. Optional chipotle in adobo omitted."]},"dinner/ready-meals/slow-cooker-chicken-satay":{"id":"dinner/ready-meals/slow-cooker-chicken-satay","name":"Slow-cooker Chicken Satay","meal":"dinner","servings":4,"calories":432,"protein":33.4,"carbs":18.2,"fat":26.3,"isBase":false,"description":"Slow-cooked peanut satay chicken thighs with onion, capsicum and green beans. Scaled from the site's 6 servings to 4. Serve over jasmine rice with crushed peanuts (not in macros). Source: simplehomeedit.com. > Computed from the ingredient tables. Optional red curry paste omitted. Within the 700 kcal/serving ceiling.","ingredients":["- 400 g boneless, skinless chicken thighs (Chicken thigh, boneless & skinless (Hacendado))","- ~4.4 g (⅔ tbsp) mild curry powder (Curry powder, mild)","- ~1.4 g (⅔ tsp) sweet paprika (Sweet paprika)","- ⅔ tsp sea salt flakes (Salt)","- ⅓ tsp freshly cracked black pepper (Black pepper, ground)","- 1⅓ tbsp (~18.6 g) olive oil (Olive oil)","- 1⅓ onions (~173 g), quartered (Brown onion)","- 1⅓ red capsicums (~200 g), bite-sized (Red capsicum (bell pepper), raw)","- 120 g green beans, trimmed and halved (Green beans)","- ~6.7 g (⅔ tbsp) minced ginger (Ginger, raw)","- ~6 g (⅔ tbsp) minced garlic (Garlic, raw)","- 83 g natural smooth peanut butter (Peanut butter, smooth)","- 1⅓ tbsp (~20 g) apple cider vinegar (Apple cider vinegar)","- 1⅓ tbsp (~21 g) soy sauce (Soy sauce (Kikkoman))","- ~9 g (⅔ tbsp) brown sugar (Brown sugar)","- 180 ml canned coconut milk (Coconut milk, canned)","**To serve (not in macros):** steamed jasmine rice, crushed peanuts."],"method":["Toss the chicken with curry powder, paprika, salt and pepper.","In the slow cooker, combine ginger, garlic, peanut butter, vinegar, soy sauce, brown sugar and coconut milk.","Add the chicken, onion, capsicum and green beans; stir to coat.","Slow-cook on low ~4–5 h until tender. Serve over jasmine rice with crushed peanuts."],"notes":["Scaled from 6 servings to 4 (×2/3).","Optional red curry paste omitted (branded/unvalued).","Rice and crushed peanuts to serve are excluded from macros."]},"dinner/ready-meals/speedy-satay-chicken":{"id":"dinner/ready-meals/speedy-satay-chicken","name":"Speedy Satay Chicken","meal":"dinner","servings":4,"calories":612,"protein":30.2,"carbs":15.4,"fat":49.5,"isBase":false,"description":"Quick minced-chicken satay in a coconut-peanut sauce. Serve over jasmine rice with cucumber, peanuts and coriander (not in macros). Source: simplehomeedit.com. > Computed from the ingredient tables. Dark soy → Soy sauce (Kikkoman). Within the 700 kcal/serving ceiling.","ingredients":["**Satay sauce:**","- 400 ml canned coconut milk (Coconut milk, canned)","- 125 ml chicken stock (Chicken stock (Knorr))","- 90 g natural smooth peanut butter (Peanut butter, smooth)","- 1 tbsp kecap manis (Kecap manis (sweet soy sauce))","- 1 tsp (~5 g) soy sauce (Soy sauce (Kikkoman))","**Chicken:**","- 2 tbsp (28 g) olive oil (Olive oil)","- 1 brown onion (~130 g), finely diced (Brown onion)","- 1 tbsp (9 g) minced garlic (Garlic, raw)","- 500 g minced (ground) chicken (Minced (ground) chicken, raw)","- 1 tbsp (~6.5 g) mild curry powder (Curry powder, mild)","- ½ tsp ground turmeric (Turmeric, ground)","- 1 tsp sweet paprika (Sweet paprika)","- 1 tsp (4 g) white sugar (Sugar, white/caster (granulated))","- ½ tsp sea salt flakes (Salt)","**To serve (not in macros):** steamed jasmine rice, sliced cucumber, red onion, crushed peanuts, coriander, lime."],"method":["Brown the minced chicken with onion and garlic in the oil; stir in the spices, sugar and salt.","Add the coconut milk, stock, peanut butter, kecap manis and soy sauce; simmer until thick.","Serve over rice with cucumber, peanuts and coriander."],"notes":["Dark soy → Soy sauce (Kikkoman) (pantry rule).","Fat is high (coconut-milk-driven) but within the 700 kcal/serving ceiling."]},"dinner/ready-meals/spicy-beef-nachos":{"id":"dinner/ready-meals/spicy-beef-nachos","name":"Spicy beef & nachos","meal":"dinner","servings":1,"calories":620,"protein":51,"carbs":62,"fat":17,"isBase":false,"description":"Make some nachos with spicy beef to enjoy the next time you have a movie night in! Single portion. 20 min. From The Felu Cookbook (p. 144).","ingredients":["- 180 g ground beef 95/5","- 2 wheat tortillas (20cm or 8inch) (≈90 g)","- 1 medium onion (50 g)","- 15 g gochujang","- 100 g tomatoes","- 25 g soy sauce","- 2 g oil","- Black pepper"],"method":["Dice the onion. Chop up tomatoes into bite-size pieces. Add soy sauce and Gochujang into a small glass and combine with a spoon until smooth. Pre-heat oven to 180°C or 350°F. Cut tortillas into nacho shapes and lay them on top of aluminium foil on a baking sheet. Don’t bake them just yet.","Heat up a pan (24cm/9,5inch) to medium heat, add oil and start with frying the onions for 2-3 minutes.","Switch the heat to medium-high and add in the beef. Keep frying for another 2 minutes. Try to separate the beef with a spatula, so as much beef as possible gets in contact with the pan.","Flip the beef and keep frying for another minute and then add in the tomatoes.","Keep frying the tomatoes for another minute.","Add the sauce to the pan and combine everything. Switch off the heat, close the lid and just let it sit there until the nachos are done.","Add the nachos into the oven and bake them for 4-5 minutes until they just start to become brown.","Remove the nachos and add them to a plate. Top them with the beef. Done!"],"notes":["Be careful not to overbake the nachos. They can become dry because there is no fat in them.","Macros recomputed from our per-100g ingredient tables: 620 kcal for the portion vs the book's 617 kcal (whole recipe)."]},"dinner/ready-meals/spicy-mac-n-cheese":{"id":"dinner/ready-meals/spicy-mac-n-cheese","name":"Spicy mac n cheese","meal":"dinner","servings":1,"calories":606,"protein":31,"carbs":90,"fat":13,"isBase":false,"description":"The ultimate comfort dish but this time spicy and with a lot of protein! Single portion. 15 min. From The Felu Cookbook (p. 78).","ingredients":["- 100 g dry pasta","- 60 g fresh mozzarella light","- 1 slice american cheese (≈19 g)","- 15 g gochujang","- 50 g evaporated milk","- Salt and black pepper"],"method":["Cut the american cheese and mozzarella into small pieces.","Add evaporated milk and gochujang to a glass and mix until smooth.","Add the pasta to a cold pan (I use a 24cm or 9,5 inch pan). Place the pan on top of your stove and cover it with cold water until the pasta is covered. This should take around 500 g.","Add a small pinch of salt.","Switch the heat to high and immediately start stirring the pasta every 20 seconds for the first 2 minutes.","Once the water is boiling, turn the heat to medium-high and cook pasta al dente.","In the pan should be a bit of pasta water left. You can remove most of it in a separate glass. But don’t throw it away yet!","Add in the pan the cheese and gochujang and turn the heat to low. Slowly let everything melt into a thick cheese sauce. Add the pasta water back to the pan if it’s too thick. Keep slowly cooking for 2 minutes until fully melted. Done!"],"notes":["This pasta technique can be used for every pasta dish you make. The pasta water will be highly concentrated in starch, which will make every sauce better.","You can add garlic and onion powder to the sauce for more flavor.","Macros recomputed from our per-100g ingredient tables: 606 kcal for the portion vs the book's 584 kcal (whole recipe)."]},"dinner/ready-meals/spicy-udons":{"id":"dinner/ready-meals/spicy-udons","name":"Spicy udons","meal":"dinner","servings":1,"calories":647,"protein":52,"carbs":73,"fat":16,"isBase":false,"description":"Udon noodles are some of the most satisfying noodles to eat. Single portion. 15 min. From The Felu Cookbook (p. 94).","ingredients":["- 200 g udon noodles","- 180 g ground beef 95/5","- 1 pak choi (150 g)","- 1 medium onion (50 g)","- 1 g cumin","- 1 g garlic powder","- 5 g oil","- Salt and black pepper","**Sauce:**","- 20 g Greek yogurt light (Hacendado)","- 5 g honey","- 10 g gochujang"],"method":["Chop the onion and pak choi. Add all the sauce ingredients into a small bowl and mix until smooth.","Fill a pot with water and turn the heat to high. As soon as the water starts to boil, add the noodles, give them a gentle shake, and let them cook for 3 minutes. Then drain the water and let the noodles sit in the sink.","Add oil to a pan (24 cm/9.5 inches) and fry the vegetables with a pinch of salt for 3 minutes.","Push the vegetables to the side, add a bit more oil, and add the beef. Try to separate the beef with a spatula for maximum browning.","Add the seasonings and flip the meat. After 1 minute, give everything a good stir and add the noodles.","Remove the pan from the heat, add the sauce, and give everything a final stir. Done!"],"notes":["Macros recomputed from our per-100g ingredient tables: 647 kcal for the portion vs the book's 663 kcal (whole recipe).","Light mayo swapped for Greek yogurt light (Hacendado) — house rule; the macros below already reflect the swap. Stir it in off the heat so it does not split."]},"dinner/ready-meals/steak-potato-bowl":{"id":"dinner/ready-meals/steak-potato-bowl","name":"Steak & potato bowl","meal":"dinner","servings":1,"calories":686,"protein":55,"carbs":62,"fat":26,"isBase":false,"description":"Steak bites in a bowl are delicious. Single portion. 20 min. From The Felu Cookbook (p. 62).","ingredients":["- 180 g top sirloin","- 250 g peeled potatoes","- 1/2 bell pepper (75 g)","- 100 g tomatoes","- 1/2 avocado (60 g)","- 50 g 0.2 % fat cream cheese","- 1/2 lime juice (≈15 g)","- 8 g oil","- 1 g garlic powder","- 0.5 g cayenne pepper","- Salt and black pepper"],"method":["Slice the meat into strips and then into bite-sized pieces. Dice the tomatoes and bell pepper.","Place the peeled potatoes into a container and microwave them at 600W for 5 minutes.","In the meantime, halve the avocado and scoop out half of the fruit into a bowl with a pinch of salt and lime juice. Mash it with a fork, then add the cream cheese and stir to combine. Now add the pepper and tomato and stir again.","Heat a pan over medium heat, add 6g of oil, and add the microwaved potatoes with a strong pinch of salt. Stir-fry for 5 minutes.","Push the potatoes to the side of the pan, add another 2g of oil, and add the beef with another pinch of salt. Stir-fry the beef for 1 minute on each side.","At the very end, add black pepper, garlic powder, and cayenne pepper, and give everything a good stir. Done!","Plate everything into a bowl and enjoy."],"notes":["Can be made with chicken breast instead.","Macros recomputed from our per-100g ingredient tables: 686 kcal for the portion vs the book's 688 kcal (whole recipe)."]},"dinner/ready-meals/sticky-bbq-meatballs":{"id":"dinner/ready-meals/sticky-bbq-meatballs","name":"Sticky BBQ Meatballs","meal":"dinner","servings":4,"calories":415,"protein":20.1,"carbs":27.4,"fat":24.2,"isBase":false,"description":"Baked beef meatballs in a sticky BBQ glaze. Scaled from the site's 5 servings to 4. Serve over jasmine rice (not in macros). Source: simplehomeedit.com. > Computed from the ingredient tables. Worcestershire sauce dropped (pantry rule). Within the 700 kcal/serving ceiling.","ingredients":["**Meatballs:**","- 400 g minced (ground) beef (Minced (ground) beef, 85% lean / 15% fat, raw)","- 24 g panko breadcrumbs (Panko breadcrumbs)","- ~40 g (0.8 egg) egg (XL eggs (Hacendado))","- ~32 g brown onion, finely grated (Brown onion)","- ~5 g (1.6 tsp) minced garlic (Garlic, raw)","- ~2 g (0.8 tsp) onion powder (Onion powder)","- ~1.8 g (0.8 tsp) sweet paprika (Sweet paprika)","- 0.8 tsp sea salt flakes (Salt)","- ⅓ tsp black pepper (Black pepper, ground)","- ~11 g (0.8 tbsp) olive oil (Olive oil)","**Sticky BBQ glaze:**","- 100 g ketchup (Tomato ketchup)","- 44 g brown sugar (Brown sugar)","- ~17 g (0.8 tbsp) honey (Honey (BM))","- ~26 g (1.6 tbsp) soy sauce (Soy sauce (Kikkoman))","- ~2.4 g (0.8 tsp) minced garlic (Garlic, raw)","- ~5 g (0.8 tsp) sweet paprika (Sweet paprika)","- ~12 g (0.8 tbsp) apple cider vinegar (Apple cider vinegar)","- 50 ml water","**To serve (not in macros):** steamed jasmine rice, sliced spring onions."],"method":["Mix the meatball ingredients and roll into balls. Bake or pan-fry until browned and cooked.","Simmer the glaze ingredients until thickened.","Toss the meatballs in the glaze. Serve over rice with spring onions."],"notes":["Scaled from 5 servings to 4 (×4/5).","Worcestershire sauce dropped (pantry rule).","Protein is ~20 g/serving — pair with a protein-forward side if used on a high-protein day."]},"dinner/ready-meals/sticky-hoisin-beef":{"id":"dinner/ready-meals/sticky-hoisin-beef","name":"Sticky Hoisin Beef","meal":"dinner","servings":4,"calories":696,"protein":28.9,"carbs":60.2,"fat":36.6,"isBase":false,"description":"Hoisin-glazed beef mince stir-fry with flat rice noodles, carrot and wombok. Serves 4.","ingredients":["- 200 g wide flat rice noodles (Rice noodles, flat/thick, dried)","- 1 tsp sesame oil, for noodles (Sesame oil)","- 1 tbsp extra-virgin olive oil (Olive oil)","- 1 tbsp freshly minced garlic (Garlic, raw)","- 2 spring onions, sliced (Spring onion)","- 500 g minced beef (Minced beef, 85% lean)","- 1 carrot, julienned (Carrot)","- ½ wombok cabbage, shredded (Wombok)","- 60 ml hoisin sauce (Hoisin sauce)","- 1 tbsp tamari or soy sauce (Tamari)","- 1 tbsp dark soy sauce (Soy sauce, Kikkoman)","- 1 tbsp rice wine vinegar (Rice wine vinegar, Otafuku)","- 1 tbsp brown sugar (Brown sugar)","- 1 tsp sesame oil (Sesame oil)","- 40 g crushed roasted peanuts (Peanuts, roasted)","- Lime wedges, to serve"],"method":["Cook rice noodles per packet, drain and toss with 1 tsp sesame oil.","Heat olive oil in a wok over high heat. Add garlic and white parts of spring onion, stir 30 seconds.","Add beef mince and brown, breaking it up.","Add carrot and wombok, stir-fry until softened.","Stir together the sauce ingredients, pour in and toss. Add noodles and toss until glossy.","Serve topped with peanuts, green spring onion and lime wedges."],"notes":[]},"dinner/ready-meals/sticky-soy-chicken-wings":{"id":"dinner/ready-meals/sticky-soy-chicken-wings","name":"Sticky Soy Chicken Wings","meal":"dinner","servings":4,"calories":553,"protein":39,"carbs":13,"fat":38,"isBase":false,"description":"Oven-baked sticky soy-and-ketchup chicken wings with a quick sesame cucumber pickle. Serves 4 (jasmine rice optional, not counted).","ingredients":["**Cucumber pickle:**","- 1 tbsp rice wine vinegar (Rice wine vinegar, Otafuku)","- 1 tbsp caster sugar (Sugar, white/caster)","- 1 tbsp sesame oil (Sesame oil)","- 1 tsp freshly minced ginger (Ginger, raw)","- 2 short cucumbers, chunked (Cucumber)","**Chicken wings:**","- 1.2 kg chicken wings (Chicken wings, raw — see Notes on bone weight)","- 2 garlic cloves, minced (Garlic, raw)","- 70 g tomato ketchup (Tomato ketchup)","- 80 ml tamari or soy sauce (Tamari)","- 1 tbsp sesame oil (Sesame oil)","- 1 tbsp rice wine vinegar (Rice wine vinegar, Otafuku)","- 60 ml water","- Sesame seeds and sliced spring onion, to garnish","- Steamed jasmine rice, optional (not counted)"],"method":["Whisk pickle vinegar, sugar, sesame oil and ginger; toss through cucumber and chill.","Toss wings with garlic, ketchup, tamari, sesame oil, vinegar and water.","Bake at 200°C for 40–45 minutes, turning once, until sticky and cooked through.","Garnish with sesame seeds and spring onion. Serve with the cucumber pickle (and rice if using)."],"notes":["1.2 kg is the bone-in gross weight; macros are computed on ~780 g edible meat & skin (~65%), which lands close to the site's per-serving figure. Chilli oil and bird's-eye chilli (optional) omitted."]},"dinner/ready-meals/stuffed-crust-pizza":{"id":"dinner/ready-meals/stuffed-crust-pizza","name":"Stuffed crust pizza","meal":"dinner","servings":1,"calories":675,"protein":44,"carbs":72,"fat":23,"isBase":false,"description":"Turn the 2 ingredient dough into a stuffed crust pizza! Single portion. 20 min. From The Felu Cookbook (p. 69).","ingredients":["- 80 g flour","- 80 g skyr or 0.2% fat greek yogurt","- 20 g shredded mozzarella","- 4 cheese sticks (80 g)","- 60 g storebought tomato sauce","- 1 g oregano","- 1/4 tsp baking powder (1 g)","- 2 g oil","- Salt and black pepper"],"method":["Start by combining flour, baking powder, and salt in a bowl. Then add skyr and mix everything with your hands until you form a dough ball. You will likely need to knead the dough for 2 minutes. Then set it aside","Cut 3 cheese sticks into 2 cm or 1-inch pieces. Finely chop the 4th cheese stick.","Take a baking sheet, spray some oil on it, and spread the oil with your hands. Place the dough ball on the sheet and slowly press it down to form a round pizza shape.","Lay the larger cheese stick pieces around the edges, leaving a bit of space between them. Roll the edges of the dough towards the center over the cheese sticks to form a stuffed crust.","Add tomato sauce to the middle of the dough, and season with salt, black pepper, and oregano. Then add the finely chopped 4th cheese stick and the shredded mozzarella.","Bake in the oven at 220°C or 420°F for 15-20 minutes. Done!"],"notes":["You can change up the toppings and use tuna with onions or a vegetabrian pizza for more volume!","Macros recomputed from our per-100g ingredient tables: 675 kcal for the portion vs the book's 685 kcal (whole recipe)."]},"dinner/ready-meals/stuffed-peppers":{"id":"dinner/ready-meals/stuffed-peppers","name":"Stuffed peppers","meal":"dinner","servings":1,"calories":617,"protein":70,"carbs":45,"fat":17,"isBase":false,"description":"Stuffed bell peppers are great for meal prep and also very easy to make. Single portion. 35 min. From The Felu Cookbook (p. 128).","ingredients":["- 2 medium to large bell peppers (≈300 g)","- 200 g ground beef 95/5","- 50 g egg whites","- 50 g buttermilk","- 1 medium onion (50 g)","- 2 cloves of garlic (≈6 g)","- 1 slice sandwich bread (≈30 g)","- 30 g gouda fat reduced","- 5 g dry gelatine","- 2 g paprika","- 2 g cayenne pepper","- Salt and black pepper"],"method":["Dice the onion, peel, and grate the garlic. Cut peppers in halves and remove the inner core, so they look like a halved boat. Add buttermilk with gelatine into a glass and mix.","Cut the slice of bread into small cubes.","Preheat oven to 180°C or 350°F.","Place a bowl on a scale.","Add in beef, onions, garlic, bread, buttermilk, egg white, gouda cheese, and seasoning.","Mix everything with your hand until you have a giant meatball.","Stuff all four pepper boats with meat and add them to a baking dish.","Bake them in the oven for 25 - 35 minutes. Done!"],"notes":["You can add more seasonings like cumin or paprika.","You can make more and meal prep them. They last in the fridge for 2-3 days.","Macros recomputed from our per-100g ingredient tables: 617 kcal for the portion vs the book's 600 kcal (whole recipe)."]},"dinner/ready-meals/sweet-chilli-chicken-stir-fry":{"id":"dinner/ready-meals/sweet-chilli-chicken-stir-fry","name":"Sweet Chilli Chicken Stir-fry","meal":"dinner","servings":4,"calories":269,"protein":39,"carbs":17,"fat":5,"isBase":false,"description":"Quick chicken-and-veg stir-fry in a tamari and sweet chilli sauce. Serves 4 (steamed rice served alongside, not counted in totals).","ingredients":["- 1 tbsp olive oil (Olive oil)","- 1 tbsp freshly minced garlic (Garlic, raw)","- 1 tbsp freshly minced ginger (Ginger, raw)","- 600 g boneless skinless chicken breast, bite-sized (Chicken breast, Hacendado)","- 60 ml tamari or soy sauce (Tamari)","- 80 ml sweet chilli sauce (Sweet chilli sauce, Hacendado)","- 60 g broccoli florets (Broccolini)","- 1 red capsicum, sliced (Red capsicum, raw)","- 1 red onion, quartered (Red onion)","- Steamed rice, to serve (not counted)","- Sliced spring onion, to serve (Spring onion)"],"method":["Heat olive oil in a wok over high heat. Add garlic and ginger, stir 30 seconds.","Add chicken and stir-fry until golden and cooked through.","Add capsicum and onion, stir-fry 2–3 minutes until just tender.","Pour in tamari and sweet chilli sauce, add broccoli, and toss until glossy and coated.","Serve over steamed rice, topped with spring onion."],"notes":["Steamed rice is served alongside but not included in the per-serving totals (quantity not specified by the recipe)."]},"dinner/ready-meals/sweet-sour-chicken":{"id":"dinner/ready-meals/sweet-sour-chicken","name":"Sweet & sour chicken","meal":"dinner","servings":1,"calories":597,"protein":56,"carbs":81,"fat":6,"isBase":false,"description":"The classic chinese dish but packed with protein! Single portion. 20 min. From The Felu Cookbook (p. 75).","ingredients":["- 180 g skinless, boneless chicken thighs","- 60 g raw rice","- 2 cloves of garlic (≈6 g)","- 1 piece of fresh ginger (thumb size) (≈10 g)","- 1 medium onion (50 g)","- 1 red bell pepper (150 g)","- 20 g soy sauce","- 50 g juice of canned pineapple","- 15 g ketchup","- 15 g rice vinegar","- 2 g cornstarch","- 2 g oil","- 1 g garlic powder","- Salt and black pepper"],"method":["Start by adding rice and 125g of water to a pot with a pinch of salt.","Put the stove on high heat, and as soon as the water starts to boil, turn the heat down to low, close the lid and let it simmer for 12-15 min.","Cut the chicken thighs into large pieces and season with salt, black pepper, and garlic powder","Chop the onion and bell pepper. Peel and grate the garlic and ginger.","Heat oil in a pan over medium-high heat and fry the chicken for 1 minute on each side to add some color.","Add the onion and bell pepper, frying for 3 minutes until the onion starts to caramelize.","Add the garlic and ginger, mixing everything well. Continue to fry for another 20 seconds.","Now, add the sauce and stir for 30 seconds until it thickens. To serve, plate the rice and top it with the sweet & sour chicken. Enjoy!"],"notes":["Add gochujang to the sauce for some heat.","You can add 50g of canned pineapple to the finished dish. That tastes great here.","Macros recomputed from our per-100g ingredient tables: 597 kcal for the portion vs the book's 643 kcal (whole recipe)."]},"dinner/ready-meals/tempeh-curry-vegan":{"id":"dinner/ready-meals/tempeh-curry-vegan","name":"Tempeh curry (vegan)","meal":"dinner","servings":1,"calories":628,"protein":38,"carbs":46,"fat":39,"isBase":false,"description":"Who said that vegan food isn‘t delicious? Single portion. 20 min. From The Felu Cookbook (p. 171).","ingredients":["- 150 g tempeh","- 1 eggplant (300 g)","- 1 medium onion (50 g)","- 50 g coconut cream","- 100 g water","- 1 clove of garlic (≈3 g)","- 2 g paprika","- 2 g turmeric","- 1 g chili powder","- 1 g cumin","- 5 g tomato puree","- 5 g vegetable stock powder","- 4 g oil","- 1 piece of ginger (10 g)","- Salt and black pepper"],"method":["Clean and slice the eggplant into even slices. Lay them on a wire rack and sprinkle salt on both sides. Let them sit for at least 30 minutes or up to 6 hours to remove any bitterness.","Cut the tempeh into bite-size cubes. Peel and grate the garlic and ginger, and chop up the onion.","Mix the stock powder with 50g of water in a glass until well combined. Do the same with the coconut cream and water in another glass.","Cut the marinated eggplant into cubes.","Heat up a pan over medium heat, add some oil, and fry the tempeh cubes for 1-2 minutes until they turn golden brown. Then remove them from the pan.","Add the cubed eggplant with a splash of water to the same pan and fry for 3-5 minutes, stirring occasionally until they start to collapse.","Add some more oil to the pan and add in the chopped onion, frying everything for 3-4 minutes.","Now add in the grated ginger and garlic, tomato puree, turmeric, paprika, chili powder, cumin, and black pepper. Mix everything together so that the spices get toasted for 30 seconds.","Add the broth and the coconut milk. As soon as everything starts to boil, reduce the heat to medium-low, add the tempeh back to the pan and let it simmer for 8-10 minutes. Done!"],"notes":["Taste great with rice. 50g raw rice will add another 175 calories.","Can also be made with plain tofu. The process remains the same.","Top the dish with fresh cilantro.","Macros recomputed from our per-100g ingredient tables: 628 kcal for the portion vs the book's 488 kcal (whole recipe)."]},"dinner/ready-meals/texas-style-beef-rice":{"id":"dinner/ready-meals/texas-style-beef-rice","name":"Texas-style beef & rice","meal":"dinner","servings":1,"calories":559,"protein":48,"carbs":55,"fat":16,"isBase":false,"description":"Texas spices combined and added on top of a speedy beef & rice meal. Single portion. 15 min. From The Felu Cookbook (p. 159).","ingredients":["- 180 g ground beef 95/5","- 1 medium onion (50 g)","- 100 g tomatoes","- ½ red bell pepper (75 g)","- 125 g cooked white rice (basmati)","- 2 laughing cow wedges (≈34 g)","- 50 g water","- 2 g smoked paprika","- 2 g garlic powder","- 2 g onion powder","- 1 g cayenne pepper","- 2 g oil","- Salt and black pepper"],"method":["Dice onion and pepper into small pieces. Cut tomatoes into smaller pieces.","Add all spices into a glass and mix until combined.","Add oil into a pan (24cm/9,5inch) on medium heat and add onion and peppers. Fry them for 3-4 minutes under occasional stirring.","Push vegetables to the side, switch up the heat to medium-high and add beef. Spread it with a spatula, so as much meat as possible comes in contact with the pan. Fry the beef for 1 minute.","Add spices and tomatoes and stir everything. Add a splash of water. Let everything cook for one more minute, and press down the tomatoes occasionally so they release their juices.","Add laughing cow wedges and spread them by pressing them down until they are fully incorporated.","Add cooked rice with another splash of water and stir everything until the rice is hot and incorporated into the meat and vegetable mixture. Done!"],"notes":["Carrots can be added to this recipe as well at the beginning with the onion and peppers.","You can also make 60 g of raw rice instead instant.","Instant rice swapped for plain cooked white rice (125 g cooked ≈ 40 g raw).","Macros recomputed from our per-100g ingredient tables: 559 kcal for the portion vs the book's 561 kcal (whole recipe)."]},"dinner/ready-meals/udon-with-pb2":{"id":"dinner/ready-meals/udon-with-pb2","name":"Udon with PB2","meal":"dinner","servings":1,"calories":581,"protein":60,"carbs":71,"fat":7,"isBase":false,"description":"Not enough people try to add peanut butter to savory meals. You will be amazed how good it actually taste. Single portion. 15 min. From The Felu Cookbook (p. 93).","ingredients":["- 200 g udon noodles","- 1 chicken breast (180 g)","- 1 medium onion (50 g)","- 2 g oil","**Sauce:**","- 20 g soy sauce","- 10 g rice vinegar","- 10 g mirin","- 13 g powdered peanuts","- 30 g water"],"method":["Chop up the onion and cut the chicken into strips.","Add all sauce ingredients into a small bowl and mix until smooth.","Fill up a pot with water and turn on the heat on high.","Add oil to a pan (24cm/9,5inch) and fry the chicken on one side for 60 seconds on medium-high.","After a minute, add onion to the pan and flip the chicken. Add a pinch of salt and pepper. Add udon noodles to the pot that should be boiling by now.","Add the sauce to the pan with chicken and stir on medium-low heat until the Udon noodles are ready. 2-3 minutes.","Transfer the Udon noodles to a pan and mix everything. Done!"],"notes":["The sauce can be changed as long as you stick with East Asian style ingredients. Try to experiment with hoisin or gochujang.","Macros recomputed from our per-100g ingredient tables: 581 kcal for the portion vs the book's 604 kcal (whole recipe)."]},"lunch/base/bagels":{"id":"lunch/base/bagels","name":"Bagels","meal":"lunch","servings":6,"calories":247,"protein":12,"carbs":40,"fat":4,"isBase":true,"description":"Never buy bagels again. Whole 1 bagel:. Makes 6. 30 min. From The Felu Cookbook (p. 112).","ingredients":["- 300 g all purpose flour","- 300 g 1 % fat cottage cheese","- 1 egg (≈55 g)","- 10 g olive oil","- 4.5 g baking powder","- Salt"],"method":["Preheat the oven to 210°C or 410°F.","Add cottage cheese into a blender and mix on high for 60 seconds.","In a bowl, add the flour, salt, and baking powder and whisk. Then add the cottage cheese and olive oil, and use your hands to start kneading the mixture until it forms a dough ball.","Place the dough on your cutting board and roll it out into a thick tube shape. Then slice it into 6 equal-sized pieces.","Add a little bit of oil to a sheet pan and spread it out with your hand.","Take one piece of bagel dough at a time, poke a hole in the center with your fingers, and place it on the sheet pan. Repeat with all pieces.","Crack the egg into a bowl. Using a brush, spread it on top of all 6 bagels, this is called an egg wash.","Add bagel seasoning on top of all bagels.","Bake the bagels in the oven for 15–20 minutes. Done!"],"notes":["You can make your own bagel seasoning by combining white and black sesame seeds with garlic powder and mixing.","Macros recomputed from our per-100g ingredient tables: 1481 kcal for the batch vs the book's 228 kcal (per serving)."]},"lunch/base/baked-chicken-breast-base":{"id":"lunch/base/baked-chicken-breast-base","name":"Baked chicken breast base (batch)","meal":"lunch","servings":4,"calories":177,"protein":30.6,"carbs":3.5,"fat":5.3,"isBase":true,"description":"Air-fried seasoned chicken breast. Batch of 500g raw → 4 portions (~125g raw / ~95g cooked each). A plain protein base for bowls, salads, wraps or alongside rice/veg.","ingredients":["- 500g chicken breast (Hacendado)","- 1 tbsp (~7g) sweet paprika","- 1 tbsp (~7g) chicken spices / seasoning blend","- 1 tsp sea salt flakes","- 1 tbsp (~6g) black pepper, ground","- 1 tbsp (14g) olive oil"],"method":["Mix the paprika, chicken spices, salt, pepper and olive oil into a paste.","Rub it all over the chicken breasts to coat.","Air fry at 180°C for 20 min, then turn up to 200°C for a further 10 min, until cooked through (74°C internal) and golden.","Rest a few minutes, then slice. Divide into 4 portions."],"notes":["Lean base: ~30g protein and only ~5g fat per portion. Filed under lunch, but it works as a dinner protein too — say the word and I'll move it.","1 tbsp black pepper makes it quite peppery — drop to 1 tsp if you prefer it milder.","Cooked weight is ~95g/portion (breast loses ~25% water); the macros are off the 125g raw, which is what counts for tracking."]},"lunch/base/taco-meat":{"id":"lunch/base/taco-meat","name":"Taco meat","meal":"lunch","servings":2,"calories":367,"protein":46,"carbs":16,"fat":13,"isBase":true,"description":"Having taco meat in the fridge is an easy way to make yourself a speedy high protein meal. Makes 2. 15 min. From The Felu Cookbook (p. 261).","ingredients":["- 400 g ground beef 95/5","- 1 large onion (100 g)","- 200 g tomato sauce","- 15 g tomato puree","- 3 g garlic powder","- 3 g paprika","- 1.5 g oregano","- 1 g chili powder","- 1 g cumin","- 4 g oil","- Salt and black pepper"],"method":["Dice onion and prepare other ingredients.","Preheat a pan (28cm or 11 inches) over medium heat and add oil. Start by fry - ing the onions with a pinch of salt for 2-3 minutes.","Push the onions aside, add more oil, and then add the ground beef. Use a spatula to spread the beef, ensuring as much meat as possible comes into contact with the pan.","Fry the beef for 1 minute, then add all the seasonings. Mix everything and toast the seasonings for 15 seconds.","Add the tomato puree and fry it for 15 seconds. Next, add the tomato sauce with a splash of water, and mix. Allow it to simmer for 1-2 minutes until it thickens.","Remove from the heat and transfer everything to a meal prep container. Let it cool down for a few minutes before storing it in the fridge. Done!"],"notes":["7. Last in the fridge for 3-5 days. Microwave for 2-3 minutes before you want to eat.","Macros recomputed from our per-100g ingredient tables: 735 kcal for the batch vs the book's 639 kcal (whole recipe)."]},"lunch/ready-meals/asian-cucumber-salad":{"id":"lunch/ready-meals/asian-cucumber-salad","name":"Asian cucumber salad","meal":"lunch","servings":1,"calories":142,"protein":5,"carbs":21,"fat":5,"isBase":false,"description":"This salad is simply sick! Single portion. 15 min. From The Felu Cookbook (p. 117).","ingredients":["- 200 g cucumber","- 20 g soy sauce","- 10 g rice vinegar","- 10 g honey","- 5 g sesame seeds","- 1 clove of garlic (≈3 g)","- 1 piece of ginger (≈10 g)","- 2 g sesame oil","- Salt"],"method":["Wash and then cut the cucumber into very thin slices. Place them in a strainer, sprinkle with a pinch of salt, and mix well. Let the cucumber sit for 2–3 hours or overnight until most of the water has drained out, then pat the slices dry. (You can skip this step and add the cucumber directly, but the salad will be a bit more watery.)","Peel and grate the garlic and ginger, then add them to a bowl. Add all the remaining ingredients, followed by the cucumber, and give everything a good stir. Done!"],"notes":["Feel free to switch vegetables. Red bell pepper, carrots, and onions work great in this salad.","Macros recomputed from our per-100g ingredient tables: 142 kcal for the portion vs the book's 111 kcal (whole recipe)."]},"lunch/ready-meals/avo-chicken-wrap":{"id":"lunch/ready-meals/avo-chicken-wrap","name":"Avo chicken wrap","meal":"lunch","servings":1,"calories":452,"protein":40,"carbs":36,"fat":18,"isBase":false,"description":"A burrito with a fresh kick and a ton of protein. Single portion. 15 min. From The Felu Cookbook (p. 104).","ingredients":["- 1 wheat tortilla (20cm or 8inch) (≈45 g)","- ½ chicken breast (120 g)","- 1 medium onion (50 g)","- 20 g tomatoes","- 20 g lettuce","- 15 g shredded mozzarella","- 60 g avocado cream cheese dip (Felu Cookbook p. 300 — not imported)","- 1 g garlic powder","- 0.5 g cumin","- 0.5 g cayenne pepper","- 5 g oil","- Salt and black pepper"],"method":["Chop up onions, tomatoes, and lettuce. Prepare the avocado cream cheese dip. Slice the chicken breast into thin pieces and season with salt, pepper, garlic powder, cumin, and cayenne pepper. Mix the chicken until it‘s thoroughly seasoned.","Add oil into the pan (24cm/9,5inch) on medium heat. Add the onion and fry for 2-3 minutes, then add some more oil and add the chicken. Fry the chicken for 1-2 minutes on each side.","Spread the avo dip onto the tortilla, followed up by the chicken. Then add lettuce, tomatoes, and mozzarella cheese on top and roll it into a burrito shape.","Add burrito back into the pan and toast all 4 sides for 30 seconds each. Done!."],"notes":["The recipe can also be made with a large tortilla if it doesn‘t fit into your medium tortilla.","Macros recomputed from our per-100g ingredient tables: 452 kcal for the portion vs the book's 483 kcal (whole recipe)."]},"lunch/ready-meals/bang-bang-chicken-salad":{"id":"lunch/ready-meals/bang-bang-chicken-salad","name":"Bang bang chicken salad","meal":"lunch","servings":4,"calories":544,"protein":46,"carbs":68.9,"fat":10.5,"isBase":false,"description":"Vermicelli noodle salad with pan-cooked shredded chicken, crunchy cabbage and a creamy bang bang dressing. Makes 4 portions. Source: simplehomeedit.com. **Mayonnaise in the dressing (250g) was swapped for the same weight of Greek yogurt** (cold dressing — no heat warning needed). > **All macros now real.** Sweet chilli sauce (Hacendado) and sriracha now have label values, so every ingredient is computed — no `?` placeholders remain. The crispy fried shallots topping was removed. Because of the mayo→yogurt swap, the computed total still sits below the site's **976 kcal / 38g protein** — expected, not an error.","ingredients":["**Creamy bang bang dressing:**","- 250g Greek yogurt light (Hacendado) *(was 250g whole-egg mayonnaise)*","- 60g sweet chilli sauce (Hacendado)","- 2 tbsp (~32g) tamari (generic/USDA), or soy sauce","- 1 tbsp (15g) rice wine vinegar (Otafuku) (or lime juice)","- 1 tbsp (21g) honey (BM)","- 1 tbsp (~15g) sriracha (optional)","- ½ tsp (~1.5g) garlic, raw, grated","**Chicken:**","- 600g chicken breast (Hacendado) (2 breasts, halved)","- 1 tsp (~2.5g) sweet paprika","- 1 tsp (~2.5g) onion powder","- ¼ tsp black pepper, ground","- 1 tbsp (16g) tamari (generic/USDA), or soy sauce","- 1 tbsp (~12g) brown sugar","- 2 tbsp (28g) olive oil","- 60ml water","**Salad:**","- 200g rice vermicelli noodles, dried","- 115g wombok (napa/Chinese cabbage), shredded","- 115g red/purple cabbage, shredded","- 1 (~60g) carrot, julienned","- 90g bean sprouts (mung)","- 2 (~30g) spring onion (scallion), sliced","- 25g coriander (cilantro), fresh, chopped"],"method":["Combine the dressing ingredients (using Greek yogurt in place of the mayo) in a small bowl.","Marinate the chicken with the paprika, onion powder, pepper, tamari, sugar and oil.","Pan-cook the chicken 3–4 min per side until browned; add the water for the final 3 min, then shred.","Cook the vermicelli per packet, rinse and drain.","Arrange the noodles on a platter; layer the wombok, purple cabbage, carrot, bean sprouts and chicken.","Drizzle with the dressing; top with spring onion and coriander."],"notes":["The dressing mayo was swapped for an equal weight of Greek yogurt light (Hacendado). Cold dressing, so no heat-splitting risk.","Computed total (544 kcal) is lower than the site's 976 kcal because of the mayo→yogurt swap. Sweet chilli sauce (Hacendado) and sriracha are now real, so no `?` placeholders remain; the crispy fried shallots topping was removed.","At 544 kcal/serving it sits comfortably under the 800 kcal meal-fit ceiling.","Strong protein-forward lunch (~46g protein per serving)."]},"lunch/ready-meals/banh-mi":{"id":"lunch/ready-meals/banh-mi","name":"Banh mi","meal":"lunch","servings":1,"calories":751,"protein":61,"carbs":102,"fat":9,"isBase":false,"description":"The famous vietnamese sandwich that is so delicious! Single portion. 15 min. From The Felu Cookbook (p. 110).","ingredients":["- 150 g french baguette","- 1 chicken breast (180 g)","- 20 g Greek yogurt light (Hacendado)","- 10 g hoisin","- 10 g sriracha","- 20 g soy sauce","- 10 g honey","- 10 g rice vinegar","- 100 g pickles","- 3 g oil","- 1 g garlic powder","- 1 g cornstarch","- Bunch cilantro fresh","- Black pepper"],"method":["Start by cutting the baguette in half and scooping out the soft part of the bread to save about half the calories.","Slice the chicken into small, bite-sized pieces.","In a small bowl, combine the soy sauce, rice vinegar, honey, and cornstarch; mix well.","In another small bowl, combine the Greek yogurt light (Hacendado), hoisin, and sriracha; mix well.","Heat oil in a pan over medium heat, and fry the chicken for 1 minute on each side. Season with black pepper and garlic powder.","Add the sauce (the soy sauce mixture) to the pan and stir for about 20 seconds, until it thickens. Then remove from heat.","Place one half of the baguette on a plate and spread the Greek yogurt-hoisin-sriracha sauce on the bottom. Top with the chicken, pickles, and a handful of chopped cilantro. Done!"],"notes":["The soft part of the bread can be baked in the oven to make croutons, or you can place it in a zip-lock bag and use it to feed the birds outside your house.","Macros recomputed from our per-100g ingredient tables: 751 kcal for the portion vs the book's 568 kcal (whole recipe).","Light mayo swapped for Greek yogurt light (Hacendado) — house rule; the macros below already reflect the swap. Stir it in off the heat so it does not split."]},"lunch/ready-meals/beef-burrito-bowl":{"id":"lunch/ready-meals/beef-burrito-bowl","name":"Beef burrito bowl","meal":"lunch","servings":4,"calories":379,"protein":22.8,"carbs":6.3,"fat":29.1,"isBase":false,"description":"Spiced Mexican beef base for burrito bowls — finish with your choice of rice, beans, cheese and toppings. Makes 4 portions of the beef base. Source: simplehomeedit.com.","ingredients":["- 1 tbsp (~7g) sweet paprika","- 1 tbsp (~6g) cumin, ground","- 1 tsp (~2.5g) onion powder","- 1 tsp (~1g) dried oregano","- 1 tsp sea salt flakes","- 1 tbsp (14g) olive oil","- 1 (~110g) brown onion (yellow), finely diced","- 500g minced (ground) beef, 85% lean / 15% fat","- 2 tbsp (~32g) tomato paste","- Mexican toppings to serve: cooked rice, grated cheese (Mozzarella rallado Hacendado), jalapeños, red cabbage, black beans, corn, lime wedges, avocado"],"method":["Combine the paprika, cumin, onion powder, oregano and salt.","Heat the oil and onion in a heavy pan over high heat; cook 1–2 min.","Add the beef and cook 3–4 min, breaking it up, until browned.","Add the spice mix, tomato paste and ⅓ cup (80ml) water; cook 2–3 min.","Serve over rice with your favourite Mexican toppings."],"notes":["Per-serving macros cover the **beef base only** — the build-your-own toppings have no quantities, so they are not counted. Add your chosen rice/beans/cheese on top of these figures.","Cheese topping reuses `Mozzarella rallado (Hacendado)` from the branded list; quantity is yours to choose.","Computed 379 kcal vs site 299 kcal/serving: the site's figure is for a leaner mince; 85/15 beef (254 kcal/100g) plus the oil drive the difference. Verify against your mince label if it is a leaner cut.","Filed as lunch (assembled bowl); works as a light dinner base too.","<\/content>","<\/invoke>"]},"lunch/ready-meals/beef-quesadilla":{"id":"lunch/ready-meals/beef-quesadilla","name":"Beef quesadilla","meal":"lunch","servings":1,"calories":414,"protein":33,"carbs":32,"fat":16,"isBase":false,"description":"Quesadillas all day every day, this time with beef. Single portion. 20 min. From The Felu Cookbook (p. 132).","ingredients":["- 1 wheat tortilla (20cm or 8inch) (≈45 g)","- 100 g ground beef 95/5","- 1 medium onion (50 g)","- 50 g tomatoes","- 25 g shredded mozzarella","- 25 g pickled jalapeno","- 20 g mint sauce (Felu Cookbook p. 291 — not imported)","- 2 g oil","- Salt and black pepper"],"method":["Chop up all vegetables into small pieces.","Place a pan (24cm/9,5inch) on the stove on medium-high heat with 2 g of oil.","Start with frying the onion for 2-3 minutes.","Add the beef and keep frying for another 2 minutes under occasional stirring. Try to separate the beef with a spatula.","Add in tomatoes and jalapenos and fry them for 1-2 minutes—season with salt and pepper.","Lay the tortilla on a plate beside the pan.","Add Mozzarella to the pan and combine everything until the cheese is melted. This will take about 30 seconds.","Transfer the meat to the tortilla you prepared. Take the tortilla and put it back into the pan, bottom side down.","Add the mint sauce on top of the meat.","Flip one side of the tortilla on top of the other to form a quesadilla, and press it down gently with your spatula.","Salt the outside of the tortilla and fry both sides for about 30 seconds. Done!"],"notes":["You can swap out the sauce for something else you like, like ketchup or sriracha.","Macros recomputed from our per-100g ingredient tables: 414 kcal for the portion vs the book's 370 kcal (whole recipe)."]},"lunch/ready-meals/beetroot-feta-wild-rice-salad":{"id":"lunch/ready-meals/beetroot-feta-wild-rice-salad","name":"Beetroot, feta and wild rice salad","meal":"lunch","servings":4,"calories":218,"protein":5.7,"carbs":22.4,"fat":12.2,"isBase":false,"description":"Room-temperature beetroot, feta and wild rice salad (4 servings; scaled down from the site's 8). Imported from simplehomeedit.com.","ingredients":["- 240 g cooked wild rice (Wild rice, cooked, USDA generic)","- 35 g rocket (arugula) leaves (Arugula/rocket, raw, USDA generic)","- 250 g cooked, peeled beetroot, quartered (Beetroot, cooked, USDA generic)","- 20 g sliced red onion (Red onion, USDA generic)","- 20 g roughly chopped walnuts (Walnuts, Hacendado)","- 25 g crumbled feta (Feta, Hacendado)","- ½ lemon, juiced (~25 g) (Lemon juice, fresh, USDA generic)","- 30 ml olive oil (~28 g) (Olive oil, USDA generic)","- ¼ tsp dijon mustard (~1.2 g) (Dijon mustard, Hacendado)","- ½ tbsp honey (~10.5 g) (Honey, BM)","- ½ tsp sea salt flakes (Salt, USDA generic)","- ¼ tsp freshly cracked black pepper (Black pepper, ground, USDA generic)"],"method":["Arrange the wild rice on a large platter and spread it out evenly. Allow it to cool for 5 minutes. Top with the rocket, beetroot, red onion, walnuts and feta.","Combine the lemon juice, olive oil, dijon, honey, salt and pepper in a small jar and drizzle over the salad.","Serve at room temperature, or refrigerate and serve cold."],"notes":["Scaled to 4 servings (all quantities halved from the site's 8-serving recipe). Persian feta substituted with Feta (Hacendado).","Low-protein, vegetable-forward lunch — pair with a protein source to hit the lunch protein floor.","All macros are from real ingredient rows. Computed 218 kcal/serving (vs the site's 370) — lower because the site's number is per its larger serving and uses a richer feta/rice; verify portioning when plating."]},"lunch/ready-meals/breakfast-freezer-burritos":{"id":"lunch/ready-meals/breakfast-freezer-burritos","name":"Breakfast freezer burritos","meal":"lunch","servings":5,"calories":395,"protein":30,"carbs":38,"fat":13,"isBase":false,"description":"Breakfast burritos are perfect for busy mornings where you need a quick breakfast. Makes 5. 50 min. From The Felu Cookbook (p. 272).","ingredients":["- 5 wheat tortillas (18 cm or 7 inch) (≈175 g)","- 250 g deli meat","- 5 eggs (≈275 g)","- 500 g potatoes","- 1 large onions (100 g)","- 75 g shredded mozzarella","- 3 g oil","- 3 g cumin","- 4 g cayenne pepper","- 25 g mint sauce (Felu Cookbook p. 291 — not imported)","- Salt and black pepper"],"method":["Peel and cut the potatoes into thick slices, then into fries and then again into bite-size cubes. 2x2cm or 1x1 inch.","Microwave the potatoes in a bowl for 5 min at 600W.","Dice the onion and cut the deli meat into bite-size pieces. Crack the eggs into a bowl and mix them with a fork.","Add oil to a pan over medium heat and add the microwaved potatoes with a pinch of salt. Fry them for 5-7 minutes, stirring occasionally, until they are slightly golden brown.","Add a bit more oil and then add the onion and deli meat. Continue frying, stirring occasionally, for another 3-5 minutes.","Add cumin, cayenne pepper, salt, and pepper, and mix everything for 30 seconds.","Now add the eggs and cook them for about 1 minute until they are cooked through.","Transfer everything onto 2 plates to cool down for 15-20 minutes. If you wrap them now, the burritos will become soggy.","Meanwhile, make the mint sauce (see chapter).","Prepare 5 tortillas. Separate everything from the pan evenly, add 15g of mozzarella on top of each tortilla, and add 5g of mint sauce per tortilla as well. Wrap the tortillas into 5 burritos, then cover them with a paper towel and put them into a zip-lock bag. Store them in the freezer for up to 3 months.","When ready to eat, take them out of the freezer and microwave for 3-4 minutes. They will be ready to enjoy!"],"notes":["Feel free to add more spices like garlic powder, chili or paprika.","Macros recomputed from our per-100g ingredient tables: 1977 kcal for the batch vs the book's 2035 kcal (whole recipe)."]},"lunch/ready-meals/buffalo-rice-bowl":{"id":"lunch/ready-meals/buffalo-rice-bowl","name":"Buffalo rice bowl","meal":"lunch","servings":1,"calories":605,"protein":48,"carbs":72,"fat":13,"isBase":false,"description":"Rice bowls are one of my favorite weeknight meals. Single portion. 20 min. From The Felu Cookbook (p. 167).","ingredients":["- 180 g ground beef 95/5","- 50 g raw rice","- 1 red bell pepper (150 g)","- 1 medium onion (50 g)","- 1 carrot (100 g)","- 2 g garlic powder","- 1 g cumin","- 1 g oil","- 40 g hot sauce","- 5 g honey","- 20 g water","- 2 g cornstarch","- 1 laughing cow wedge (≈17 g)","- Salt and black pepper"],"method":["Add rice with water in a pot (18cm or 7inch diameter) with a pinch of salt. Place it on a stove on high heat. As soon the water starts to boil, reduce the heat to low, close the lid and let it simmer for 12-15 minutes.","Chop the bell pepper, onion, and carrot into bite-sized pieces.","In a separate glass, combine hot sauce, honey, corn starch, and water and mix well.","In a pan on medium heat, add oil and begin frying the chopped vegetables with a pinch of salt for 5-6 minutes, stirring occasionally.","Push the vegetables to the side of the pan and add more oil. Then, add the ground beef and separate the meat with a spatula to ensure maximum browning.","After 1 minute, add salt, black pepper, cumin, and garlic powder and mix everything together. Continue frying for another minute until the beef is cooked through.","Next, add the sauce and laughing cow wedge to the pan, stirring until the cheese is fully incorporated (approximately 30-45 seconds).","Finally, add the cooked rice to the pan and mix everything together. Your dish is ready!"],"notes":["You can also use cooked white rice to safe some time.","Use different spices like cayenne pepper or turmeric for more flavor.","Macros recomputed from our per-100g ingredient tables: 605 kcal for the portion vs the book's 645 kcal (whole recipe)."]},"lunch/ready-meals/burrito-bowl-meal-prep":{"id":"lunch/ready-meals/burrito-bowl-meal-prep","name":"Burrito bowl (meal prep)","meal":"lunch","servings":5,"calories":516,"protein":56,"carbs":56,"fat":9,"isBase":false,"description":"A meal that can be eaten hot or cold! Makes 5. 60 min. From The Felu Cookbook (p. 276).","ingredients":["- 5 SERVINGS:","- 900 g skinless, boneless chicken thighs","- 250 g raw rice","- 500 g water","- 300 g tomatoes","- 2 limes (≈60 g)","- 2 jalapenos (100 g)","- 1 bell pepper (150 g)","- 4 medium onions (200 g)","- Bunch cilantro","- 2 avocados (140 g)","- 150 g 0.2 % fat cream cheese","- 9 g garlic powder","- 6 g smoked paprika","- 3 g cumin","- 3 g cayenne pepper","- 3 g oil","- Salt and black pepper"],"method":["Add rice and water to a big pot with a pinch of salt. Place it on high heat on the stove. Once the water starts to boil, reduce the heat to low, close the lid, and let it sim - mer for 12-15 minutes.","Preheat the oven to 200°C or 400°F.","In a big bowl, add chicken thighs, 4g oil, 6g garlic powder, 6g smoked paprika, 3g cayenne pepper, 3g cumin, black pepper, and a big pinch of salt. Mix everything until all thighs are covered with seasoning.","Transfer everything into a baking sheet, separate the thighs, and bake them for 15 minutes.","Chop tomatoes, onions, bell pepper, and jalapenos into bite-size pieces and add them to a bowl. Add a bunch of chopped cilantro, a pinch of salt, black pepper, and the juice of 1 lime. Mix everything.","Cut the avocado in half and add the flesh to a bowl, followed by cream cheese, a pinch of salt, black pepper, 3g of garlic powder, and the juice of 1 lime. Mix everything with a fork until it turns to mush.","Once the chicken thighs are ready, lay them on a cutting board and cut them into bite-size pieces. Prepare 5 meal prep containers and distribute the rice, the avocado spread, the pico de gallo, and the chicken evenly. Done!"],"notes":["The avo spread will not turn brown if you have meal prep container that are air tight!","Macros recomputed from our per-100g ingredient tables: 2578 kcal for the batch vs the book's 3060 kcal (whole recipe)."]},"lunch/ready-meals/burrito-bowl":{"id":"lunch/ready-meals/burrito-bowl","name":"Burrito bowl","meal":"lunch","servings":1,"calories":607,"protein":61,"carbs":56,"fat":18,"isBase":false,"description":"A burrito filling is great by itself so why not just plate it up and immediately enjoy! Single portion. 20 min. From The Felu Cookbook (p. 58).","ingredients":["- 200 g skinless, boneless chicken thighs","- 2 g onion powder","- 2 g garlic powder","- 2 g paprika","- 50 g raw rice","- 125 g water","- 6 g curry powder","- 1.5 g cayenne pepper","- ½ avocado (70 g)","- 30 g 0.2 % fat cream cheese","- 15 g Jalapeno hot sauce","- 2 g oil","- Salt and black pepper"],"method":["Add the chicken thighs to a baking sheet.","Add oil on top of the chicken.","Mix salt, onion powder, garlic powder, paprika and black pepper in a small container. And sprinkle seasoning on top of all the chicken thighs and rub them with your hands until well coated.","Bake the chicken in the oven for 20 minutes at 200°C or 400°F.","Add the rice with curry powder, cayenne pepper and a pinch of salt in a pot (18cm or 7inch diameter). Pour in water and close the lid.","Pop it on the stove on high heat until it starts boiling.","Turn down the heat and let it simmer for 12-15 minutes.","Add avocado and cream cheese to a bowl. Add Jalapeno hot sauce. Add a pinch of salt and black pepper, and now smash everything together with a fork until smooth.","Once everything is ready, add chicken with rice on a plate and top it with the avocado dip."],"notes":["Don’t worry about overbaking the chicken thighs, as they tend to take a lot longer to turn dry than a chicken breast would.","Macros recomputed from our per-100g ingredient tables: 607 kcal for the portion vs the book's 627 kcal (whole recipe)."]},"lunch/ready-meals/caesar-chicken-wraps":{"id":"lunch/ready-meals/caesar-chicken-wraps","name":"Caesar chicken wraps","meal":"lunch","servings":4,"calories":526,"protein":64,"carbs":38,"fat":13,"isBase":false,"description":"Caesar chicken in a wrap tastes absolutely delicious! Makes 4. 50 min. From The Felu Cookbook (p. 273).","ingredients":["- 4 wheat tortillas (25 cm or 10 inch) (≈248 g)","- 600 g chicken breast","- 200 g deli meat","- 15 g olive oil","- 4 g garlic powder","- 4 g cayenne pepper","- Salt and black pepper","- 40 g parmesan cheese","- 2 romaine lettuces (≈300 g)","- 40 g Greek yogurt light (Hacendado)","- 20 g mustard","- 1/2 lemon (≈22.5 g)","- 1 clove of garlic (≈3 g)","- 100 g skyr or 0.2 % fat greek yogurt","- Salt"],"method":["Place a bowl on a scale and add all the sauce ingredients; mix well.","Chop the romaine lettuce and grate the Parmesan cheese, then add them to the bowl and mix.","Slice the chicken into bite-sized pieces and place them in a separate bowl. Add olive oil, garlic powder, cayenne pepper, salt, and black pepper, then mix everything thoroughly.","Cut the deli meat into small pieces and set aside.","Heat a little oil in a pan over medium heat, then add the chicken and fry for 1 minute on each side.","Add the deli meat, stir, and continue frying for 30 more seconds. Remove from the heat.","Prepare the wraps and lay them out on a table. Distribute the filling evenly among all four wraps and roll them tightly into burrito shapes.","Wrap them in parchment paper and store in the fridge for up to 5 days."],"notes":["The wraps taste amazing cold from the firdge.","You can also microwave them for 2-3 minutes.","Macros recomputed from our per-100g ingredient tables: 2103 kcal for the batch vs the book's 2121 kcal (whole recipe).","Light mayo swapped for Greek yogurt light (Hacendado) — house rule; the macros below already reflect the swap. Stir it in off the heat so it does not split."]},"lunch/ready-meals/caesar-salad":{"id":"lunch/ready-meals/caesar-salad","name":"Caesar salad","meal":"lunch","servings":1,"calories":452,"protein":63,"carbs":26,"fat":13,"isBase":false,"description":"Caesar salad is a refreshing meal especially during the summer. Single portion. 15 min. From The Felu Cookbook (p. 118).","ingredients":["- 1 chicken breast (180 g)","- 150 g cucumber","- 100 g tomatoes","- 2 roman lettuce (300 g)","- 20 g parmesan cheese","- 4 g olive oil","- Salt and black pepper","**Sauce:**","- 50 g skyr or 0.2 % fat greek yogurt","- 20 g Greek yogurt light (Hacendado)","- 10 g mustard","- 1 g garlic powder","- ½ lemon (juice) (≈22.5 g)","- Salt and black pepper"],"method":["Add all the sauce ingredients into a large bowl and mix well.","Chop all the vegetables and the Parmesan cheese, then add them to the bowl and combine everything.","Cut the chicken into strips. Fry them in a bit of oil with salt and black pepper over medium heat for 3 minutes, then add them on top of the salad. Done!"],"notes":["Feel free to switch vegetables. Red bell pepper, carrots, and olives work really well with this recipe.","One serving of 2-ingredient naan bread tastes great with this salad","Macros recomputed from our per-100g ingredient tables: 452 kcal for the portion vs the book's 514 kcal (whole recipe).","Light mayo swapped for Greek yogurt light (Hacendado) — house rule; the macros below already reflect the swap. Stir it in off the heat so it does not split."]},"lunch/ready-meals/caprese-salad":{"id":"lunch/ready-meals/caprese-salad","name":"Caprese salad","meal":"lunch","servings":1,"calories":271,"protein":25,"carbs":8,"fat":16,"isBase":false,"description":"One of the most classic Italian salads and it’s full of protein! Single portion. 5 min. From The Felu Cookbook (p. 172).","ingredients":["- 125 g fresh mozzarella light","- 150 g tomatoes","- 10 g fresh basil","- 2 g olive oil","- 0.5 g oregano","- Salt and black pepper"],"method":["Cut the Mozzarella and the tomatoes into equal thick slices. Chop up basil.","Place 1 slice of Mozzarella into a plate. Top it with 1 slice of tomato, then again Mozzarella and again tomatoes. Try to build a red and white circle.","Add oregano, pepper and salt on top.","Add olive oil over the entire plate.","Spread basil on top. Done!"],"notes":["This is a classic dish in Italy and is typically served as a starter.","You need fresh Mozzarella for this recipe. The low-moisture shredded Mozzarella will not work.","Macros recomputed from our per-100g ingredient tables: 271 kcal for the portion vs the book's 227 kcal (whole recipe)."]},"lunch/ready-meals/cheeseburger-bowl":{"id":"lunch/ready-meals/cheeseburger-bowl","name":"Cheeseburger bowl","meal":"lunch","servings":1,"calories":544,"protein":48,"carbs":51,"fat":16,"isBase":false,"description":"An alternative way to enjoy a succulent burger. Here’s a deconstructed cheeseburger in a bowl. Single portion. 20 min. From The Felu Cookbook (p. 59).","ingredients":["- 180 g ground beef 95/5","- 50 g raw rice","- 125 g water","- 1 slice american cheese (≈19 g)","- 1 medium onion (50 g)","- 30 g pickles","- 30 g roman lettuce","- 2 g oil","- Salt and black pepper","**Sauce:**","- 10 g Greek yogurt light (Hacendado)","- 5 g mustard","- 10 g ketchup","- 10 g pickle water","- Salt and black pepper"],"method":["Add the rice with a pinch of salt to a pot (18cm or 7inch diameter). Pour in the water and close the lid.","Place it on a stove on high heat until it starts boiling. Turn down the heat to low and let it simmer for 12-15 minutes.","Mix all sauce ingredients in a small glass until smooth.","Chop up the onion, lettuce and pickles into bitesize pieces.","Add oil to a pan on medium-high heat. Add the ground beef and fry on each side for 1 minute. Season well with salt and pepper.","Add onion and mix everything together. Keep frying for another minute or two.","Cover the beef with american cheese and stir everything so the cheese is covered and can melt easily.","Add the rice to a bowl. Cover with beef & cheese mixture. Add pickles and lettuce on the edges and pour sauce on top."],"notes":["Macros recomputed from our per-100g ingredient tables: 544 kcal for the portion vs the book's 538 kcal (whole recipe).","Light mayo swapped for Greek yogurt light (Hacendado) — house rule; the macros below already reflect the swap. Stir it in off the heat so it does not split."]},"lunch/ready-meals/cheeseburger-burrito":{"id":"lunch/ready-meals/cheeseburger-burrito","name":"Cheeseburger burrito","meal":"lunch","servings":1,"calories":578,"protein":49,"carbs":45,"fat":21,"isBase":false,"description":"I combined a cheeseburger with a burrito and it‘s awesome! Single portion. 15 min. From The Felu Cookbook (p. 101).","ingredients":["- 1 wheat tortillas (25cm or 10inch) (≈62 g)","- 180 g ground beef 95/5","- 1 medium onion (50 g)","- 15 g romaine lettuce","- 25 g tomatoes","- 1 slice american cheese (≈19 g)","- 15 g Greek yogurt light (Hacendado)","- 15 g sriracha","- 1 g garlic powder","- 4 g oil","- Salt and black pepper"],"method":["Chop the onion, lettuce, and tomatoes, and combine them in a small bowl with Greek yogurt light (Hacendado)nnaise and sriracha.","Add oil to a 24 cm (9.5 inch) pan over medium-high heat. Add the chopped onion along with a pinch of salt and fry for 3 minutes.","Push the onions to one side of the pan, add a bit more oil, and then add the ground beef. Cover it with parchment paper and press it flat using a spatula and something heavy, like a bottle.","Season the meat with salt, black pepper, and garlic powder, then flip after 1 minute. Cook for another minute, then break up the meat and mix everything together.","Tear the cheese into small pieces, add them to the pan, and wait until they melt.","Place a tortilla on a sheet of parchment paper. Add the lettuce, tomatoes, and sauce, then top with the cheesy beef and roll it into a burrito.","Return the burrito to the pan with a tiny bit of oil and toast on all sides until golden brown. Sprinkle a little salt on the outside for extra flavor.","Eat immediately, or wrap it tightly in parchment paper and store in the fridge or freezer."],"notes":["This recipe can also be prepared for meal prep. Simply multiply the ingredients by 2 or more. Allow the beef to cool down completely before rolling it into the tortilla, as steam can make the burrito soggy in the fridge.","Macros recomputed from our per-100g ingredient tables: 578 kcal for the portion vs the book's 593 kcal (whole recipe).","Light mayo swapped for Greek yogurt light (Hacendado) — house rule; the macros below already reflect the swap. Stir it in off the heat so it does not split."]},"lunch/ready-meals/cheesesteak-sub":{"id":"lunch/ready-meals/cheesesteak-sub","name":"Cheesesteak sub","meal":"lunch","servings":1,"calories":703,"protein":54,"carbs":72,"fat":20,"isBase":false,"description":"Steak and cheese in a sandwich, who deosn‘t like that?! Single portion. 10 min. From The Felu Cookbook (p. 113).","ingredients":["- 120 g french baguette","- 150 g top sirloin","- 1 medium onion (50 g)","- 30 g cheddar","- 30 g evaporated milk","- 1 g cornstarch","- 0.5 g garlic powder","- Salt and black pepper"],"method":["Start by cutting the baguette in half and scooping out the soft part of the bread to save about half the calories.","Next, slice the beef into very fine strips. For easier cutting, place the steak in the freezer for 30 minutes beforehand.","Add to a bowl cheddar, cornstarch, and evaporated milk and mix. Chop up the onion.","Heat oil in a pan over medium heat and begin frying the onion for 3 minutes, stirring occasionally . Add a pinch of salt.","Then, push the onion to the side of the pan, add a bit more oil, and add the beef. Fry the beef for 45-60 seconds on each side. Season with salt, black pepper, and garlic powder.","Turn off the heat and add the cheese. Continue stirring until the cheese melts and the mixture becomes gooey.","Finally, transfer the beef onto the baguette and enjoy!"],"notes":["The soft part of the bread can be baked in the oven to make croutons, or you can place it in a zip-lock bag and use it to feed the birds outside your house.","Macros recomputed from our per-100g ingredient tables: 703 kcal for the portion vs the book's 613 kcal (whole recipe)."]},"lunch/ready-meals/cheesy-beef-burrito":{"id":"lunch/ready-meals/cheesy-beef-burrito","name":"Cheesy beef burrito","meal":"lunch","servings":1,"calories":560,"protein":44,"carbs":43,"fat":23,"isBase":false,"description":"The cheesy burrito that is filled with cheesy and creamy goodness. Single portion. 15 min. From The Felu Cookbook (p. 100).","ingredients":["- 1 wheat tortillas (25cm or 10inch) (≈62 g)","- 100 g ground beef 95/5","- ½ medium onion (25 g)","- 75 g cottage cheese","- 25 g evaporated milk","- 25 g cheddar","- 5 g gochujang","- 1 g garlic powder","- 1 g onion powder","- 0.5 g cayenne pepper","- 0.5 g paprika","- 4 g oil","- Salt and black pepper"],"method":["Place a blender on the scale and add cottage cheese, evaporated milk, cheddar cheese, gochujang, garlic powder, onion powder, paprika, cayenne pepper, and a pinch of salt and black pepper. Blend for 60 seconds.","Next, chop up the onion.","Then, add oil to a 24 cm (9.5 inch) pan over mediumhigh heat. Add the onion and fry for 3 minutes, then add the ground beef. Continue frying both for another 1-2 minutes, stirring occasionally, until the beef gets some color. Add a pinch of salt and black pepper.","Remove the pan from the heat and stir in the cheese sauce for about 1 minute until it becomes creamy.","Transfer the mixture to a tortilla and roll it into a burrito shape. Place the burrito back in the pan and toast on all 4 sides for 30 seconds each. Done!"],"notes":["This recipe can also be prepared for meal prep. Simply multiply the ingredients by 2 or more. Allow the beef to cool down completely before rolling it into the tortilla, as steam can make the burrito soggy in the fridge.","Macros recomputed from our per-100g ingredient tables: 560 kcal for the portion vs the book's 517 kcal (whole recipe)."]},"lunch/ready-meals/cheesy-chicken-burrito":{"id":"lunch/ready-meals/cheesy-chicken-burrito","name":"Cheesy chicken burrito","meal":"lunch","servings":1,"calories":558,"protein":45,"carbs":53,"fat":18,"isBase":false,"description":"Another cheese burrito but this one is with buffallo chicken. Single portion. 15 min. From The Felu Cookbook (p. 102).","ingredients":["- 2 wheat tortillas (20cm or 8inch) (≈90 g)","- ½ chicken breast (120 g)","- 40 g evaporated milk","- 25 g cheddar","- 1 g cornstarch","- 10 g hot sauce","- 1 g garlic powder","- 1 g onion powder","- 0.5 g cayenne pepper","- 0.5 g paprika","- 2 g oil","- Salt and black pepper"],"method":["Slice chicken into thin strips, then place them in a bowl. Add oil, garlic powder, onion powder, cayenne pepper, paprika, and a pinch of salt and black pepper. Mix with tongs until everything is evenly coated.","In another bowl, combine cheddar cheese, cornstarch, evaporated milk, and hot sauce. Mix well.","Heat oil in a 24 cm (9.5 inch) pan over medium-high heat. Add the chicken and fry for 2 minutes, flipping it after 1 minute, until the chicken is cooked through and has a nice color. Then remove the pan from the heat.","Pour the cheese sauce into the pan with the chicken and mix until it turns into a creamy and gooey texture.","Transfer the mixture to a tortilla and roll it into a burrito shape. Place the burrito back in the pan and toast on all 4 sides for 30 seconds each. Done!"],"notes":["This recipe can also be prepared for meal prep. Simply multiply the ingredients by 2 or more. Allow the chicken to cool down completely before rolling it into the tortilla, as steam can make the burrito soggy in the fridge.","Macros recomputed from our per-100g ingredient tables: 558 kcal for the portion vs the book's 442 kcal (whole recipe)."]},"lunch/ready-meal
